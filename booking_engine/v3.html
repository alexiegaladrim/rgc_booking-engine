<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réserver — Le Touquet Golf Resort</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════ Direction artistique Resonance — Le Touquet ══════════
   Mêmes jetons que les écrans client existants (reservation_joueur, eshop) :
   Jost, or #BE9B45, crème, encre chaude. Les --g* de la v2 sont remappés sur
   la gamme chaude pour que les styles en ligne générés en JS suivent. */
:root{
  --gold:#BE9B45; --gold-dark:#A5842F; --gold-light:#F3EAD5; --gold-soft:#FBF6EA;
  --ink:#221C15; --ink-2:#1B150F; --ink-soft:#6B6257;
  --cream:#FAF7F1; --sand:#F3EEE4; --line:#E8E2D6; --line-2:#DDD5C6;
  --green:#5E8C5A; --green-soft:#E9F1E7; --terra:#B4653C; --terra-soft:#F6E9E1;
  --g800:#3A322A; --g700:#5A5147; --g600:#6B6257; --g500:#8C8377; --g400:#B3AA9C;
  --g300:#DDD5C6; --g200:#E8E2D6; --g100:#F1ECE3; --g50:#FAF7F1;
  --paper:#fff; --canvas:#EFEAE1;
  --shadow:0 1px 2px rgba(34,28,21,.04),0 8px 24px rgba(34,28,21,.06);
  --shadow-lg:0 24px 70px rgba(34,28,21,.22);
  --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Jost',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--canvas);
  color:var(--ink);font-size:14.5px;font-weight:400;-webkit-font-smoothing:antialiased;letter-spacing:.1px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
button:disabled{cursor:not-allowed}
b,strong{font-weight:500}
svg{flex:none}
ul{list-style:none}
::selection{background:var(--gold-light)}

/* ══════════ Scène ══════════ */
.stagewrap{display:flex;justify-content:center;padding:0}
.stage{width:100%;background:var(--cream);container-type:inline-size;position:relative}
.stage[data-vp="desktop"]{min-height:100vh}
.stagewrap:has(.stage[data-vp="mobile"]){padding:20px 14px;overflow:hidden;background:radial-gradient(900px 500px at 50% -10%,rgba(190,155,69,.18),transparent 60%),linear-gradient(160deg,#2A2118,#1B150F);min-height:calc(100vh - 0px)}
.stage[data-vp="mobile"]{height:100%;overflow-y:auto}
.stage[data-vp="mobile"]::-webkit-scrollbar{width:0}
/* cadre : en mobile, il contient la modale et le toast (le transform en fait
   le repère des éléments en position fixe) */
.frame{width:100%;display:flex;justify-content:center}
/* format iPhone 17 : 402 × 874 pt, réduit à l'échelle si la fenêtre est plus petite */
.frame:has(> .stage[data-vp="mobile"]){width:402px;height:874px;flex:none;transform-origin:top center;transform:scale(var(--vps,1));
  overflow:hidden;box-shadow:var(--shadow-lg),0 0 0 9px #0d0a07,0 0 0 11px #2a2118;border-radius:38px}
.frame:has(> .stage[data-vp="mobile"]) .sheet-bg{align-items:flex-end;padding:0}
.frame:has(> .stage[data-vp="mobile"]) .sheet{width:100%;max-height:88%;border-radius:22px 22px 0 0}
.frame:has(> .stage[data-vp="mobile"]) .toast{bottom:18px;max-width:calc(100% - 28px)}
.screen{display:none}
.screen.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.inner{max-width:1180px;margin:0 auto}

/* ══════════ Annotations (masquées par défaut) ══════════ */
.node{display:inline-flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:#7a5f1f;border:1px dashed #cdb070;background:#fffaf0;padding:5px 8px;border-radius:4px;white-space:nowrap;letter-spacing:.06em}
.note{border-left:2px dashed #cdb070;padding:3px 0 3px 10px;font-family:'Inter',sans-serif;font-size:11.5px;line-height:1.5;color:#7a6a50;margin:12px 0;background:#fffaf0;letter-spacing:0}
.oob{display:flex;align-items:flex-start;gap:12px;padding:12px 26px;font-family:'Inter',sans-serif;font-size:11.5px;line-height:1.55;color:#7a6a50;border-bottom:1px dashed #cdb070;background:#fffaf0;letter-spacing:0}
.oob b{display:block;color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
body:not(.ann) .node,body:not(.ann) .note,body:not(.ann) .oob{display:none!important}

/* ══════════ Primitives ══════════ */
.ph{background:linear-gradient(135deg,var(--sand),var(--gold-soft));border:1px dashed var(--line-2);border-radius:12px;
  display:grid;place-items:center;color:var(--g500);font-size:11px;letter-spacing:.12em;text-transform:uppercase;overflow:hidden}
.ph.img{background-size:cover;background-position:center;border:0;color:transparent;font-size:0}
.card{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;
  border-radius:999px;padding:14px 24px;font-size:12px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;line-height:1;white-space:nowrap;transition:.18s}
.btn:hover{background:var(--gold-dark)}
.btn[disabled]{background:var(--g200);color:var(--g500)}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sec:hover{background:var(--ink);color:#fff}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold-dark)}
.btn.ghost[disabled],.btn.sec[disabled]{background:transparent;color:var(--g400);box-shadow:inset 0 0 0 1px var(--g200)}
.btn.gold{background:var(--gold);color:#fff}
.btn.gold:hover{background:var(--gold-dark)}
.btn.sm{padding:10px 16px;font-size:10.5px;letter-spacing:1.3px}
.btn.full{width:100%}
.lnk{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px;color:var(--ink);font-size:13px}
.lnk:hover{color:var(--gold-dark)}
.lnk:disabled{color:var(--g400);text-decoration:none}
.h1{font-size:36px;font-weight:300;letter-spacing:.3px;line-height:1.12;text-wrap:balance}
.h1 b{font-weight:500}
.h2{font-size:19px;font-weight:500;letter-spacing:.2px;line-height:1.25}
.h3{font-size:14.5px;font-weight:500;letter-spacing:.2px}
.sub{font-size:14px;color:var(--ink-soft);line-height:1.6;font-weight:300}
.mut{font-size:12.5px;color:var(--g600);line-height:1.5;font-weight:300}
.eyebrow{display:block;font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-dark);font-weight:500;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;
  background:var(--sand);color:var(--g700);border-radius:999px;padding:5px 10px;white-space:nowrap}
.tag.dk{background:var(--ink);color:#fff}
.tag.ol{background:var(--gold-light);color:var(--gold-dark)}
.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:10.5px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--g600);margin-bottom:7px}
.field input,.field select,.field textarea,.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;background:var(--paper);outline:none;transition:.15s}
.field input:focus,.field select:focus,.inp:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.hr{height:1px;background:var(--line);margin:18px 0}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.chkbox{display:flex;align-items:flex-start;gap:11px;font-size:13px;line-height:1.55;color:var(--g700);cursor:pointer}
.chkbox input{accent-color:var(--gold);width:17px;height:17px;margin-top:2px;flex:none}

/* ══════════ En-tête ══════════ */
.appbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.appbar-in{display:flex;align-items:center;gap:18px;padding:12px 32px;max-width:1280px;margin:0 auto}
.wordmark{display:flex;align-items:center;gap:14px;cursor:pointer;line-height:1.15}
.wordmark img{height:40px;display:block}
.wordmark .wm-t{border-left:1px solid var(--line-2);padding-left:14px;font-size:11px;font-weight:500;letter-spacing:2.6px;text-transform:uppercase}
.wordmark .wm-t small{display:block;font-size:8.5px;letter-spacing:3px;color:var(--gold-dark);margin-top:3px}
.ico{height:40px;min-width:40px;border:1px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;color:var(--ink);padding:0 14px;font-size:11px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;white-space:nowrap;background:#fff;transition:.15s}
.ico:hover{border-color:var(--gold);color:var(--gold-dark)}
.ico .av{width:26px;height:26px;font-size:10px;margin-left:-8px}
.cartbtn{position:relative;padding:0 12px}
.cartbtn b{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--gold);
  color:#fff;font-size:10.5px;font-weight:500;display:none;place-items:center;padding:0 5px;letter-spacing:0;border:2px solid #fff}
.cartbtn.has b{display:grid}
.av{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--gold-light);display:inline-grid;place-items:center;
  font-size:12px;font-weight:500;flex:none;letter-spacing:1px}
.av.lt{background:var(--sand);color:var(--g700)}

/* ══════════ Mise en page ══════════ */
.pad{padding:30px 32px 64px;max-width:1244px;margin:0 auto}
.back{font-size:11px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;color:var(--g600);margin-bottom:16px;display:inline-flex;gap:6px}
.back:hover{color:var(--gold-dark)}
.scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
.aside{position:sticky;top:88px}
.aside > .card{padding:22px!important;border-radius:20px}
.fil{display:flex;gap:0;flex-wrap:wrap;margin-bottom:22px;align-items:center}
.fil span{font-size:10.5px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;color:var(--g400);white-space:nowrap;display:flex;align-items:center}
.fil span + span::before{content:"";width:34px;height:1px;background:var(--line-2);margin:0 12px}
.fil span.on{color:var(--ink)}
.fil span.on::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:8px}
.fil span.done{color:var(--gold-dark)}
.sect{display:flex;align-items:center;gap:10px;font-size:10.5px;font-weight:500;letter-spacing:2.6px;text-transform:uppercase;color:var(--gold-dark);margin:30px 0 14px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}

/* bandeau de tarif */
.pbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-radius:18px;padding:18px 22px;margin-bottom:22px;
  background:radial-gradient(500px 200px at 0% 0%,rgba(190,155,69,.28),transparent 70%),linear-gradient(135deg,#2A2118,#1B150F);
  color:rgba(243,234,213,.78);font-size:13.5px;line-height:1.55;font-weight:300}
.pbar > div{flex:1;min-width:220px}
.pbar b{color:#fff;font-weight:500}
.pbar .btn{background:var(--gold);color:#fff}
.pbar .btn:hover{background:#fff;color:var(--ink)}
.pbar .lnk{color:#F3EAD5}
.pbar.on{background:var(--gold-soft);color:var(--g700);border:1px solid var(--gold-light)}
.pbar.on b{color:var(--ink)}
.pbar.on .lnk{color:var(--ink)}
.pbar.on .av{background:var(--gold);color:#fff}

/* prix */
.price{font-size:24px;font-weight:400;letter-spacing:-.2px;text-align:right;white-space:nowrap;line-height:1.15}
.price small{display:block;font-size:10px;font-weight:400;color:var(--g500);letter-spacing:1.2px;text-transform:uppercase;margin-top:4px}
.was{text-decoration:line-through;text-decoration-color:var(--terra);color:var(--g500);font-weight:300;font-size:.66em;margin-right:7px;letter-spacing:0}
.stl{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;background:var(--gold-light);color:var(--gold-dark);
  border-radius:999px;padding:4px 9px;margin-top:6px;white-space:nowrap}
.stl::before{content:"✦";font-size:9px}

/* héros du portail */
.hero{position:relative;min-height:540px;display:flex;align-items:flex-end;color:#fff;background:#1B150F center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,15,10,.62) 0%,rgba(20,15,10,.25) 55%,rgba(20,15,10,0) 80%),linear-gradient(180deg,rgba(20,15,10,.3) 0%,rgba(20,15,10,.15) 35%,rgba(20,15,10,.85) 100%)}
.hero-in{position:relative;width:100%;max-width:1244px;margin:0 auto;padding:60px 32px 110px}
.hero .eyebrow{color:#F6E7C1;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.hero h1{font-size:54px;font-weight:300;letter-spacing:.5px;line-height:1.05;max-width:720px;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.hero h1 b{font-weight:500}
.hero p{font-size:16px;font-weight:400;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.6);max-width:560px;margin-top:14px;line-height:1.6}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.badges span{border:1px solid rgba(243,234,213,.4);border-radius:999px;padding:7px 14px;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;backdrop-filter:blur(6px);background:rgba(20,15,10,.45);color:#fff}
.quick{position:relative;margin:-64px auto 0;max-width:1180px;padding:0 32px;z-index:2}
.quick .card{display:grid;grid-template-columns:repeat(3,1fr);padding:8px;border-radius:22px;box-shadow:var(--shadow-lg)}
.quick button{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;text-align:left;transition:.15s}
.quick button:hover{background:var(--gold-soft)}
.quick button + button{box-shadow:-1px 0 0 var(--line)}
.quick .qi{width:44px;height:44px;border-radius:14px;background:var(--gold-light);color:var(--gold-dark);display:grid;place-items:center;flex:none}
.quick b{display:block;font-size:15px}
.quick small{display:block;font-size:12px;color:var(--g600);font-weight:300;margin-top:2px}
.quick .go{margin-left:auto;color:var(--gold)}

/* portes */
.door{padding:0;display:flex;flex-direction:column;text-align:left;cursor:pointer;overflow:hidden;transition:.2s}
.door:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(34,28,21,.12);border-color:var(--gold-light)}
.door .ph{height:230px;border-radius:0;margin:0}
.door > :not(.ph){margin-left:22px;margin-right:22px}
.door > .tag{margin-top:-16px;position:relative;align-self:flex-start;background:#fff;box-shadow:var(--shadow)}
.door > b{margin-top:12px;font-size:24px;font-weight:300}
.door > .sub{margin-top:6px}
.door .foot{margin-top:auto;padding:18px 0 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px solid var(--line);margin-top:18px}
.door .foot .price{font-size:20px}
.door > .tag,.pack > .tag,.xsell > .tag{align-self:flex-start}
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:0;align-items:stretch;border-radius:22px;overflow:hidden;background:var(--ink);color:#F3EAD5;margin-top:48px}
.split .ph{border-radius:0;min-height:320px}
.split > div:last-child{padding:40px}
.split .h1{color:#fff;font-size:32px}
.split .sub{color:rgba(243,234,213,.75)}
.split ul{margin:18px 0 24px;display:grid;gap:10px}
.split li{display:flex;gap:10px;font-size:14px;font-weight:300}
.split li::before{content:"✦";color:var(--gold)}

/* recherche golf */
.searchbar{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:0;padding:8px;margin-bottom:16px;border-radius:20px}
.sb-f{padding:8px 16px}
.sb-f + .sb-f{box-shadow:-1px 0 0 var(--line)}
.sb-f > span{display:block;font-size:10px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold-dark);margin-bottom:6px}
.sb-f select,.sb-f input{width:100%;height:40px;border:0;border-radius:10px;padding:0 8px;background:var(--cream);font-size:14px}
.navd{width:36px;height:40px;border:1px solid var(--line);border-radius:10px;font-size:16px;color:var(--ink);flex:none;background:#fff}
.navd:hover:not(:disabled){border-color:var(--gold);color:var(--gold-dark)}
.navd:disabled{color:var(--g300)}
.qty{display:inline-flex;align-items:center;gap:12px;height:40px}
.qty button{width:34px;height:34px;border:1px solid var(--line-2);border-radius:50%;font-size:15px;line-height:1;background:#fff;transition:.15s}
.qty button:hover:not(:disabled){border-color:var(--gold);color:var(--gold-dark)}
.qty button:disabled{color:var(--g300);border-color:var(--g200)}
.qty b{min-width:16px;text-align:center;font-size:16px}
.qty.sm{height:32px;gap:9px}
.qty.sm button{width:30px;height:30px}
.daystrip{display:flex;gap:8px;overflow-x:auto;margin:4px 0 22px;padding:2px 2px 6px}
.daystrip::-webkit-scrollbar{height:0}
.day{min-width:86px;flex:1;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;background:var(--paper);transition:.15s}
.day:hover{border-color:var(--gold)}
.day.on{background:var(--ink);border-color:var(--ink);color:#fff}
.day.on .mut{color:#c9bfae}
.day .dd{font-size:13px;font-weight:500;text-transform:capitalize}
.day .pp{font-size:12px;font-weight:500;margin-top:6px;color:var(--gold-dark)}
.day.on .pp{color:var(--gold-light)}
.day.full .pp{color:var(--g400);font-weight:300}
.crs{padding:0;margin-bottom:16px;overflow:hidden}
.crs.off{background:var(--paper)}
.crs.off .crs-img{filter:grayscale(.8);opacity:.6}
.crs-h{display:flex;gap:20px;align-items:stretch;padding:0}
.crs-img{width:210px;flex:none;background:var(--sand) center/cover;min-height:150px}
.crs-t{flex:1;min-width:0;padding:20px 0}
.crs-h .price{padding:20px 22px 0 0}
.crs > :not(.crs-h){margin:0 22px 20px}
.crs .gtimes{margin-top:0;padding-top:16px;border-top:1px solid var(--line)}
.gtimes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.gtime{border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;min-width:74px;background:var(--paper);transition:.15s}
.gtime:hover{border-color:var(--gold);background:var(--gold-soft)}
.gtime b{display:block;font-size:15px;font-weight:500}
.gtime i{display:block;font-style:normal;font-size:10px;letter-spacing:.5px;color:var(--g500);margin-top:1px}
.gtime.more{color:var(--gold-dark);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:500}

/* bandeau d'écran avec photo */
.band{position:relative;border-radius:22px;overflow:hidden;min-height:190px;display:flex;align-items:flex-end;color:#fff;margin-bottom:24px;background:#1B150F center/cover}
.band::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(27,21,15,.85),rgba(27,21,15,.25))}
.band > div{position:relative;padding:26px 30px}
.band .eyebrow{color:var(--gold-light)}
.band .h1{color:#fff}
.band .sub{color:#EDE5D6}

/* joueurs */
.prow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .pb{flex:1;min-width:0}
.prow .pb b{display:block;font-size:15px}
.prow .pp{text-align:right;font-weight:500;white-space:nowrap;font-size:17px}
.prow.warn .av{background:var(--terra-soft);color:var(--terra)}
.optrow{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.optrow:first-child{border-top:0}
.optrow > div:first-child{flex:1;min-width:0}
.sumline{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:6px 0;color:var(--g700);font-weight:300}
.sumline b{color:var(--ink);white-space:nowrap;font-weight:500}
.sumtot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--line);margin-top:12px;padding-top:14px}
.sumtot .h3{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--g600)}
.sumtot b{font-size:30px;font-weight:300;letter-spacing:-.3px}
.alert{display:flex;gap:14px;align-items:flex-start;border:1px solid #EBCDBB;background:var(--terra-soft);border-radius:16px;padding:15px 16px;margin:14px 0;font-size:13.5px;line-height:1.55;color:#6d3f25;font-weight:300}
.alert b{color:#4b2914;font-weight:500}
.alert .ic{width:28px;height:28px;border-radius:9px;background:var(--terra);color:#fff;display:grid;place-items:center;font-weight:500;font-size:13px;flex:none}
.alert.soft{border-color:#EAD9AD;background:#FBF3DF;color:#5C4A28}
.alert.soft b{color:var(--ink)}
.alert.soft .ic{background:var(--gold)}

/* onglets & puces */
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tabs button{padding:12px 4px;margin-right:18px;font-size:11px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:var(--g500);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.tabs button i{font-style:normal;font-size:10px;color:#fff;background:var(--gold);border-radius:10px;padding:1px 7px;margin-left:7px;letter-spacing:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font-size:12.5px;color:var(--ink);background:var(--paper);transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:disabled{color:var(--g400)}

/* compétitions */
.comp{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:22px;padding:22px;margin-bottom:16px;align-items:start;transition:.15s}
.comp:hover{border-color:var(--gold-light)}
.cdate{background:var(--ink);color:#fff;border-radius:14px;text-align:center;padding:12px 4px;line-height:1.1}
.cdate small{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:1.8px;color:var(--gold-light)}
.cdate b{display:block;font-size:32px;font-weight:300;margin:2px 0}
.res.past .cdate{background:var(--sand);color:var(--g600)}
.res.past .cdate small{color:var(--g500)}
.cond{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.bar{height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:14px;max-width:300px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-dark))}
.cside{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:170px}
.checks{display:grid;gap:0}
.ck{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line);font-size:14px}
.ck:first-child{border-top:0}
.ck .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;margin-top:0}
.ck.ok .ic{background:var(--green-soft);color:var(--green)}
.ck.ko .ic{background:var(--terra);color:#fff}
.ck.ko b{color:var(--terra)}
.ck > div{flex:1;min-width:0}
.ck small{display:block;color:var(--g600);font-size:12.5px;margin-top:2px;line-height:1.5;font-weight:300}
.radios{display:grid;gap:10px}
.radio{display:flex;gap:13px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;cursor:pointer;text-align:left;width:100%;background:var(--paper);transition:.15s}
.radio:hover{border-color:var(--gold)}
.radio.on{border-color:var(--gold);background:var(--gold-soft)}
.radio .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:none;position:relative;align-self:flex-start;margin-top:1px}
.radio.on .dot{border-color:var(--gold)}
.radio.on .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--gold)}
.radio > div{flex:1;min-width:0}
.radio small{display:block;color:var(--g600);font-size:12px;margin-top:3px;line-height:1.45;font-weight:300}
.radio.dis{opacity:.5;cursor:not-allowed}

/* cours */
.pro{display:flex;gap:14px;align-items:center}
.pro .ph{width:56px;height:56px;border-radius:50%;flex:none;border:0;background:linear-gradient(135deg,var(--ink),#4a3c2c);color:var(--gold-light);font-size:15px;letter-spacing:1px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wcol h6{font-size:12px;font-weight:500;text-align:center;padding:9px 0;margin-bottom:10px;background:var(--sand);border-radius:12px;letter-spacing:.5px}
.wcol h6 small{display:block;font-weight:300;color:var(--g600);font-size:11px}
.pills{display:grid;gap:6px}
.pill{border:1px solid var(--line);border-radius:999px;padding:8px 0;font-size:13px;font-weight:400;text-align:center;background:var(--paper);width:100%;transition:.15s}
.pill:hover{border-color:var(--gold);background:var(--gold-soft)}
.pill.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.wcol .none{font-size:11px;color:var(--g400);text-align:center;padding:8px 0}
.lesson{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:20px;padding:0;margin-bottom:14px;align-items:center;overflow:hidden}
.lesson::before{content:"";align-self:stretch;min-height:120px;background:var(--lesson-img,linear-gradient(135deg,var(--sand),var(--gold-soft))) center/cover}
.lesson > .cside{padding-right:22px}
.lesson > div:first-of-type{padding:18px 0}
.pack{padding:22px;display:flex;flex-direction:column;gap:8px}
.pack .foot{margin-top:auto;padding-top:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px solid var(--line)}

/* panier & maintien */
.hold{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid #EAD9AD;background:#FBF3DF;border-radius:14px;
  padding:11px 16px;font-size:13px;color:#5C4A28;margin-bottom:20px;line-height:1.5;font-weight:300}
.hold::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(190,155,69,.2);flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(190,155,69,0)}}
.hold span:nth-child(2){flex:1;min-width:200px}
.hold b{color:var(--ink);font-weight:500}
.hold .holdTimer{font-variant-numeric:tabular-nums}
.hold.dead{border-color:#EBCDBB;background:var(--terra-soft)}
.hold.dead::before{background:var(--terra);animation:none;box-shadow:none}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:20px 0;border-top:1px solid var(--line)}
.cline:first-child{border-top:0;padding-top:6px}
.cline .cl-p{text-align:right}
.cline ul{margin-top:10px;display:grid;gap:4px;background:var(--cream);border-radius:12px;padding:10px 12px}
.cline li{display:flex;justify-content:space-between;gap:14px;font-size:12.5px;color:var(--g600);font-weight:300}
.cline li b{font-weight:500;color:var(--ink);white-space:nowrap}
.xsell{padding:0 0 18px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.xsell > :not(.ph){margin-left:18px;margin-right:18px}
.xsell .ph{height:150px!important;margin:0 0 10px!important;border-radius:0!important}
.xsell .foot{margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.done-t{font-size:10.5px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;color:var(--green)}
.codebox{display:flex;gap:8px}
.codebox input{flex:1;min-width:0;height:44px;border:1.5px solid var(--line);border-radius:999px;padding:0 16px;text-transform:uppercase;outline:none}
.codebox input:focus{border-color:var(--gold)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;padding:12px 0}
.sw i{width:42px;height:24px;border-radius:12px;background:var(--line);flex:none;position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on i{background:var(--gold)}
.sw.on i::after{transform:translateX(18px)}
.qr{width:92px;height:92px;flex:none;border-radius:12px;padding:8px;background:#fff;border:1px solid var(--line);position:relative;
  background-image:repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%);background-size:12px 12px;background-origin:content-box;background-clip:content-box}
.qr::after{content:"";position:absolute;inset:36%;background:#fff url(favicon.png) center/70% no-repeat;border-radius:4px}
.qr.lg{width:200px;height:200px;background-size:18px 18px;padding:14px}

/* espace perso */
.mcard{border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px;min-height:230px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(420px 260px at 100% 0%,rgba(190,155,69,.55),transparent 65%),linear-gradient(135deg,#2A2118,#120e0a);box-shadow:var(--shadow-lg)}
.mcard::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(243,234,213,.14)}
.mcard .mut{color:#c7bba8}
.mcard .tag{background:rgba(243,234,213,.12);color:var(--gold-light)}
.ttable{width:100%;border-collapse:collapse;font-size:14px}
.ttable th{font-size:10px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold-dark);text-align:left;padding:12px;border-bottom:1px solid var(--line)}
.ttable td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-weight:300}
.ttable tr:last-child td{border-bottom:0}
.ttable td.r,.ttable th.r{text-align:right;white-space:nowrap}
.ttable td b{font-weight:500}
.res{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:18px;padding:18px 20px;margin-bottom:12px;align-items:start}
.res.past{background:var(--cream);box-shadow:none}
.res .acts{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.prog{display:flex;gap:5px;margin-top:10px}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--gold)}
.hello{display:flex;align-items:center;gap:16px}

/* feuille modale & toast */
.sheet-bg{position:fixed;inset:0;background:rgba(27,21,15,.5);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center;padding:18px}
.sheet-bg.on{display:flex}
.sheet::-webkit-scrollbar{width:0}
.sheet{background:var(--paper);border-radius:24px;width:min(540px,100%);max-height:calc(100vh - 40px);overflow-y:auto;padding:28px 28px 24px;box-shadow:var(--shadow-lg);animation:fade .25s ease}
.sheet .h2{font-size:24px;font-weight:300}
.sheet .x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);font-size:14px;color:var(--g600);flex:none}
.sheet .x:hover{border-color:var(--gold);color:var(--gold-dark)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#F3EAD5;border-radius:999px;
  padding:12px 22px;font-size:13.5px;z-index:300;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px);box-shadow:var(--shadow-lg);font-weight:300}
.toast b{color:var(--gold)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.appfoot{background:var(--ink);color:#bfb3a1;padding:40px 32px;font-size:12.5px;font-weight:300;margin-top:40px}
.appfoot .inner{display:flex;gap:28px;flex-wrap:wrap;align-items:center}
.appfoot img{height:34px;filter:brightness(0) invert(1);opacity:.85}
.appfoot span:first-of-type{margin-right:auto}
.okmark{width:64px;height:64px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:28px;margin-bottom:14px}

/* bouton discret de présentation : bascule desktop / cadre mobile */
.vptog{position:fixed;left:14px;bottom:14px;z-index:400;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:rgba(34,28,21,.55);color:#F3EAD5;opacity:.28;transition:.2s;backdrop-filter:blur(6px)}
.vptog:hover,.vptog:focus-visible{opacity:1;background:var(--ink)}
.vptog .i-desk{display:none}
body.vp-mobile .vptog .i-desk{display:block}
body.vp-mobile .vptog .i-mob{display:none}

/* ══════════ Mobile (conteneur) ══════════ */
@container (max-width:900px){
  .two{grid-template-columns:1fr}
  .aside{position:static}
  .g3{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(7,96px);overflow-x:auto;padding-bottom:4px}
  .quick .card{grid-template-columns:1fr}
  .quick button + button{box-shadow:0 -1px 0 var(--line)}
  .split{grid-template-columns:1fr}
}
@container (max-width:560px){
  .pad{padding:20px 18px 48px}
  .appbar-in{padding:10px 16px;gap:8px}
  .wordmark img{height:30px}
  .wordmark .wm-t{display:none}
  .ico{padding:0 11px}
  .ico .lbl{display:none}
  .ico .av{margin:0}
  .g2{grid-template-columns:1fr}
  .h1{font-size:28px}
  .hero{min-height:520px}
  .hero::before{background:linear-gradient(180deg,rgba(20,15,10,.55) 0%,rgba(20,15,10,.5) 45%,rgba(20,15,10,.88) 100%)}
  .hero .eyebrow{letter-spacing:2px}
  .hero p{font-size:15px}
  .badges span{font-size:9.5px;padding:6px 11px}
  .hero-in{padding:40px 20px 96px}
  .hero h1{font-size:36px}
  .quick{padding:0 16px}
  .searchbar{grid-template-columns:1fr 1fr}
  .searchbar .sb-f:first-child{grid-column:1/-1;box-shadow:0 1px 0 var(--line)}
  .searchbar .sb-f:nth-child(2){box-shadow:none}
  .scr-head .node{display:none!important}
  .crs-h{flex-wrap:wrap;gap:0}
  .crs-img{width:100%;min-height:130px}
  .crs-t{padding:16px 20px 4px;flex:1 1 100%}
  .crs-h .price{flex:1 1 100%}
  .pbar{padding:16px}
  .pbar .av{display:none}
  .crs-h .price{padding:0 20px 14px;text-align:left}
  .crs > :not(.crs-h){margin:0 20px 18px}
  .comp{grid-template-columns:64px minmax(0,1fr);gap:14px;padding:18px}
  .comp .cside{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;min-width:0}
  .comp .cside .price{text-align:left}
  .cdate b{font-size:24px}
  .res{grid-template-columns:60px minmax(0,1fr);padding:16px}
  .res .acts{grid-column:1/-1;flex-direction:row;justify-content:flex-start;flex-wrap:wrap}
  .lesson{grid-template-columns:1fr}
  .lesson::before{min-height:120px}
  .lesson > div{padding:0 18px}
  .lesson > .cside{padding:0 18px 18px;flex-direction:row;align-items:center;justify-content:space-between;min-width:0}
  .ttable .hide-s{display:none}
  .band > div{padding:20px}
  .split > div:last-child{padding:26px}
  .fil span + span::before{width:14px;margin:0 8px}
  .appfoot{padding:28px 18px}
}
</style>
</head>
<body>

<div class="stagewrap">
<div class="frame" id="frame">
<div class="stage" id="stage" data-vp="desktop">

  <header class="appbar">
    <div class="appbar-in">
      <div class="wordmark" data-go="accueil"><img data-logo src="" alt="Resonance Golf Collection"><span class="wm-t">Le Touquet<small>Golf Resort</small></span></div>
      <div style="flex:1"></div>
      <button class="ico" data-act="site" title="Changer de golf">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>
        <span class="lbl">Le Touquet</span></button>
      <button class="ico" id="accBtn" data-act="account"></button>
      <button class="ico cartbtn" id="cartBtn" data-go="panier" title="Panier">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1.4 12H5.4L4 7Z"/><path d="M9 7V5.5a3 3 0 0 1 6 0V7"/></svg>
        <b id="cartCount">0</b></button>
    </div>
  </header>

  <section class="screen" id="sc-accueil" data-title="Portail du golf · 3 portes"><div id="v-accueil"></div></section>
  <section class="screen" id="sc-gf" data-title="Green fee · 1 — Date, joueurs & départs"><div class="pad" id="v-gf"></div></section>
  <section class="screen" id="sc-gf-joueurs" data-title="Green fee · 2 — Joueurs, tarifs & options"><div class="pad" id="v-gf-joueurs"></div></section>
  <section class="screen" id="sc-comp" data-title="Compétitions · 1 — Calendrier"><div class="pad" id="v-comp"></div></section>
  <section class="screen" id="sc-comp-inscr" data-title="Compétitions · 2 — Inscription & éligibilité"><div class="pad" id="v-comp-inscr"></div></section>
  <section class="screen" id="sc-cours" data-title="Cours · 1 — Catalogue (individuel, collectif, stages, carnets)"><div class="pad" id="v-cours"></div></section>
  <section class="screen" id="sc-cours-ind" data-title="Cours · 2 — Cours individuel : pro & créneau"><div class="pad" id="v-cours-ind"></div></section>
  <section class="screen" id="sc-cross" data-title="Ajouté au panier · suggestions"><div class="pad" id="v-cross"></div></section>
  <section class="screen" id="sc-panier" data-title="Panier commun"><div class="pad" id="v-panier"></div></section>
  <section class="screen" id="sc-checkout" data-title="Checkout — compte & paiement"><div class="pad" id="v-checkout"></div></section>
  <section class="screen" id="sc-confirm" data-title="Confirmation"><div class="pad" id="v-confirm"></div></section>
  <section class="screen" id="sc-espace" data-title="Espace personnel"><div class="pad" id="v-espace"></div></section>

  <footer class="appfoot"><div class="inner"><img data-logo src="" alt=""><span>Le Touquet Golf Resort · Avenue du Golf, 62520 Le Touquet-Paris-Plage · 03 21 06 28 00</span><span>CGV</span><span>Mentions légales</span><span>Contact</span></div></footer>
</div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
</div>
</div>

<button class="vptog" id="vpTog" title="Basculer vue mobile / desktop (touche M)" aria-label="Basculer vue mobile / desktop">
  <svg class="i-mob" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18h2"/></svg>
  <svg class="i-desk" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
</button>

<script>
/* ═════════ Outils ═════════ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const eur=n=>(Math.round(n*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+' €';
const plural=(n,s,p)=>n+' '+(n>1?(p||s+'s'):s);
const NOW=new Date('2026-09-17T11:00:00');          /* horloge figée de la démo */
const TODAY='2026-09-17', DMIN='2026-09-18', DMAX='2026-12-20';
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MABR=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const DAYS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const dobj=k=>new Date(k+'T12:00:00');
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dshift=(k,n)=>{const d=dobj(k);d.setDate(d.getDate()+n);return dkey(d)};
const fday=k=>{const d=dobj(k);return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]};
const fshort=k=>{const d=dobj(k);return DAYS[d.getDay()].slice(0,3)+'. '+d.getDate()+' '+MABR[d.getMonth()]};
const fdm=k=>{const d=dobj(k);return d.getDate()+' '+MONTHS[d.getMonth()]};
const wday=k=>dobj(k).getDay();

    let p=base;
    if(s==='abonne')p=c.id==='mer'?60:0;
    else if(s==='reseau')p=base*.6;
    else if(s==='jeune')p=base*.5;
    else if(s==='senior')p=isWe(k)?base:base*.65;
    else if(s==='licencie')p=base*.8;
    p=Math.round(p);
    if(p<best.p)best={p,st:s};
  });
  return {...best,pub:base};
}
const LK={abonne:.8,reseau:.9,jeune:.7};
function lessonPrice(base,sts){
  let best={p:base,st:null};
  (sts||[]).forEach(s=>{if(LK[s]){const p=Math.round(base*LK[s]);if(p<best.p)best={p,st:s}}});
  return {...best,pub:base};
}
function stagePrice(s,sts){
  if(s.kid)return {p:s.p,st:null,pub:s.p};
  const k={abonne:.9,jeune:.8};let best={p:s.p,st:null};
  (sts||[]).forEach(x=>{if(k[x]){const p=Math.round(s.p*k[x]);if(p<best.p)best={p,st:x}}});
  return {...best,pub:s.p};
}
function optPrice(o,c,sts){
  const base=c&&c.nine&&o.p9!=null?o.p9:o.p;
  if((sts||[]).includes('abonne')&&o.pa!=null)return {p:c&&c.nine&&o.id==='voit'?15:o.pa,pub:base,st:'abonne'};
  return {p:base,pub:base,st:null};
}
/* compétition : droit de jeu + green fee du jour ; l'abonné ne paie que le droit de jeu */
function compPrice(cp,sts){
  sts=sts||[];
  const c=crs(cp.crs), g=gfPrice(c,cp.date,sts);
  const gf=sts.includes('abonne')?0:g.p;
  const dj=sts.includes('jeune')&&cp.djJ?cp.djJ:cp.dj;
  const pubT=cp.dj+gfPub(c,cp.date);
  const st=sts.includes('abonne')?'abonne':(g.st||(dj<cp.dj?'jeune':null));
  return {dj,gf,p:dj+gf,pub:pubT,gfPub:gfPub(c,cp.date),st};
}
/* affichage d'un prix avec le prix public barré */
function pr(x,opt){
  opt=opt||{};
  const inc=x.p===0&&x.pub>0;
  const main=inc?'Inclus':eur(x.p);
  return (x.p<x.pub?`<span class="was">${eur(x.pub)}</span>`:'')+main
    +(opt.small?`<small>${opt.small}</small>`:'')
    +(x.st&&!opt.nost?`<br><span class="stl">Tarif ${ST[x.st].n}</span>`:'');
}

function slots(c,k){
  const out=[];
  for(let m=toMin(c.from);m<=toMin(c.to);m+=c.cad){
    const t=toT(m), h=hash(c.id+k+t);
    let free=[4,4,3,2,0,1,4,2,0,3,4,1][h%12];
    if(isWe(k)&&h%3===0)free=0;
    out.push({t,free});
  }
  return out;
}
const inMoment=(t,mo)=>mo==='all'||(mo==='am'?toMin(t)<720:toMin(t)>=720);
function openSlots(c,k,pax,mo){return slots(c,k).filter(s=>s.free>=pax&&inMoment(s.t,mo))}

  const start=(()=>{const x=dshift(g.date,-3);return x<DMIN?DMIN:x})();
  const days=Array.from({length:9},(_,i)=>dshift(start,i)).filter(k=>k<=DMAX);
  const G2MAX=14;
  const rows=CRS.map(c=>{
    const ok=openSlots(c,g.date,g.pax,g.moment);
    const blocked=!!(c.idxMax&&u&&u.idx>c.idxMax);

function playerInfo(p,i){
  const u=me();
  if(p.type==='self')return u
    ?{n:u.n,you:true,st:u.st,idx:u.idx,sub:u.st.map(s=>ST[s].n).join(' · ')}
    :{n:'Vous',you:true,st:[],idx:null,sub:'Non connecté·e · prix public',anon:true};
  if(p.type==='acc'){const x=PROFILES[p.id];return {n:x.n,st:x.st,idx:x.idx,sub:'Compte rattaché · '+x.st.map(s=>ST[s].n).join(' · ')}}
  if(p.type==='lic')return {n:p.n,st:['licencie'],idx:p.idx,sub:'Licence '+p.lic+' · vérifiée FFGolf'};
  return {n:p.n||'Joueur '+(i+1),st:[],idx:null,sub:'Invité·e sans compte · prix public',guest:true};
}
function gfCalc(l){
  const c=crs(l.crs), items=[];
  l.players.forEach((p,i)=>{const pi=playerInfo(p,i);items.push({n:pi.n+(pi.you?' (vous)':''),...gfPrice(c,l.d,pi.st),grp:'gf'})});
  GOPTS.forEach(o=>{const q=l.opts[o.id]||0;if(!q)return;
    const x=optPrice(o,c,mySt());items.push({n:`${o.n} × ${q}`,p:x.p*q,pub:x.pub*q,st:x.st,grp:'gf'})});
  return items;
}
function gfIdxState(){
  const g=S.gf, c=crs(g.crs);
  if(!c.idxMax)return {need:false};
  const info=g.players.map(playerInfo);
  const over=info.filter(x=>x.idx!=null&&x.idx>c.idxMax);
  const unknown=info.filter(x=>x.idx==null);
  return {need:true,over,unknown,ok:!over.length&&(!unknown.length||g.idxOk)};
}

function eligibility(cp,x,who){

  if(!x)return [{ok:false,n:'Compte requis',d:'L\'inscription vérifie la licence, le certificat et l\'index : elle se fait depuis un compte.',fix:'login',fixN:'Me connecter'}];

  if(x.idx!=null)ck.push(x.idx<=cp.idxMax
    ?{ok:true,n:'Index '+fidx(x.idx)+' — limite '+cp.idxMax,d:'Index relevé à la FFGolf ce matin.'}
    :{ok:false,n:'Index '+fidx(x.idx)+' supérieur à la limite de '+cp.idxMax,d:'L\'inscription n\'est pas possible. Elle le redeviendra si l\'index descend sous '+cp.idxMax+' avant la clôture du '+fdm(cp.close)+'.'});
  if(cp.minAge&&x.dob){const a=ageAt(x.dob,cp.date);ck.push(a>=cp.minAge
    ?{ok:true,n:'Réservée aux '+cp.minAge+' ans et plus',d:a+' ans le jour de l\'épreuve'}
    :{ok:false,n:'Réservée aux '+cp.minAge+' ans et plus',d:a+' ans le jour de l\'épreuve.'})}

  return ck;
}

function lessonSlots(pro,k,dur){
  if(!PROS[pro].days.includes(wday(k)))return [];
  const out=[];
  for(let m=540;m+dur<=1080;m+=30){
    const t=toT(m);
    if(m>=720&&m<840)continue;                 /* pause déjeuner du pro */
    if(hash(pro+k+t)%5<2)continue;             /* déjà réservé */
    if(S.cart.some(l=>l.kind==='ind'&&l.pro===pro&&l.d===k&&l.h===t))continue;
    out.push(t);
  }
  return out;
}

/* ═════════ Panier commun ═════════
   Une ligne garde ses paramètres, pas son prix : le prix est recalculé à
   chaque affichage, ce qui permet de réécrire le panier à la connexion. */
const KTAG={gf:'Green fee',comp:'Compétition',ind:'Cours',coll:'Cours collectif',stage:'Stage',carnet:'Carnet'};
function lineView(l){
  const u=me(), st=mySt();
  let v={tag:KTAG[l.kind],items:[],sub:'',title:''};
  if(l.kind==='gf'){const c=crs(l.crs);
    v.title='Green fee · '+c.n;
    v.sub=`${fday(l.d)} · départ ${l.h} · ${plural(l.players.length,'joueur')}`;
    v.items=gfCalc(l);v.cancel='Annulation gratuite jusqu\'à 24 h avant le départ';}
  if(l.kind==='comp'){const cp=comp(l.compId), c=crs(cp.crs), x=compPrice(cp,st), pi=partnerInfo(l.partner);
    v.title=cp.n;
    v.sub=`${fday(cp.date)} · ${c.n} · ${cp.fmt}${pi?' · avec '+pi.n:''}`;
    v.items=[{n:'Droit de jeu',p:x.dj,pub:cp.dj},{n:'Green fee du jour',p:x.gf,pub:x.gfPub,st:x.st}];
    if(pi&&l.split==='me'){const y=compPrice(cp,pi.st);v.items.push({n:'Droit de jeu — '+pi.n,p:y.dj,pub:cp.dj},{n:'Green fee — '+pi.n,p:y.gf,pub:y.gfPub,st:y.st})}
    if(pi&&l.split==='each')v.extra=`${pi.n.split(' ')[0]} recevra un lien pour régler sa part (${eur(compPrice(cp,pi.st).p)}). Équipe tenue 48 h.`;
    v.cancel='Désinscription remboursée jusqu\'à la clôture du '+fdm(cp.close);v.acc=true;}
  if(l.kind==='ind'){
    v.title=`Cours individuel · ${l.dur===30?'30 min':'1 h'}`;
    v.sub=`${fday(l.d)} · ${l.h} · ${PROS[l.pro].n}`;
    const x=lessonPrice(LESSON[l.dur],st);
    v.items=[l.credit&&u&&u.credits[l.dur]?{n:'Réglé avec 1 crédit carnet',p:0,pub:0,credit:true}:{n:'Cours',...x}];
    v.cancel='Annulation gratuite jusqu\'à 48 h avant le cours';v.acc=true;}
  if(l.kind==='coll'){const c=COLL.find(x=>x.id===l.id);
    v.title=c.n;v.sub=`${fday(c.d)} · ${c.h} · ${c.dur} min · ${PROS[c.pro].n}${l.kid?' · pour '+l.kid.n:''}`;
    v.items=[{n:l.kid?'Inscription '+l.kid.n:'Inscription',...(l.kid?{p:c.p,pub:c.p,st:null}:lessonPrice(c.p,st))}];
    v.cancel='Annulation gratuite jusqu\'à 48 h avant le cours';v.acc=true;}
  if(l.kind==='stage'){const s=STAGES.find(x=>x.id===l.id);
    v.title=s.n;v.sub=`Du ${fdm(s.d)} au ${fdm(s.d2)} · ${s.sched}${l.kid?' · pour '+l.kid.n:''}`;
    v.items=[{n:'Stage complet',...stagePrice(s,st)}];
    v.cancel='Désinscription gratuite jusqu\'à 7 jours avant le stage';v.acc=true;}
  if(l.kind==='carnet'){const k=CARNETS.find(x=>x.id===l.id);
    v.title=k.n;v.sub=`${k.q} cours de ${k.dur===30?'30 min':'1 h'} · valable 12 mois à partir de l'achat`;
    v.items=[{n:'Carnet',...lessonPrice(k.p,st)}];v.cancel='Crédits utilisables dès le paiement confirmé';v.acc=true;}
  v.total=v.items.reduce((t,i)=>t+i.p,0);
  v.pub=v.items.reduce((t,i)=>t+(i.credit?0:i.pub),0);
  const pm=S.promo&&PROMOS[S.promo];
  const pk=l.kind==='ind'||l.kind==='coll'?l.kind:l.kind;
  v.promo=pm&&pm.on.includes(pk)?Math.round(v.total*pm.pct*100)/100:0;
  return v;
}
function cartTotals(){
  let pub=0,sub=0,promo=0;
  S.cart.forEach(l=>{const v=lineView(l);pub+=v.pub;sub+=v.total;promo+=v.promo});
  const u=me();
  const after=sub-promo;
  const avoir=u&&u.avoir&&S.useAvoir?Math.min(u.avoir,after):0;
  return {pub,sub,save:pub-sub,promo,avoir,due:Math.max(0,Math.round((after-avoir)*100)/100)};
}
function addLine(l){
  l.uid=uid();
  if(!S.cart.length){hold=HOLD;holdDead=false}
  S.cart.push(l);
  S.lastAdded=l;
  go('cross');
}

    ?`<span><b>Délai dépassé</b> — les places ne sont plus bloquées pour vous. Les lignes restent dans votre panier : il suffit de revérifier les disponibilités.</span>

    :`<span>Vos places sont <b>bloquées pour vous</b> encore <b class="holdTimer">${mmss(hold)}</b>. Elles sont dans votre panier : la réservation n'est confirmée qu'au paiement.</span>
      <button class="lnk" style="font-size:12px" data-act="holdSim">Simuler l'expiration</button>`}</div>`;
}

setInterval(()=>{

  $$('.holdTimer').forEach(e=>e.textContent=mmss(hold));
},1000);

     :`<div class="grid g2" style="gap:0 12px"><label class="field"><span>Nom complet</span><input id="gName"></label><label class="field"><span>E-mail</span><input id="gMail" type="email"></label></div>

ACT.coPay=()=>{
  const u=me(), T=cartTotals();
  const ref='TQ-'+(++S.ref)+'-'+uid().slice(0,3).toUpperCase();
  const lines=S.cart.map(l=>({l,v:lineView(l)}));
  if(u){
    const RS=S.res[u.id]||(S.res[u.id]=[]);
    lines.forEach(({l,v})=>{
      if(l.kind==='carnet'){const k=CARNETS.find(x=>x.id===l.id), c=u.credits[k.dur];
        u.credits[k.dur]={left:(c?c.left:0)+k.q,tot:(c?c.tot:0)+k.q,end:'2027-09-17'};return}
      if(l.kind==='ind'&&l.credit&&u.credits[l.dur])u.credits[l.dur].left--;
      if(l.editOf){const o=RS.find(r=>r.id===l.editOf.id);if(o)o.cancelled='Remplacé par la modification du '+fdm(TODAY)}
      const cp=l.kind==='comp'?comp(l.compId):null;
      RS.push({id:"r"+uid(),kind:l.kind,compId:l.compId,t:v.title,sub:v.sub.split(' · ').slice(2).join(' · ')||v.sub,d:cp?cp.date:l.d,h:cp?cp.h:l.h,
        close:cp?cp.close:null,pay:l.kind==='ind'&&l.credit?'credit':v.total===0?'incl':'card',amount:v.total-v.promo,fresh:true});
      if(cp){cp.taken=Math.min(cp.cap,cp.taken+(l.partner?2:1))}
    });
    if(T.avoir)u.avoir=Math.round((u.avoir-T.avoir)*100)/100;
  }
  S.done={ref,lines,T,guest:!u,mail:u?u.email:S.co.gMail,garantie:S.co.garantie};
  S.cart=[];S.promo=null;S.co.cgv=false;S.co.garantie=false;hold=HOLD;holdDead=false;
  go('confirm');
};

const RULES={gf:{h:24,n:'jusqu\'à 24 h avant le départ'},ind:{h:48,n:'jusqu\'à 48 h avant le cours'},coll:{h:48,n:'jusqu\'à 48 h avant le cours'},
  stage:{h:24*7,n:'jusqu\'à 7 jours avant le stage'}};
function cancelInfo(r){
  let dl, n;
  if(r.kind==='comp'){dl=at(r.close,'23:59');n='jusqu\'à la clôture du '+fdm(r.close)}
  else {const x=RULES[r.kind];dl=new Date(at(r.d,r.h).getTime()-x.h*3600e3);n=x.n}
  return {ok:NOW<dl,n,dl};
}

    body=`<div class="grid g2" style="align-items:start">
      <div class="mcard"><div class="between"><img data-logo src="" alt="" style="height:30px;filter:brightness(0) invert(1)"><span class="mut" style="font-size:11px">Le Touquet</span></div>
        <div><div style="font-size:24px;font-weight:300;letter-spacing:.5px">${u.n}</div><div class="mut">${u.home}</div></div>
        <div class="row wrap" style="gap:6px">${u.st.map(s=>`<span class="tag">${ST[s].n}</span>`).join('')}</div>
        <div class="between" style="margin-top:auto"><span class="mut">Licence ${u.lic||'—'} · index ${fidx(u.idx)}</span><span class="qr" style="width:46px;height:46px;background-size:8px 8px;border:0"></span></div></div>
      <div class="card" style="padding:16px"><div class="h3" style="margin-bottom:8px">Vos avantages</div>
        ${u.st.map(s=>`<div class="ck ok"><span class="ic">✓</span><div><b>${ST[s].n}</b><small>${ST[s].s}</small></div></div>`).join('')}
        <p class="mut" style="margin-top:8px">Quand plusieurs statuts s'appliquent, c'est toujours le tarif le plus avantageux qui est retenu. Les remises ne se cumulent pas.</p></div></div>
     <div class="sect">Vos tarifs au Touquet</div>
     <div class="card" style="padding:4px 8px;overflow-x:auto"><table class="ttable"><thead><tr><th>Prestation</th><th class="r">Prix public</th><th class="r">Votre prix</th><th class="hide-s">Statut appliqué</th></tr></thead>
       <tbody>${rowsT.map(([n,s,x])=>`<tr><td><b style="font-weight:600">${n}</b>${s?`<div class="mut">${s}</div>`:''}</td><td class="r">${eur(x.pub)}</td><td class="r"><b>${x.p===0&&x.pub>0?'Inclus':eur(x.p)}</b></td><td class="hide-s mut">${x.st?ST[x.st].n:'—'}</td></tr>`).join('')}</tbody></table></div>
     <p class="note">Ce tableau répond à la demande du client : « avoir accès à son espace personnel pour avoir les prix associés à son statut ». Il est calculé avec les mêmes règles que le moteur, et ne peut donc jamais contredire un prix affiché dans les tunnels.</p>`;
  }
  if(tab==='carnets'){
    const cr=Object.entries(u.credits);
    body=`<div class="sect" style="margin-top:0">Carnets de cours</div>
     ${cr.length?`<div class="grid g2">${cr.map(([d,c])=>`<div class="card pack"><span class="tag" style="align-self:flex-start">Valable jusqu'au ${fdm(c.end)} ${c.end.slice(0,4)}</span>
       <b class="h2">Cours de ${d==='30'?'30 min':'1 h'}</b>
       <div style="font-size:28px;font-weight:700;letter-spacing:-.5px">${c.left}<span class="mut" style="font-size:13px;font-weight:500"> / ${c.tot} cours restants</span></div>
       <div class="prog">${Array.from({length:c.tot},(_,i)=>`<i class="${i<c.left?'on':''}"></i>`).join('')}</div>
       <div class="foot"><span class="mut">${c.tot-c.left} utilisé${c.tot-c.left>1?'s':''}</span><button class="btn sm" data-act="indOpen" data-d="${d}" ${c.left?'':'disabled'}>Réserver un cours</button></div></div>`).join('')}</div>`
      :`<div class="card" style="padding:20px"><b class="h3">Aucun carnet en cours</b><p class="sub" style="margin:4px 0 12px">Un carnet de 5 ou 10 cours revient moins cher que les cours à l'unité.</p><button class="btn sm" data-act="xTab" data-t="carnet">Voir les carnets</button></div>`}
     <div class="sect">Avoirs</div>
     ${u.avoir?`<div class="card" style="padding:16px"><div class="between"><div><b class="h2">${eur(u.avoir)}</b><div class="mut">Avoir suite à l'annulation d'un départ · valable jusqu'au ${fdm(u.avoirEnd)} ${u.avoirEnd.slice(0,4)}</div></div>
        <span class="tag ol">Utilisé automatiquement au panier</span></div></div>`
      :'<div class="card" style="padding:16px"><span class="mut">Aucun avoir disponible.</span></div>'}
     <p class="note">L'avoir est proposé par défaut au panier (interrupteur désactivable). Il vient d'une annulation remboursée en avoir plutôt que sur la carte : c'est l'un des deux choix proposés à l'annulation.</p>`;
  }
  if(tab==='infos'){
    const cOk=u.cert&&u.cert>=TODAY;
    body=`<div class="grid g2" style="align-items:start"><div class="card" style="padding:4px 16px">
      <div class="ck ${u.lic?'ok':'ko'}"><span class="ic">${u.lic?'✓':'✕'}</span><div><b>Licence FFGolf</b><small>${u.lic?'N° '+u.lic+' · saison 2026 · synchronisée chaque nuit':'Aucune licence rattachée'}</small></div>${u.lic?'':'<button class="btn sm sec" data-act="addLic">Ajouter</button>'}</div>
      <div class="ck ok"><span class="ic">✓</span><div><b>Index ${fidx(u.idx)}</b><small>Relevé FFGolf du 17 septembre</small></div></div>
      <div class="ck ${cOk?'ok':'ko'}"><span class="ic">${cOk?'✓':'✕'}</span><div><b>Certificat médical</b><small>${u.cert?(cOk?'Valable jusqu\'au ':'Expiré depuis le ')+fdm(u.cert)+' '+u.cert.slice(0,4):'Non déposé'}${cOk?'':' — requis pour les compétitions'}</small></div><button class="btn sm ${cOk?'ghost':'sec'}" data-act="cert">${cOk?'Remplacer':'Déposer'}</button></div>
      <div class="ck ok"><span class="ic">✓</span><div><b>Date de naissance</b><small>${fdm(u.dob)} ${u.dob.slice(0,4)} · ${ageAt(u.dob,TODAY)} ans</small></div></div>
     </div>
     <div class="card" style="padding:16px"><div class="h3" style="margin-bottom:6px">Mes partenaires de jeu</div>
      ${u.partners.length?u.partners.map(id=>{const p=PROFILES[id];return `<div class="prow"><span class="av lt">${p.ini}</span><div class="pb"><b>${p.n}</b><span class="mut">Index ${fidx(p.idx)}</span></div></div>`}).join(''):'<p class="mut">Les joueurs que vous rattachez à vos départs apparaîtront ici.</p>'}
      <div class="hr" style="margin:12px 0"></div>
      <div class="h3" style="margin-bottom:6px">Coordonnées</div><p class="mut">${u.email}</p>
      <button class="lnk" style="margin-top:12px;font-size:12px" data-act="logout">Se déconnecter</button></div></div>`;
  }
  $('#v-espace').innerHTML=`
   <div class="scr-head"><div class="hello"><span class="av" style="width:58px;height:58px;font-size:17px">${u.ini}</span>
     <div><span class="eyebrow" style="margin-bottom:4px">Mon espace</span><h1 class="h1">Bonjour <b>${u.n.split(' ')[0]}</b></h1><p class="sub">${u.st.map(s=>ST[s].n).join(' · ')}</p></div></div>
     <span class="node">Espace personnel</span></div>
   <div class="tabs">${tabs.map(([k,n,c])=>`<button class="${tab===k?'on':''}" data-act="spaceTab" data-t="${k}">${n}${c!=null?`<i>${c}</i>`:''}</button>`).join('')}</div>
   ${body}`;
};
ACT.spaceTab=a=>{S.space=a.dataset.t;if(S.screen==='espace')render();else go('espace')};
ACT.resTab=a=>{S.resTab=a.dataset.v;render()};
const findRes=id=>(S.res[S.user]||[]).find(r=>r.id===id);
ACT.resQr=a=>{const r=findRes(a.dataset.id);
  sheet(shead(r.t,'QR code de départ')+`<div style="display:grid;place-items:center;margin:16px 0"><div class="qr lg"></div></div>
   <p class="sub" style="text-align:center">${fday(r.d)} · ${r.h}<br>${r.sub}</p>
   <p class="mut" style="text-align:center;margin-top:8px">À présenter au starter. Il fonctionne aussi hors connexion une fois affiché.</p>`)};
ACT.resCancel=a=>{
  const r=findRes(a.dataset.id), wait=r.pay==='wait';
  const refund=r.pay==='card'&&r.amount>0;
  sheet(shead(wait?'Quitter la liste d\'attente':r.kind==='comp'?'Me désinscrire':'Annuler la réservation',KTAG[r.kind])+
   `<p class="sub" style="margin:4px 0 14px"><b style="color:var(--ink)">${r.t}</b> · ${fday(r.d)} · ${r.h}</p>
   ${refund?`<div class="sect" style="margin-top:0">Remboursement de ${eur(r.amount)}</div><div class="radios">
     <button class="radio on" data-act="refundPick" data-v="card"><span class="dot"></span><div><b>Sur ma carte bancaire</b><small>Sous 5 à 7 jours ouvrés</small></div></button>
     <button class="radio" data-act="refundPick" data-v="avoir"><span class="dot"></span><div><b>En avoir, tout de suite</b><small>Utilisable 9 mois sur tout le golf</small></div></button></div>`
    :r.pay==='credit'?'<div class="alert soft"><span class="ic">↺</span><div>Le crédit est <b>recrédité sur votre carnet</b>.</div></div>'
    :r.pay==='incl'?'<div class="alert soft"><span class="ic">i</span><div>Départ inclus dans votre abonnement : rien à rembourser. Le créneau est libéré pour d\'autres joueurs.</div></div>':''}
   ${r.kind==='gf'&&r.sub.includes('2 joueurs')?'<p class="mut" style="margin-top:10px">Les autres joueurs du départ sont prévenus par e-mail.</p>':''}
   <div class="row" style="margin-top:16px"><button class="btn" data-act="resCancelGo" data-id="${r.id}">Confirmer</button><button class="btn ghost" data-act="close">Garder ma réservation</button></div>`);
  S.refund='card';
};
ACT.refundPick=a=>{S.refund=a.dataset.v;$$('[data-act="refundPick"]').forEach(b=>b.classList.toggle('on',b===a))};
ACT.resCancelGo=a=>{
  const r=findRes(a.dataset.id), u=me();
  let msg='Réservation annulée.';
  if(r.pay==='wait'){msg='Vous avez quitté la liste d\'attente.'}
  else if(r.pay==='credit'){const c=u.credits[r.kind==='ind'&&r.t.includes('1 h')?60:30];if(c)c.left++;msg='Réservation annulée, crédit recrédité.'}
  else if(r.pay==='card'&&r.amount>0){
    if(S.refund==='avoir'){u.avoir=(u.avoir||0)+r.amount;u.avoirEnd=u.avoirEnd||'2027-06-17';msg=`Annulée : ${eur(r.amount)} ajoutés à votre avoir.`}
    else msg=`Annulée : ${eur(r.amount)} remboursés sur votre carte sous 5 à 7 jours.`}
  r.cancelled=r.pay==='wait'?'Liste d\'attente quittée le '+fdm(TODAY):'Annulé le '+fdm(TODAY);
  closeSheet();render();toast(msg);
};
ACT.resEdit=a=>{
  const r=findRes(a.dataset.id);
  if(r.kind==='gf'){Object.assign(S.gf,{date:r.d,editOf:{id:r.id,d:r.d,h:r.h},moment:'all'});go('gf');return}
  if(r.kind==='ind'){Object.assign(S.cours,{dur:r.t.includes('1 h')?60:30,pro:'any',slot:null,wk:0,editOf:{id:r.id}});go('cours-ind');return}
  sheet(shead('Modifier '+(r.kind==='comp'?'mes préférences':'ma réservation'),KTAG[r.kind])+
   (r.kind==='comp'?`<p class="sub" style="margin:4px 0 12px">Les horaires sont publiés 48 h avant l'épreuve. D'ici là, vous pouvez changer vos préférences.</p>
     <div class="chips">${['Plutôt tôt','Plutôt tard','Indifférent'].map((n,i)=>`<button class="chip ${i===0?'on':''}">${n}</button>`).join('')}</div>
     <label class="field"><span>Message au comité</span><input></label>`
   :`<p class="sub" style="margin:4px 0 12px">Un cours collectif ou un stage se modifie en changeant de session : annulez celle-ci (gratuit dans les délais), puis inscrivez-vous à une autre.</p>`)+
   `<button class="btn full" data-act="close">${r.kind==='comp'?'Enregistrer':'Compris'}</button>`);
};
ACT.rebook=a=>{const r=findRes(a.dataset.id);Object.assign(S.gf,{date:'2026-09-24',editOf:null});go('gf')};

/* ═════════ Démarrage ═════════ */
function toggleVp(){
  const st=$('#stage'), m=st.dataset.vp!=='mobile';
  st.dataset.vp=m?'mobile':'desktop';
  document.body.classList.toggle('vp-mobile',m);
  st.scrollTop=0;window.scrollTo(0,0);
  fitPhone();
}
/* le cadre garde 402 × 874 ; on le réduit seulement si la fenêtre ne le contient pas */
function fitPhone(){
  const m=$('#stage').dataset.vp==='mobile', f=$('#frame'), w=$('.stagewrap');
  const k=m?Math.min(1,(innerHeight-40)/874,(innerWidth-28)/402):1;
  f.style.setProperty('--vps',k);
  w.style.height=m?Math.max(innerHeight,874*k+40)+'px':'';
}
addEventListener('resize',fitPhone);
$('#vpTog').onclick=toggleVp;
document.addEventListener('keydown',e=>{
  if((e.key==='m'||e.key==='M')&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.target.closest('input,textarea,select'))toggleVp();
});
S=fresh();
go('accueil');

</script>
</body>
</html>
