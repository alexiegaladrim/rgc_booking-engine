   l'option est incluse ou remisée la reçoivent d'abord, les autres paient
   le prix public. Voiturette : pas de notion de place — elle se paie
   entière, sauf si un abonné choisit de la prendre avec son abonnement
   (une voiturette par abonné, case à décocher dans les options). */
function optSplit(op,c,ps,q,o){
  const L=ps.map(x=>({...x,x:optPrice(op,c,x.pi.st)})), perk=L.filter(x=>x.x.p<x.x.pub);
  const order=[...perk,...L.filter(x=>!(x.x.p<x.x.pub))], units=[];
  if(op.per==='voit'){
    const pub=optPrice(op,c,[]).pub, off=(o&&o.noAbo)||{}, H=perk.filter(x=>!off[x.i]);
    for(let v=0;v<q;v++){const h=H[v];
      units.push(h?{who:h.pi.n,you:h.pi.you&&!h.pi.anon,p:h.x.p,pub,st:h.x.st}:{who:null,p:pub,pub,st:null})}
  } else order.slice(0,q).forEach(x=>units.push({who:x.pi.n,you:x.pi.you&&!x.pi.anon,p:x.x.p,pub:x.x.pub,st:x.x.p<x.x.pub?x.x.st:null}));
  return units;
}
/* compétition : droit de jeu + green fee du jour ; l'abonné ne paie que le droit de jeu */
function compPrice(cp,sts){
  sts=sts||[];
  const c=crs(cp.crs), g=gfPrice(c,cp.date,sts);
  const gf=sts.includes('abonne')?0:g.p;
  const dj=sts.includes('jeune')&&cp.djJ?cp.djJ:cp.dj;
  const pubT=cp.dj+gfPub(c,cp.date);
  const st=sts.includes('abonne')?'abonne':(g.st||(dj<cp.dj?'jeune':null));
  return {dj,gf,p:dj+gf,pub:pubT,gfPub:gfPub(c,cp.date),st};
}
/* affichage d'un prix avec le prix public barré */
function pr(x,opt){
  opt=opt||{};
  const inc=x.p===0&&x.pub>0;
  const main=inc?'Inclus':eur(x.p);
  return (x.p<x.pub?`<span class="was">${eur(x.pub)}</span>`:'')+main
    +(opt.small?`<small>${opt.small}</small>`:'')
    +(x.st&&!opt.nost?`<br><span class="stl">Tarif ${ST[x.st].n}</span>`:'');
}

/* ═════════ Choix du golf : liste par région + carte cliquable ═════════
   Coordonnées des pastilles en pixels de la carte (1870 × 2000). Cleydael,
   en Belgique, n'est pas sur la carte : il reste dans la liste. */
const MAPW=1870, MAPH=2000;
/* Provence et Riviera sont deux régions distinctes (demande client du 21/09/2026) */
const REGIONS=['Côte d\'Opale','Île-de-France','Côte Landaise','Provence','Riviera — Côte d\'Azur','Belgique'];
const GOLFS=[
  {id:'touquet',reg:0,n:'Le Touquet Golf Resort',v:'Le Touquet-Paris-Plage (62)',d:'3 parcours · 45 trous',x:840,y:387,live:true},
  {id:'hardelot',reg:0,n:'Golf d\'Hardelot',v:'Neufchâtel-Hardelot (62)',d:'2 parcours · 36 trous',x:847,y:350},
  {id:'yvelines',reg:1,n:'Domaine de la Couharde',v:'La Queue-lez-Yvelines (78)',d:'2 parcours · 27 trous',x:816,y:590},
  {id:'moliets',reg:2,n:'Golf de Moliets',v:'Moliets-et-Maa (40)',d:'2 parcours · 27 trous',x:447,y:1380},
  {id:'seignosse',reg:2,n:'Golf de Seignosse',v:'Seignosse (40)',d:'18 trous',x:441,y:1416},
  {id:'servanes',reg:3,n:'Golf de Servanes',v:'Mouriès (13) · Alpilles',d:'18 trous',x:1150,y:1492},
  {id:'saintebaume',reg:3,n:'Golf Sainte Baume',v:'Nans-les-Pins (83) · Sainte-Baume',d:'18 trous',x:1291,y:1537},
  {id:'salette',reg:3,n:'Golf Bastide de la Salette',v:'Marseille (13)',d:'18 trous',x:1213,y:1546},
  {id:'opio',reg:4,n:'Opio-Valbonne Golf Resort',v:'Opio (06) · Le Mas de la Bégude',d:'18 trous · hôtel & spa',x:1444,y:1471},
  {id:'roquebrune',reg:4,n:'Golf de Roquebrune',v:'Roquebrune-sur-Argens (83)',d:'18 trous',x:1410,y:1530},
  {id:'grandebastide',reg:4,n:'Golf de la Grande Bastide',v:'Châteauneuf-Grasse (06)',d:'18 trous',x:1433,y:1497},
  {id:'cleydael',reg:5,n:'Cleydael Golf & Country Club',v:'Aartselaar · Anvers',d:'18 trous'}];
const golf=id=>GOLFS.find(x=>x.id===id);
function siteSheet(){
  const sel=S.siteSel||'touquet', q=(S.siteQ||'').trim().toLowerCase();
  const match=x=>!q||(x.n+' '+x.v+' '+REGIONS[x.reg]).toLowerCase().includes(q);
  const G=golf(sel);
  return `<div class="gs">
    <div class="gs-l">
      ${shead('Choisir un golf')}
      <p class="sub" style="margin:2px 0 14px">12 golfs de la Collection, en France et en Belgique.</p>
      <label class="gs-q"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
        <input id="gsQ" placeholder="Rechercher un golf, une ville…" value="${S.siteQ||''}" autocomplete="off"></label>
      <div class="gs-list">${REGIONS.map((r,ri)=>{const items=GOLFS.filter(x=>x.reg===ri);
        return `<div class="gs-reg" data-reg="${ri}"><div class="sect" style="margin:16px 0 8px">${r}</div>
          ${items.map(x=>`<button class="gs-row ${x.id===sel?'on':''}" data-act="siteSel" data-id="${x.id}" data-g="${x.id}" ${match(x)?'':'hidden'}>
            <span class="gs-pin"></span><span class="gs-t"><b>${x.n}</b><small>${x.v} · ${x.d}</small></span>
            ${x.id===(S.site||'touquet')?'<span class="tag ol">Actuel</span>':''}</button>`).join('')}</div>`}).join('')}
        <p class="mut gs-none" hidden>Aucun golf ne correspond à cette recherche.</p></div>
    </div>
    <div class="gs-r">
      <div class="gmap"><div class="gmap-in"><img src="${MAPIMG}" alt="Carte des golfs de la Collection" draggable="false">
        ${GOLFS.filter(x=>x.x).map(x=>`<button class="hs ${x.id===sel?'on':''} ${match(x)?'':'dim'}" style="left:${x.x/MAPW*100}%;top:${x.y/MAPH*100}%" data-act="siteSel" data-id="${x.id}" data-g="${x.id}" aria-label="${x.n}"><i></i><span class="hs-tip">${x.n}</span></button>`).join('')}
      </div></div>
      <div class="gs-sel">
        <div><span class="eyebrow" style="margin-bottom:3px">${REGIONS[G.reg]}</span><b>${G.n}</b><span class="mut">${G.v} · ${G.d}</span></div>
        <button class="btn" data-act="siteGo">${G.id===(S.site||'touquet')?'Rester sur ce golf':'Choisir ce golf'}</button>
      </div>
    </div>
  </div>`;
}
function bindSiteSheet(){
  const inp=$('#gsQ');
  inp.oninput=()=>{
    S.siteQ=inp.value;const q=inp.value.trim().toLowerCase();let any=false;
    GOLFS.forEach(x=>{const ok=!q||(x.n+' '+x.v+' '+REGIONS[x.reg]).toLowerCase().includes(q);any=any||ok;
      $$(`[data-g="${x.id}"]`).forEach(el=>{if(el.classList.contains('hs'))el.classList.toggle('dim',!ok);else el.hidden=!ok})});
    $$('.gs-reg').forEach(r=>r.hidden=![...r.querySelectorAll('.gs-row')].some(b=>!b.hidden));
    $('.gs-none').hidden=any;
  };
  /* survol synchronisé liste ↔ carte */
  $$('[data-g]').forEach(el=>{
    el.onmouseenter=()=>$$(`[data-g="${el.dataset.g}"]`).forEach(x=>x.classList.add('hov'));
    el.onmouseleave=()=>$$(`[data-g="${el.dataset.g}"]`).forEach(x=>x.classList.remove('hov'));
  });
}
ACT.site=()=>{S.siteSel=S.site||'touquet';S.siteQ='';sheet(siteSheet(),'wide');bindSiteSheet()};
ACT.siteSel=a=>{S.siteSel=a.dataset.id;const sc=$('.gs-list').scrollTop;$('#sheet').innerHTML=siteSheet();bindSiteSheet();$('.gs-list').scrollTop=sc;
  const row=$(`.gs-row[data-g="${a.dataset.id}"]`);if(a.classList.contains('hs')&&row)row.scrollIntoView({block:'nearest',behavior:'smooth'})};
ACT.siteGo=()=>{
  const G=golf(S.siteSel);
  if(!G.live){toast(`Prototype : seul Le Touquet est maquetté. ${G.n} utiliserait le même parcours de réservation.`);return}
  closeSheet();
};

/* ═════════ resonance.golf — site vitrine (hors périmètre du moteur) ═════════
   Le client n'arrive plus sur une page d'accueil de golf : il part du site
   actuel, ouvre le menu « Réserver un green-fee », choisit son golf et entre
   directement dans le tunnel de ce golf. */
const RSN_NAV=['Notre univers','Jouer','S\'évader','Se relaxer','Nos offres','Vos événements','Écologie','L\'actu'];
const RSN_HERO='https://www.resonance.golf/wp-content/uploads/2020/07/golf_hardelot_les_dunes_trou_18-1920x1080.jpg';

  const u=me(), g=S.gf, id=c?c.id:'all';
  const w=waitOf(g.date,id), n=waitCount(id,g.date);

/* ═════════ Green fee · 1 — date, joueurs, départs ═════════ */
/* départs déjà réservés par des proches (démo) : ils fixent les places restantes */
const FRES={
  paul:[{d:'2026-09-24',crs:'foret',t:'09:21',n:2},{d:'2026-09-26',crs:'mer',t:'11:00',n:3}],
  sophie:[{d:'2026-09-24',crs:'mer',t:'10:20',n:4},{d:'2026-09-27',crs:'foret',t:'10:24',n:3}],
  jules:[{d:'2026-09-24',crs:'manoir',t:'14:04',n:2}]};
/* démo : le dimanche 27 septembre, La Mer est complète toute la journée et
   La Forêt l'est le matin — c'est le cas d'usage de la liste d'attente. */
const FULL_OVR={'mer|2026-09-27':'all','foret|2026-09-27':'am'};
const SLOT_OVR={'mer|2026-09-24|10:10':3,'mer|2026-09-24|10:30':4,'foret|2026-09-24|09:12':3,'foret|2026-09-24|09:30':4};
Object.values(FRES).flat().forEach(r=>SLOT_OVR[r.crs+'|'+r.d+'|'+r.t]=4-r.n);
function slots(c,k){
  const out=[];
  for(let m=toMin(c.from);m<=toMin(c.to);m+=c.cad){
    const t=toT(m), h=hash(c.id+k+t);
    let free=[4,4,3,2,0,1,4,2,0,3,4,1][h%12];
    if(isWe(k)&&h%3===0)free=0;
    const f=FULL_OVR[c.id+'|'+k];if(f&&(f==='all'||(f==='am')===(toMin(t)<720)))free=0;
    const o=SLOT_OVR[c.id+'|'+k+'|'+t];if(o!=null)free=o;   /* un proche garde son départ */
    out.push({t,free});
  }
  return out;
}
const inMoment=(t,mo)=>mo==='all'||(mo==='am'?toMin(t)<720:toMin(t)>=720);
function openSlots(c,k,pax,mo){return slots(c,k).filter(s=>s.free>=pax&&inMoment(s.t,mo))}
R.gf=()=>{
  const g=S.gf, st=mySt(), u=me();
  const start=(()=>{const x=dshift(g.date,-3);return x<DMIN?DMIN:x})();
  const days=Array.from({length:9},(_,i)=>dshift(start,i)).filter(k=>k<=DMAX);
  const G2MAX=14;
  const grp=isGroup();
  if(grp&&!(g.flights||[]).every(Boolean))resetFlights();
  const rows=CRS.map(c=>{
    const ok=openSlots(c,g.date,grp?1:g.pax,g.moment);
    const blocked=!!(c.idxMax&&u&&u.idx>c.idxMax);
    return {c,ok,blocked,price:gfPrice(crsV(c.id,(g.h9||{})[c.id]),g.date,st)};
  });
  const tot=rows.reduce((t,r)=>t+(r.blocked?0:r.ok.length),0);
  $('#v-gf').innerHTML=`
   ${g.swap?`<div class="alert soft"><span class="ic">↺</span><div><b>Vous changez le jour ou l'horaire de votre green fee · ${crs(g.swap.crs).n}, ${fday(g.swap.d)} à ${g.swap.h}</b><br>Vos ${plural(g.swap.players.length,'joueur')} et vos options sont conservés : choisissez simplement un nouveau départ. La ligne actuelle reste dans votre panier tant que vous n'en avez pas choisi un autre.</div><button class="lnk" data-act="gfSwapCancel">Revenir au panier</button></div>`
   :g.editOf?`<div class="alert soft"><span class="ic">↺</span><div><b>Modification de votre départ du ${fday(g.editOf.d)} à ${g.editOf.h}</b><br>Votre départ actuel reste réservé tant que le nouveau n'est pas confirmé.</div><button class="lnk" data-act="gfEditCancel">Abandonner</button></div>`:''}
   ${fil(['Départ','Joueurs & options','Panier'],0)}
   <div class="scr-head"><div><span class="eyebrow">Green fee · Le Touquet</span><h1 class="h1">Quand souhaitez-vous <b>jouer</b>&nbsp;?</h1>
     <p class="sub" style="margin-top:6px">${fday(g.date)} · ${plural(g.pax,'joueur')} · ${u?'prix à votre tarif':'prix public par joueur'}</p></div>
     <span class="node">Green fee · tunnel v2</span></div>

/* 2 lignes de créneaux au plus par parcours, le dernier emplacement
   devenant « Voir plus » (ouvre tous les départs du parcours) */
function clampSlots(){
  $$('#v-gf .gtimes[data-clamp]').forEach(box=>{
    box.querySelectorAll('.gtime.more').forEach(b=>b.remove());
    const items=[...box.children];items.forEach(b=>b.hidden=false);
    const tops=[...new Set(items.map(b=>b.offsetTop))];
    if(tops.length<=2)return;
    const row2=tops[1];
    items.forEach(b=>{if(b.offsetTop>row2)b.hidden=true});
    const more=document.createElement('button');
    more.className='gtime more';more.dataset.act='gfMore';more.dataset.c=box.dataset.clamp;box.appendChild(more);
    const vis=()=>items.filter(b=>!b.hidden);
    const lbl=()=>{more.innerHTML=`<b>Voir plus</b><i>+${items.length-vis().length} départs</i>`};
    lbl();
    while(more.offsetTop>row2&&vis().length){vis().pop().hidden=true;lbl()}
  });
}

  if(!H.length)return '';
  const from=Math.min(...H.map(x=>x.price.p));
  if(!open)return `<button class="card hdl-l" data-act="gfHdl"><span class="hdl-i" style="${bg(CRSIMG.dunes)}"></span>
    <span><b class="h3">Pas trouvé votre créneau&nbsp;? Voir aussi le Golf d'Hardelot</b><span class="mut">À 20 min du Touquet · ${plural(H.reduce((t,x)=>t+x.ok.length,0),'départ libre','départs libres')} ${fday(g.date)} · dès ${eur(from)}</span></span>
    <span class="lnk">Afficher</span></button>`;
  return `<div class="card hdl">
    <div class="hdl-h" style="${bg(CRSIMG.dunes)}"><div><span class="eyebrow">Golf d'Hardelot · à 20 min</span>
      <b class="h2">${strong?`${!tot?'Plus de départ':'Un parcours complet'} au Touquet&nbsp;? Hardelot a de la place ${fday(g.date)}`:`Le Golf d'Hardelot ${fday(g.date)}`}</b>

    ${H.map(x=>`<div class="hdl-c"><div class="between"><div><b class="h3">${x.c.n}</b> <span class="mut">· 18 trous · départ toutes les ${x.c.cad} min</span></div>

  </div>`;
}

/* ═════════ Groupes de 5 à 12 joueurs ═════════
   Un départ accueille 4 joueurs au plus : au-delà, le client choisit autant
   de créneaux qu'il faut de départs, avec le moins de départs possible. */
const GMAX=12;
const isGroup=()=>S.gf.pax>4;
/* Groupe de 5 à 12 : le client coche librement ses créneaux (4 joueurs max.
   par départ, parcours au choix) ; les joueurs sont répartis automatiquement. */
const slotFree=f=>{const x=slots(crs(f.crs),S.gf.date).find(y=>y.t===f.t);return x?x.free:0};
const capOf=f=>Math.min(4,slotFree(f));
function distribute(fl,n){
  const caps=fl.map(capOf), sz=fl.map(()=>0);let left=n, moved=true;
  while(left>0&&moved){moved=false;for(let i=0;i<fl.length&&left>0;i++)if(sz[i]<caps[i]){sz[i]++;left--;moved=true}}
  return sz;
}
function gfSizes(){const g=S.gf;return isGroup()?distribute(g.flights||[],g.pax):[g.pax]}
const placedN=()=>Math.min(S.gf.pax,(S.gf.flights||[]).reduce((t,f)=>t+capOf(f),0));
/* au-delà de 12 : encart bien visible, juste sous le panneau de groupe */
const bigBox=()=>`<div class="alert soft bigg"><span class="ic">+</span><div><b>Vous êtes plus de 12 joueurs&nbsp;?</b><br>La réservation en ligne s'arrête à 12. Au-delà, notre équipe groupes organise votre venue (départs à la suite ou en shotgun, repas, voiturettes) et vous répond sous 24 h ouvrées.</div>
  <button class="btn sm" data-act="gfBig">Faire une demande de groupe</button></div>`;
function groupPanel(){
  const g=S.gf, p=placedN(), sz=gfSizes(), min=Math.ceil(g.pax/4);
  return `<div class="card gpanel">

      <b class="h2">${g.pax} joueurs · sélectionnez vos créneaux</b>
      <p class="mut" style="margin-top:4px">4 joueurs au plus par départ : il vous faut au moins ${min} créneaux. Cochez-les ci-dessous, sur un ou plusieurs parcours ; vos joueurs y sont répartis automatiquement.</p></div>
      <span class="gp-count">${p}/${g.pax}</span></div>
    <div class="gp-bar"><i style="width:${Math.round(p/g.pax*100)}%"></i></div>
    ${g.flights.length?`<div class="gp-sel">${g.flights.map((f,i)=>`<span class="gchip">${fN(f)} · ${f.t}<small>${plural(sz[i],'joueur')}</small><button data-act="gfTog" data-c="${f.crs}" data-t="${f.t}" aria-label="Retirer ce créneau"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg></button></span>`).join('')}</div>`:''}
  </div>`;
}
function groupTimes(c,ok){
  const g=S.gf, sz=gfSizes(), MAX=14;
  const isSel=t=>g.flights.findIndex(f=>f.crs===c.id&&f.t===t);
  const {byT,near}=proxMarks(c);
  const shown=ok.filter((s,i)=>i<MAX||isSel(s.t)>=0||byT[s.t]||near[s.t]), rest=ok.length-shown.length;
  Object.values(byT).forEach(rs=>{if(!shown.some(x=>x.t===rs[0].t))shown.push({t:rs[0].t,free:0,full:true})});
  shown.sort((a,b)=>a.t<b.t?-1:1);
  if(!ok.length)return `<p class="mut" style="margin-top:10px">Aucun créneau libre sur ce parcours ce jour-là.</p>`;
  return `<div class="gtimes">${shown.map(s=>{const i=isSel(s.t), rs=byT[s.t];
    if(s.full)return `<button class="gtime pro full" disabled data-c="${c.id}" data-t="${s.t}">${rs.map(gav).join('')}<b>${s.t}</b><i>complet</i></button>`;
    return `<button class="gtime ${i>=0?'on':''} ${rs?'pro':''} ${!rs&&near[s.t]&&i<0?'nx':''}" data-act="gfTog" data-c="${c.id}" data-t="${s.t}" aria-pressed="${i>=0}">${rs?rs.map(gav).join(''):''}<b>${s.t}</b><i>${i>=0?'✓ '+plural(sz[i],'joueur'):rs?'avec '+rs[0].p.n.split(' ')[0]:near[s.t]?'à côté de '+near[s.t]:Math.min(4,s.free)+' pl. libres'}</i></button>`}).join('')}${rest>0?`<button class="gtime more" data-act="gfMore" data-c="${c.id}">+${rest} autres</button>`:''}</div>`;
}
ACT.gfTog=a=>{
  const g=S.gf, c=a.dataset.c, t=a.dataset.t, i=g.flights.findIndex(f=>f.crs===c&&f.t===t);
  if(i>=0)g.flights.splice(i,1);
  else{
    if(placedN()>=g.pax){toast(`Vos ${g.pax} joueurs sont déjà placés : retirez un créneau pour en choisir un autre.`);return}
    g.flights.push({crs:c,t,h9:!!(g.h9||{})[c]});g.flights.sort((x,y)=>x.t<y.t?-1:x.t>y.t?1:0);
  }
  closeSheet();render();
};
ACT.gfGroupGo=()=>{
  const g=S.gf, sz=gfSizes();
  const players=[];let k=0;
  sz.forEach((n,f)=>{for(let j=0;j<n;j++){players.push(k===0?{type:'self',f}:{type:'guest',n:'',f});k++}});
  g.split=sz;g.players=players;applyWith();g.fopts=sz.map(()=>({}));g.idxOk=false;
  if(swapIn(sz))toast('Nouveaux départs choisis : vos joueurs et vos options sont conservés.');
  g.crs=g.flights[0].crs;g.t=g.flights[0].t;
  go('gf-joueurs');

function playerInfo(p,i){
  const u=me();
  if(p.type==='self')return u
    ?{n:u.n,you:true,st:u.st,idx:u.idx,sub:u.st.map(s=>ST[s].n).join(' · ')}
    :{n:'Vous',you:true,st:[],idx:null,sub:'Non connecté·e · prix public',anon:true};
  if(p.type==='acc'){const x=PROFILES[p.id];return {n:x.n,st:x.st,idx:x.idx,sub:'Compte rattaché · '+x.st.map(s=>ST[s].n).join(' · ')}}
  if(p.type==='lic')return {n:p.n,st:['licencie'],idx:p.idx,sub:'Licence '+p.lic+' · vérifiée FFGolf'};
  return {n:p.n||'Joueur '+(i+1),st:[],idx:null,sub:'Invité·e sans compte · prix public',guest:true};
}
const flightsOf=l=>l.flights&&l.flights.length?l.flights:[{crs:l.crs,t:l.h}];
const crsOfPlayer=(l,p)=>{const f=flightsOf(l)[p.f||0];return crsV(f.crs,f.h9)};
const joinOf=l=>{const j=l.joinWith;return j&&flightsOf(l).some(f=>f.crs===j.crs&&f.t===j.t)?j:null};
function gfCalc(l){
  const items=[], fl=flightsOf(l), multi=fl.length>1;
  l.players.forEach((p,i)=>{const pi=playerInfo(p,i), c=crsOfPlayer(l,p);
    items.push({n:pi.n+(pi.you?' (vous)':'')+(multi?` · départ ${(p.f||0)+1}`:''),...gfPrice(c,l.d,pi.st),grp:'gf',f:p.f||0,
      who:pi.n+(pi.you&&!pi.anon?' (vous)':''),lbl:'Green fee '+c.n+(c.h9?' 9 trous':'')+(c.site?' · Golf d\'Hardelot':'')})});
  /* options rattachées à un départ, au tarif du parcours de ce départ */
  const fo=l.fopts||[l.opts||{}];
  fl.forEach((f,k)=>{const c=crsV(f.crs,f.h9), o=fo[k]||{};
    const ps=l.players.map((p,i)=>({p,i,pi:playerInfo(p,i)})).filter(x=>(x.p.f||0)===k), sfx=multi?' · départ '+(k+1):'';
    GOPTS.forEach(op=>{const q=o[op.id]||0;if(!q)return;
      const nm=op.n+(c.nine&&op.id==='voit'?' 9 trous':''), U=optSplit(op,c,ps,q,o);
      const perk=U.filter(u=>u.st), pay=U.filter(u=>!u.st), cfg=op.id==='clubs'?' ('+clubCfg(o,q).map(clubTxt).join(', ')+')':'';
      perk.forEach(u=>items.push({n:`${nm} · ${op.per==='voit'?'abonnement de ':''}${u.who}${sfx}`,p:u.p,pub:u.pub,st:u.st,who:u.who+(u.you?' (vous)':''),lbl:op.per==='voit'?nm+' prise avec l\'abonnement':nm,grp:'gf',f:k,opt:true}));
      if(!pay.length)return;
      const P=pay.reduce((t,u)=>t+u.p,0), names=pay.map(u=>u.who).filter(Boolean);
      items.push({n:perk.length
          ?(op.per==='voit'?`${nm} × ${pay.length}${sfx}`:`${nm} · ${names.join(', ')}${cfg}${sfx}`)
          :`${nm} × ${q}${cfg}${sfx}`,
        p:Math.round(P*100)/100,pub:Math.round(pay.reduce((t,u)=>t+u.pub,0)*100)/100,st:null,grp:'gf',f:k,opt:true});
    })});
  return items;
}
/* index maximum : contrôlé joueur par joueur, sur le parcours de son départ */
function gfIdxState(){
  const g=S.gf, line={crs:g.crs,h:g.t,flights:g.flights};
  const info=g.players.map((p,i)=>({...playerInfo(p,i),c:crsOfPlayer(line,p)})).filter(x=>x.c.idxMax);
  if(!info.length)return {need:false};
  const over=info.filter(x=>x.idx!=null&&x.idx>x.c.idxMax);
  const unknown=info.filter(x=>x.idx==null);
  return {need:true,over,unknown,c:info[0].c,ok:!over.length&&(!unknown.length||g.idxOk)};
}

ACT.gfAdd=()=>{

/* Options d'une compétition, reprises du catalogue du proto competitions/ :
   matériel et restauration du jour. Quantité par personne (2 quand on règle
   aussi la part du partenaire) ; une voiturette par équipe. */
const COPTS=[
  {id:'voit',n:'Voiturette 18 trous',d:'Selon le parc disponible, attribuée au départ',p:35,team:true},
  {id:'chariot',n:'Chariot électrique',d:'Batterie 18 trous, à retirer au starter',p:12},
  {id:'seau',n:'Seau de balles practice',d:'Pour s\'échauffer avant le départ',p:5},
  {id:'petitdej',n:'Plateau petit-déjeuner',d:'Servi à l\'accueil avant les premiers départs',p:9.5},
  {id:'dej',n:'Déjeuner club-house',d:'Menu du jour après la partie',p:24},
  {id:'cocktail',n:'Cocktail de remise des prix',d:'Au club-house, à l\'annonce des résultats',p:12}];
const compOptItems=(opts)=>COPTS.filter(o=>(opts||{})[o.id]).map(o=>({n:o.n+((opts[o.id]>1)?' × '+opts[o.id]:''),p:o.p*opts[o.id],pub:o.p*opts[o.id],opt:true}));
function partnerInfo(p){
  if(!p)return null;
  if(p.type==='acc'){const x=PROFILES[p.id];return {n:x.n,st:x.st,idx:x.idx,lic:x.lic,cert:x.cert,dob:x.dob,ini:x.ini}}
  return {n:p.n,st:['licencie'],idx:p.idx,lic:p.lic,cert:'2027-06-30',dob:null,ini:'FF'};
}
function eligibility(cp,x,who){
  const ck=[], you=who==='you';
  if(!x)return [{ok:false,n:'Compte requis',d:'L\'inscription vérifie la licence, le certificat et l\'index : elle se fait depuis un compte.',fix:'login',fixN:'Me connecter'}];
  ck.push(x.lic
    ?{ok:true,n:'Licence FFGolf 2026 valide',d:'N° '+x.lic}
    :{ok:false,n:'Aucune licence FFGolf',d:'Une licence de l\'année est obligatoire pour toute compétition fédérale.',fix:you?'addLic':null,fixN:'Ajouter ma licence'});
  if(x.lic)ck.push(certOk(x,cp.date)
    ?{ok:true,n:'Certificat médical valide le jour J',d:'Valable jusqu\'au '+fdm(x.cert)+' '+x.cert.slice(0,4)}
    :{ok:false,n:'Certificat médical expiré',d:'Expiré le '+fdm(x.cert)+' '+x.cert.slice(0,4)+'. Il doit couvrir la date de la compétition ('+fdm(cp.date)+').',fix:you?'cert':null,fixN:'Déposer un certificat'});
  if(x.idx!=null)ck.push(x.idx<=cp.idxMax
    ?{ok:true,n:'Index '+fidx(x.idx)+' — limite '+cp.idxMax,d:'Index relevé à la FFGolf ce matin.'}
    :{ok:false,n:'Index '+fidx(x.idx)+' supérieur à la limite de '+cp.idxMax,d:'L\'inscription n\'est pas possible. Elle le redeviendra si l\'index descend sous '+cp.idxMax+' avant la clôture du '+fdm(cp.close)+'.'});
  if(cp.minAge&&x.dob){const a=ageAt(x.dob,cp.date);ck.push(a>=cp.minAge
    ?{ok:true,n:'Réservée aux '+cp.minAge+' ans et plus',d:a+' ans le jour de l\'épreuve'}
    :{ok:false,n:'Réservée aux '+cp.minAge+' ans et plus',d:a+' ans le jour de l\'épreuve.'})}
  if(cp.maxAge&&x.dob){const a=ageAt(x.dob,cp.date);ck.push(a<=cp.maxAge
    ?{ok:true,n:'Réservée aux '+(cp.maxAge+1)+' ans et moins',d:a+' ans le jour de l\'épreuve'}
    :{ok:false,n:'Réservée aux moins de '+(cp.maxAge+1)+' ans',d:a+' ans le jour de l\'épreuve.'})}
  return ck;
}
const eligOk=ck=>ck.every(c=>c.ok);
function compRegistered(cp){
  const u=me();if(!u)return null;
  const r=(S.res[u.id]||[]).find(r=>r.kind==='comp'&&r.compId===cp.id||r.kind==='comp'&&r.t===cp.n);
  if(r&&!r.cancelled)return r.pay==='wait'?'wait':'in';
  if(S.cart.some(l=>l.kind==='comp'&&l.compId===cp.id))return 'cart';
  return null;
}

function lessonSlots(pro,k,dur){
  if(!PROS[pro].days.includes(wday(k)))return [];
  const out=[];
  for(let m=540;m+dur<=1080;m+=30){
    const t=toT(m);
    if(m>=720&&m<840)continue;                 /* pause déjeuner du pro */
    if(hash(pro+k+t)%5<2)continue;             /* déjà réservé */
    if(S.cart.some(l=>l.kind==='ind'&&l.pro===pro&&l.d===k&&l.h===t))continue;
    out.push({t,th:[null,'Putting','Petit jeu','Approche','Long jeu','Obstacles',null][hash(pro+k+t+'th')%7]});
  }
  return out;
}

/* ═════════ Panier commun ═════════
   Une ligne garde ses paramètres, pas son prix : le prix est recalculé à
   chaque affichage, ce qui permet de réécrire le panier à la connexion. */
const KTAG={resto:'Restaurant',gf:'Green fee',comp:'Compétition',ind:'Cours',coll:'Cours collectif',stage:'Stage',carnet:'Carnet',pass:'Carte & Pass'};
function lineView(l){
  const u=me(), st=mySt();
  let v={tag:KTAG[l.kind],items:[],sub:'',title:''};
  if(l.kind==='gf'){const c=crs(l.crs), fl=flightsOf(l), multi=fl.length>1;
    v.title=multi?`Green fee · groupe de ${l.players.length}`:'Green fee · '+c.n+(fl[0].h9||c.nine?' · 9 trous':' · 18 trous')+(c.site?' · Golf d\'Hardelot':'');
    v.sub=multi?`${fday(l.d)} · ${fl.length} départs : ${fl.map(f=>fN(f)+' '+f.t).join(', ')} · ${plural(l.players.length,'joueur')}`
      :`${fday(l.d)} · départ ${l.h} · ${plural(l.players.length,'joueur')}`;
    v.items=gfCalc(l);v.cancel=`Annulation gratuite jusqu'à 24 h avant ${multi?'le premier départ':'le départ'}`;
    if(l.editOf&&l.editOf.paid){v.items.push({n:`Déjà réglé · départ du ${fdm(l.editOf.d)} à ${l.editOf.h}`,p:-l.editOf.paid,pub:-l.editOf.paid,paid:true});
      v.title='Changement de départ · '+c.n+(fl[0].h9||c.nine?' · 9 trous':' · 18 trous');v.extra='Vous ne réglez que la différence avec votre départ actuel, qui reste réservé jusqu\'au paiement.'}
    const j=joinOf(l);if(j){const pp=PROFILES[j.id];v.extra=`Vous jouez avec ${pp.n} (${crs(j.crs).n} ${j.t}) · ${pp.n.split(' ')[0]} sera prévenu·e.`}}
  if(l.kind==='comp'){const cp=comp(l.compId), c=crs(cp.crs), x=compPrice(cp,st), pi=partnerInfo(l.partner);
    v.title=cp.n;
    v.sub=`${fday(cp.date)} · ${c.n} · ${cp.fmt}${pi?' · avec '+pi.n:l.solo?' · partenaire attribué par les organisateurs':''}`;
    v.items=[{n:'Droit de jeu',p:x.dj,pub:cp.dj},{n:'Green fee du jour',p:x.gf,pub:x.gfPub,st:x.st}];
    if(pi&&l.split==='me'){const y=compPrice(cp,pi.st);v.items.push({n:'Droit de jeu — '+pi.n,p:y.dj,pub:cp.dj},{n:'Green fee — '+pi.n,p:y.gf,pub:y.gfPub,st:y.st})}
    v.items.push(...compOptItems(l.opts));
    if(pi&&l.split==='each')v.extra=`${pi.n.split(' ')[0]} recevra un lien pour régler sa part (${eur(compPrice(cp,pi.st).p)}). Équipe tenue 48 h.`;
    v.cancel='Désinscription remboursée jusqu\'à la clôture du '+fdm(cp.close);v.acc=true;}
  if(l.kind==='ind'){
    v.title=`Cours individuel · ${l.dur===30?'30 min':'1 h'}`;
    v.sub=`${fday(l.d)} · ${l.h} · ${PROS[l.pro].n}${l.th?' · '+l.th:''}`;
    const x=lessonPrice(LESSON[l.dur],st);
    const vc=l.viaCarnet&&S.cart.some(y=>y.kind==='carnet'&&y.id===l.viaCarnet);
    v.items=[l.credit&&u&&u.credits[l.dur]||vc?{n:vc?'1 crédit du carnet acheté avec ce panier':'Réglé avec 1 crédit carnet',p:0,pub:0,credit:true}:{n:'Cours',...x}];
    v.cancel='Annulation gratuite jusqu\'à 24 h avant le cours';v.acc=true;}
  if(l.kind==='coll'){const c=COLL.find(x=>x.id===l.id);
    v.title=c.n;v.sub=`${fday(c.d)} · ${c.h} · ${c.dur} min · ${PROS[c.pro].n}${l.kid?' · pour '+l.kid.n:''}`;
    v.items=[{n:l.kid?'Inscription '+l.kid.n:'Inscription',...(l.kid?{p:c.p,pub:c.p,st:null}:lessonPrice(c.p,st))}];
    v.cancel='Annulation gratuite jusqu\'à 24 h avant le cours';v.acc=true;}
  if(l.kind==='stage'){const s=STAGES.find(x=>x.id===l.id);
    v.title=s.n;v.sub=`Du ${fdm(s.d)} au ${fdm(s.d2)} · ${s.sched}${l.kid?' · pour '+l.kid.n:''}`;
    v.items=[{n:'Stage complet',...stagePrice(s,st)}];
    v.cancel='Désinscription gratuite jusqu\'à 7 jours avant le stage';v.acc=true;}
  if(l.kind==='pass'){const k=pass(l.id);
    v.title=k.n;v.sub=`${k.cat} · ${k.d} · valable ${k.t} à partir de l'achat`;
    v.items=[{n:'Achat',p:k.p,pub:k.p,st:null}];v.cancel='Utilisable dès le paiement confirmé';v.acc=true;}
  if(l.kind==='carnet'){const k=CARNETS.find(x=>x.id===l.id);
    v.title=k.n;v.sub=`${k.q} cours de ${k.dur===30?'30 min':'1 h'} · valable 12 mois à partir de l'achat`;
    v.items=[{n:'Carnet',...lessonPrice(k.p,st)}];v.cancel='Crédits utilisables dès le paiement confirmé';v.acc=true;}
  if(l.kind==='resto'){v.title='Table · '+RESTO;v.sub=`${fday(l.d)} · ${l.h} · ${plural(l.n,'couvert')}${l.note?' · '+l.note:''}`;
    v.items=[{n:'Réservation de table · réglée sur place',p:0,pub:0,free:true}];v.free=true;v.cancel='Annulation libre jusqu\'à 2 h avant';}
  v.total=v.items.reduce((t,i)=>t+i.p,0);
  v.pub=v.items.reduce((t,i)=>t+(i.credit?0:i.pub),0);
  const pm=S.promo&&PROMOS[S.promo];
  const pk=l.kind==='ind'||l.kind==='coll'?l.kind:l.kind;
  v.promo=pm&&pm.on.includes(pk)?Math.round(v.total*pm.pct*100)/100:0;
  return v;
}
/* Détail des réductions (retour du 24/09) : jamais un seul montant agrégé.
   Chaque tarif statut est regroupé par personne, avec ce qu'il change ligne
   à ligne ; le code promo et l'avoir restent des lignes à part. */
function discounts(){
  const u=me(), G={}, promo=[];
  S.cart.forEach(l=>{const v=lineView(l);
    v.items.forEach(i=>{if(i.credit||!(i.p<i.pub))return;
      const who=i.who||(u?u.n+' (vous)':''), key=who+'|'+i.st, g=G[key]||(G[key]={who,st:i.st,amt:0,rows:[]});
      g.amt+=i.pub-i.p;
      const lbl=i.lbl||(v.items.length>1?v.title+' — '+i.n.toLowerCase():v.title);
      (g.items=g.items||[]).push({lbl,p:i.p,pub:i.pub});
      g.rows.push(`${lbl} : ${i.p===0?'inclus':eur(i.p)+' au lieu de '+eur(i.pub)}`)});
    if(v.promo)promo.push(`${v.title} : −${eur(v.promo)}`)});
  return {st:Object.values(G),promo};
}
/* le tarif gagné en créant son compte pendant l'achat reste signalé tant
   que ce panier n'est pas réglé, et passe en tête du détail */
const isNewSt=g=>!!(S.newSt&&S.newSt.id===S.user&&S.newSt.st.includes(g.st)&&/\(vous\)$/.test(g.who||''));
const dscSort=L=>L.slice().sort((a,b)=>isNewSt(b)-isNewSt(a));
function savingsHtml(T){
  const D=discounts(), pm=S.promo&&PROMOS[S.promo], u=me();

  if(!tot)return `<div class="sumline"><span>Prix public</span><b>${eur(T.pub)}</b></div>${pd}`;
  return `<div class="sumline"><span>Prix public</span><b>${eur(T.pub)}</b></div>${pd}
    <div class="disc"><span class="sbl">Vos réductions</span>
    ${dscSort(D.st).map(g=>{const nw=isNewSt(g);
      return `<div class="dsc ${nw?'new':''}">${nw?`<span class="dsc-new">${ST[g.st].n==='Licencié FFGolf'?'Licence reconnue':'Nouveau statut'} · appliqué à la création de votre compte</span>`:''}
      <div class="dsc-h"><span><b>Tarif ${ST[g.st]?ST[g.st].n:'membre'}</b>${g.who?' · '+g.who:''}</span><b>−${eur(g.amt)}</b></div>
      <ul>${g.items.map(r=>`<li><span>${r.lbl}<br><small>${r.p===0?'inclus':eur(r.p)+' au lieu de '+eur(r.pub)}</small></span><b>−${eur(r.pub-r.p)}</b></li>`).join('')}</ul></div>`}).join('')}
    ${T.promo?`<div class="dsc"><div class="dsc-h"><span><b>Code promo ${S.promo}</b> · ${pm.n}</span><b>−${eur(T.promo)}</b></div>
      <ul>${D.promo.map(r=>`<li>${r}</li>`).join('')}<li>Valable sur les ${pm.d}, appliqué après les tarifs statut.</li></ul></div>`:''}
    ${T.avoir?`<div class="dsc"><div class="dsc-h"><span><b>Avoir</b></span><b>−${eur(T.avoir)}</b></div>

    <div class="dsc-t"><span>Total des réductions</span><b>−${eur(tot)}</b></div></div>`;
}
function cartTotals(){
  let pub=0,sub=0,promo=0;
  let paid=0;
  S.cart.forEach(l=>{const v=lineView(l);pub+=v.pub;sub+=v.total;promo+=v.promo;v.items.forEach(i=>{if(i.paid)paid-=i.p})});
  const u=me();
  const after=sub-promo;
  /* en lien de paiement partagé, l'avoir du team leader ne s'impute pas sur le groupe */
  const avoir=u&&u.avoir&&S.useAvoir&&S.co.pay!=='link'?Math.min(u.avoir,after):0;
  return {pub:pub+paid,paid,sub,save:pub-sub,promo,avoir,due:Math.max(0,Math.round((after-avoir)*100)/100)};
}

    sug.push({k:'gf',tag:'Green fee',t:l.kind==='carnet'?'Mettre vos cours en jeu':'Jouer le même jour',d:l.kind==='carnet'?'Un 9 trous sur Le Manoir, accessible à tous les niveaux.':`Un départ l'après-midi du ${fdm(k)}, après votre cours.`,p:gfPrice(crs('manoir'),k,mySt()),act:'xGf',data:`data-d="${k}" data-c="manoir"`});
    if(l.kind!=='carnet')sug.push({k:'carnet',tag:'Carnet',t:'Carnet 5 cours · 30 min',d:'Pour la suite : 5 cours, valable 12 mois.',p:lessonPrice(200,mySt()),act:'xCarnet'});
    else sug.push({k:'ind',tag:'Cours',t:'Réserver votre premier cours',d:'Les crédits seront disponibles dès le paiement confirmé.',p:lessonPrice(45,mySt()),act:'xInd',data:''});
    sug.push({k:'comp',tag:'Compétition',t:nextComp.n,d:`${fday(nextComp.date)} · ${nextComp.fmt}`,p:compPrice(nextComp,mySt()),act:'compOpen',data:`data-id="${nextComp.id}"`});
  }
  const rs=restoSug(l);if(rs)sug.splice(1,0,rs);
  sug.forEach(s=>{const d=(s.data||'').match(/data-d="([^"]+)"/), id=(s.data||'').match(/data-id="([^"]+)"/);
    s.dup=s.k==='gf'?S.cart.some(x=>x.kind==='gf'&&d&&x.d===d[1])
      :s.k==='resto'?S.cart.some(x=>x.kind==='resto'&&x.d===s.d0)

      :has(s.k)});
  return sug;
}

function swapIn(sz){
  const g=S.gf, w=g.swap;if(!w)return false;
  const ps=w.players.slice(0,g.pax);
  while(ps.length<g.pax)ps.push({type:'guest',n:''});
  let k=0;sz.forEach((n,f)=>{for(let j=0;j<n;j++)ps[k++].f=f});
  g.players=ps;
  g.fopts=sz.map((n,f)=>{const o={...(w.fopts[sz.length===1&&w.fopts.length>1?0:f]||{})};
    GOPTS.forEach(op=>{const m=op.per==='voit'?Math.ceil(n/2):n;if((o[op.id]||0)>m)o[op.id]=m});return o});
  return true;
}

/* Rien à payer. Retour du 24/09 : un cours réglé par un crédit carnet ne
   demande jamais de carte — on explique la règle d'annulation et de no-show.
   La garantie facultative ne vise que les autres lignes, avec un libellé
   adapté (départ, cours, stage…). */
const isCredit=l=>l.kind==='ind'&&l.credit&&me()&&me().credits[l.dur];
function creditNote(){
  const n=S.cart.filter(isCredit).length;if(!n)return '';
  return `<div class="alert soft" style="margin:0 0 14px"><span class="ic">i</span><div><b>${n>1?'Ces cours sont réglés':'Ce cours est réglé'} avec ${n>1?'des crédits':'un crédit'} de votre carnet : aucune carte n'est demandée.</b><br>
    Si vous annulez moins de 24 h avant le cours, le crédit est quand même décompté. Si vous ne venez pas sans prévenir, le crédit est décompté et l'absence est en plus enregistrée comme un no-show.</div></div>`;
}
function zeroHtml(T){
  const co=S.co, rest=S.cart.filter(l=>!isCredit(l)), gf=rest.some(l=>l.kind==='gf'), other=rest.some(l=>l.kind!=='gf');
  const what=gf&&!other?(rest.length>1?'mes départs':'mon départ'):rest.length>1?'mes réservations':({ind:'mon cours',coll:'mon cours',stage:'mon stage',comp:'mon inscription'}[rest[0]&&rest[0].kind]||'ma réservation');
  return `${creditNote()}
    ${rest.length?`<p class="sub"><b style="color:var(--ink)">Rien à régler</b> : ${T.avoir?'votre avoir couvre le total':'incluses dans votre abonnement'}.</p>
      <button class="sw ${co.garantie?'on':''}" data-act="coGar" style="margin-top:8px"><span><b class="h3">Garantir ${what} par carte</b><br><span class="mut">Facultatif. Rien n'est débité ; ${gf&&!other?'30 € par joueur':'le montant de la prestation'} en cas d'absence non prévenue 24 h avant.</span></span><i></i></button>
      ${co.garantie?cardFields():''}
      <p class="note">Arbitrage du cadrage : l'abonné réserve sans paiement et l'empreinte reste facultative. Si les absences augmentent, le club pourra la rendre obligatoire sans changer l'écran.</p>`
    :`<p class="sub"><b style="color:var(--ink)">Rien à régler</b>, aucune carte à saisir.</p>`}`;
}
/* ═════════ Moyens de paiement (retour du 24/09) ═════════
   Tout régler maintenant (e-wallet, chèque cadeau, carte pour le reste),
   ou lien de paiement unique envoyé au team leader : il pose son empreinte,
   chacun règle ensuite ses propres prestations avec le même lien. */
const GIFTS={'CADEAU-100':100,'CADEAU-50':50};
const canLink=()=>S.cart.some(l=>(l.kind==='gf'&&l.players.length>1)||(l.kind==='comp'&&l.partner));
function payRest(T,u){
  const co=S.co;let left=T.due;
  const w=co.pay==='all'&&co.wallet&&u&&u.wallet?Math.min(u.wallet,left):0;left-=w;
  const gc=co.pay==='all'&&co.gift?Math.min(co.gift.amt,left):0;left-=gc;
  return {w,gc,rest:Math.round(left*100)/100};
}
function payHtml(T,u){

  return `${L?`<div class="radios" style="margin-bottom:14px">
      <button class="radio ${co.pay==='all'?'on':''}" data-act="coPayMode" data-v="all"><span class="dot"></span><div><b>Je règle tout maintenant</b><small>Carte bancaire, e-wallet ou chèque cadeau, seuls ou combinés.</small></div></button>

    ${co.pay==='link'?`<div class="steps">

        <div class="ck ok"><span class="ic">2</span><div><b>Vous partagez un lien unique</b><small>Il s'affiche juste après et vous est envoyé par e-mail : transmettez-le à vos joueurs (SMS, WhatsApp, e-mail).</small></div></div>
        <div class="ck ok"><span class="ic">3</span><div><b>Chacun ouvre le même lien et coche ses prestations</b><small>Sa place, sa voiturette, sa location de clubs… puis règle sa part par carte, e-wallet ou chèque cadeau. Votre propre part se règle de la même façon.</small></div></div>
        <div class="ck ok"><span class="ic">4</span><div><b>Les joueurs non identifiés créent leur compte en payant</b><small>Un invité ajouté sans licence ni compte crée son compte au moment de son paiement : sa place est alors rattachée à son nom.</small></div></div></div>

      <p class="note">Délai de 48 h avant débit des parts impayées : hypothèse de la maquette, à arbitrer. Le lien reste valable jusqu'à cette échéance.</p>`
    :`${u&&u.wallet?`<button class="sw ${co.wallet?'on':''}" data-act="coWallet"><span><b class="h3">Payer avec mon e-wallet</b><br><span class="mut">Solde disponible : ${eur(u.wallet)}${co.wallet?' · '+eur(x.w)+' utilisés':''}</span></span><i></i></button>`
        :u?'':`<p class="mut" style="margin-bottom:8px">E-wallet : connectez-vous pour utiliser votre solde.</p>`}
      <div class="h3" style="margin:12px 0 8px">Chèque cadeau</div>
      ${co.gift?`<div class="between"><span><span class="tag ol">${co.gift.code}</span> <span class="mut">${eur(x.gc)} utilisés sur ${eur(co.gift.amt)}${co.gift.amt>x.gc?' · le solde reste sur le chèque':''}</span></span><button class="lnk" style="font-size:12px" data-act="coGiftX">Retirer</button></div>`
        :`<div class="codebox"><input id="giftIn" placeholder="Code du chèque cadeau" style="text-transform:none"><button class="btn sm sec" data-act="coGift">Appliquer</button></div>
          ${co.giftErr?`<p class="mut" style="margin-top:6px">${co.giftErr}</p>`:''}`}
      ${x.rest>0?`<div class="sect" style="margin:16px 0 4px">Carte bancaire · ${eur(x.rest)}</div>${cardFields()}

      <p class="note">Démo : chèques cadeaux CADEAU-100 et CADEAU-50. E-wallet de 60 € sur le compte de Claire Dumas.</p>`}`;
}
function payRecap(T,u){
  const co=S.co, x=payRest(T,u);
  if(co.pay==='link')return `<div class="sumline"><span>Débité aujourd'hui</span><b>0 €</b></div><p class="mut" style="font-size:12px">${eur(T.due)} à régler par les joueurs via le lien de paiement.${u&&u.avoir&&S.useAvoir?' Votre avoir reste disponible pour régler votre propre part.':''}</p>`;

ACT.coPay=()=>{
  const u=me(), T=cartTotals(), sav=savingsHtml(T);   /* figé avant de débiter l'avoir */

const RULES={gf:{h:24,n:'jusqu\'à 24 h avant le départ'},ind:{h:24,n:'jusqu\'à 24 h avant le cours'},coll:{h:24,n:'jusqu\'à 24 h avant le cours'},

}

  const end=u.licEnd||'2026-12-31', n=daysTo(end), soon=n<=60;

    <small>${n<0?'Expirée depuis le ':'Valable jusqu\'au '}${fdm(end)} ${end.slice(0,4)}${soon&&n>=0?` · <b style="color:var(--terra)">expire dans ${plural(n,'jour')}</b>`:''}${soon?'<br>Sans licence à jour, le tarif Licencié FFGolf ne s\'applique plus et les compétitions sont fermées.':''}</small></div>
    ${soon?'<button class="btn sm" data-act="licRenew">Renouveler</button>':''}</div>`;
}
ACT.licRenew=()=>sheet(shead('Renouveler ma licence','FFGolf')+`<p class="sub" style="margin:4px 0 14px">Le renouvellement se fait auprès de la FFGolf ou de votre club. Dès qu'il est enregistré, votre nouvelle échéance remonte ici à la synchronisation de la nuit, et le tarif Licencié continue de s'appliquer.</p>
  <button class="btn full" data-act="licRenewGo">Renouveler sur l'espace licencié FFGolf ↗</button>
  <button class="btn ghost full" style="margin-top:8px" data-act="close">Plus tard</button>
  <p class="note">Le renouvellement est proposé à partir de 60 jours avant l'échéance (retour du 24/09). Démo : la licence de Marc Lefèvre expire le 31 octobre.</p>`);
ACT.licRenewGo=()=>{closeSheet();toast('Redirection vers l\'espace licencié FFGolf.')};
R.espace=()=>{
  const u=me();
  if(!u){
    $('#v-espace').innerHTML=`<div class="scr-head"><h1 class="h1">Mon espace</h1><span class="node">Espace personnel</span></div>
     <div class="card" style="padding:30px;text-align:center;max-width:520px;margin:0 auto"><b class="h2">Connectez-vous pour accéder à votre espace</b>

  }

        <div><b>${r.t}</b><span class="mut">${cap(fday(r.d))}${r.h?' · '+r.h.replace(':',' h '):''} · ${r.sub.replace(/^Liste d'attente · /,'')}</span></div>
        <button class="btn sm ghost" data-act="waitQuit" data-id="${r.id}">Me désinscrire</button></div>`).join('')}</div>`:''}

     <div class="chips"><button class="chip ${S.resTab==='avenir'?'on':''}" data-act="resTab" data-v="avenir">À venir · ${up.filter(r=>r.pay!=='wait').length}</button>

     ${list.length?list.map(r=>{const d=dobj(r.d), ci=r.past||r.cancelled?null:cancelInfo(r), wait=r.pay==='wait';

         <div class="cdate"><small>${DAYS[d.getDay()].slice(0,3)}.</small><b>${d.getDate()}</b><small>${MABR[d.getMonth()]}</small></div>
         <div><div class="row wrap" style="gap:6px"><span class="tag">${KTAG[r.kind]}</span>${wait?'<span class="tag ol">Liste d\'attente</span>':''}${r.fresh?'<span class="tag dk">Nouveau</span>':''}${r.cancelled?'<span class="tag">Annulé</span>':''}</div>
           <b class="h3" style="display:block;margin-top:6px">${r.t}</b>
           <div class="mut">${r.h?r.h.replace(':',' h ')+' · ':''}${r.sub}</div>
           <div class="mut">${r.cancelled?r.cancelled:r.pay==='place'?'À régler sur place':r.pay==='credit'?'Réglé avec 1 crédit carnet':r.pay==='incl'?'Inclus dans votre abonnement':wait?'Rien n\'est débité tant qu\'une place ne se libère pas':r.past?'Réglé '+eur(r.amount):'Réglé '+eur(r.amount)+' par carte'}</div>
           ${ci&&!wait?`<div class="mut" style="margin-top:4px">${ci.ok?'Annulation gratuite '+ci.n+' ('+fdl(ci.dl)+')':'<b style="color:var(--ink)">Délai d\'annulation en ligne dépassé</b> (limite : '+fdl(ci.dl)+'). Contactez l\'accueil du golf.'}</div>`:''}
         </div>
         <div class="acts">${r.past||r.cancelled?(r.kind==='gf'&&r.past?`<button class="btn sm ghost" data-act="rebook" data-id="${r.id}">Réserver à nouveau</button>`:'')
           :wait?`<button class="btn sm ghost" data-act="resCancel" data-id="${r.id}">Quitter la liste</button>`
           :`${r.kind==='gf'?`<button class="btn sm sec" data-act="resQr" data-id="${r.id}">QR code</button>`:''}
             <button class="btn sm ghost" data-act="resEdit" data-id="${r.id}" ${ci.ok?'':'disabled'}>Modifier</button>
             <button class="btn sm ghost" data-act="resCancel" data-id="${r.id}" ${ci.ok?'':'disabled'}>${r.kind==='comp'?'Me désinscrire':'Annuler'}</button>`}</div>
       </div>`}).join('')
     :`<div class="card" style="padding:26px;text-align:center"><b class="h3">${S.resTab==='avenir'?'Aucune réservation à venir':'Rien à afficher'}</b>

  if(tab==='statut'){

    const rowsT=[

    body=`<div class="grid g2" style="align-items:start">

     <div class="sect">Vos tarifs au Touquet</div>
     <div class="card" style="padding:4px 8px;overflow-x:auto"><table class="ttable"><thead><tr><th>Prestation</th><th class="r">Prix public</th><th class="r">Votre prix</th><th class="hide-s">Statut appliqué</th></tr></thead>
       <tbody>${rowsT.map(([n,s,x])=>`<tr><td><b style="font-weight:600">${n}</b>${s?`<div class="mut">${s}</div>`:''}</td><td class="r">${eur(x.pub)}</td><td class="r"><b>${x.p===0&&x.pub>0?'Inclus':eur(x.p)}</b></td><td class="hide-s mut">${x.st?ST[x.st].n:'—'}</td></tr>`).join('')}</tbody></table></div>
     <p class="note">Ce tableau répond à la demande du client : « avoir accès à son espace personnel pour avoir les prix associés à son statut ». Il est calculé avec les mêmes règles que le moteur, et ne peut donc jamais contredire un prix affiché dans les tunnels.</p>`;
  }
  if(tab==='carnets'){
    const cr=Object.entries(u.credits);
    body=`<div class="sect" style="margin-top:0">Carnets de cours</div>
     ${cr.length?`<div class="grid g2">${cr.map(([d,c])=>`<div class="card pack"><span class="tag" style="align-self:flex-start">Valable jusqu'au ${fdm(c.end)} ${c.end.slice(0,4)}</span>
       <b class="h2">Cours de ${d==='30'?'30 min':'1 h'}</b>
       <div style="font-size:28px;font-weight:700;letter-spacing:-.5px">${c.left}<span class="mut" style="font-size:13px;font-weight:500"> / ${c.tot} cours restants</span></div>
       <div class="prog">${Array.from({length:c.tot},(_,i)=>`<i class="${i<c.left?'on':''}"></i>`).join('')}</div>
       <div class="foot"><span class="mut">${c.tot-c.left} utilisé${c.tot-c.left>1?'s':''}</span><button class="btn sm" data-act="indOpen" data-d="${d}" ${c.left?'':'disabled'}>Réserver un cours</button></div></div>`).join('')}</div>`
      :`<div class="card" style="padding:20px"><b class="h3">Aucun carnet en cours</b><p class="sub" style="margin:4px 0 12px">Un carnet de 5 ou 10 cours revient moins cher que les cours à l'unité.</p><button class="btn sm" data-go="pass">Voir les carnets</button></div>`}
     ${(u.passes||[]).length?`<div class="sect">Cartes &amp; pass</div>
     <div class="grid g2">${u.passes.map(x=>{const k=pass(x.id);
       return `<div class="card pack"><span class="tag" style="align-self:flex-start">${k.cat} · acheté le ${fdm(x.d)}</span>
         <b class="h2">${k.n}</b><span class="sub">${k.d}</span>
         <div class="foot"><span class="mut">Valable ${k.t}</span><button class="btn sm ghost" data-go="gf">Réserver un départ</button></div></div>`}).join('')}</div>`:''}
     <div class="grid g2" style="align-items:start">
      <div><div class="sect">E-wallet</div>
       <div class="card" style="padding:16px"><b class="h2">${eur(u.wallet||0)}</b>
        <div class="mut">Solde de votre porte-monnaie électronique${u.wallet?' · utilisable au paiement, sur toutes les prestations':''}</div>
        <p class="mut" style="margin-top:8px;font-size:12px">${u.wallet?'Au moment de payer, cochez « Payer avec mon e-wallet » : le solde est déduit avant la carte.':'Le e-wallet se crédite à l\'accueil du golf.'}</p></div></div>
      <div><div class="sect">Avoirs</div>
       <div class="card" style="padding:16px">${u.avoir?`<b class="h2">${eur(u.avoir)}</b><div class="mut">Avoir suite à une annulation · valable jusqu'au ${fdm(u.avoirEnd)} ${u.avoirEnd.slice(0,4)}<br>Sur toutes les prestations golf : parcours, locations, compétitions, enseignements</div>`
         :'<span class="mut">Aucun avoir disponible.</span>'}
        <div class="hr" style="margin:12px 0"></div>
        <label class="chkbox"><input type="checkbox" data-avoirauto ${u.avoirAuto!==false?'checked':''}><span><b style="color:var(--ink);font-weight:500">Utiliser automatiquement mes avoirs au panier</b><br>${u.avoirAuto!==false?'Vos avoirs sont déduits d\'office ; vous pouvez toujours les retirer au panier.':'Vos avoirs sont conservés ; vous pouvez les activer au panier, commande par commande.'}</span></label></div></div>
     </div>
     <p class="note">Retour du 24/09 : solde du e-wallet affiché à côté des avoirs, et choix de l'utilisation automatique des avoirs au panier. Décoché, l'interrupteur du panier démarre sur « non » à chaque connexion.</p>`;
  }
  if(tab==='proches')body=prochesTab(u);
  if(tab==='infos'){
    const cOk=u.cert&&u.cert>=TODAY, pub=!!u.pubProfile;
    const crow=(n,v,ph)=>`<div class="kv"><span class="mut">${n}</span>${v?`<b>${v}</b>`:`<span class="mut">${ph}</span>`}</div>`;
    body=`<div class="grid g2 infos" style="align-items:start">
     <div class="col">
      <div class="card" style="padding:16px 18px"><div class="between" style="margin-bottom:4px"><div class="h3">Coordonnées</div><button class="lnk" style="font-size:12px" data-act="coordEdit">Modifier</button></div>
       ${crow('E-mail',u.email)}
       ${crow('Téléphone',u.tel,'Non renseigné')}
       ${crow('Adresse postale',u.addr,'Non renseignée')}
       ${crow('Golf de rattachement',u.club,'Non renseigné')}</div>
      <div class="card" style="padding:4px 18px">
       <div class="ck ${u.lic?'ok':'ko'}"><span class="ic">${u.lic?'✓':'✕'}</span><div><b>Licence FFGolf</b><small>${u.lic?'N° '+u.lic+' · valable jusqu\'au '+fdm(u.licEnd||'2026-12-31')+' '+(u.licEnd||'2026').slice(0,4)+' · synchronisée chaque nuit':'Aucune licence rattachée'}</small></div>${u.lic?'':'<button class="btn sm sec" data-act="addLic">Ajouter</button>'}</div>
       <div class="ck ok"><span class="ic">✓</span><div><b>Index ${fidx(u.idx)}</b><small>Relevé FFGolf du 17 septembre</small></div></div>
       <div class="ck ok"><span class="ic">✓</span><div><b>Date de naissance</b><small>${fdm(u.dob)} ${u.dob.slice(0,4)} · ${ageAt(u.dob,TODAY)} ans</small></div></div>
       <div class="ck ok"><span class="ic">✓</span><div><b>Statut</b><small>${u.st.map(s=>ST[s].n).join(' · ')||'Prix public'}</small></div></div>
      </div>
     </div>
     <div class="col">
      <div class="card" style="padding:4px 18px"><div class="h3" style="padding:14px 0 2px">Documents</div>
       <div class="ck ${cOk?'ok':'ko'}"><span class="ic">${cOk?'✓':'✕'}</span><div><b>Certificat médical</b><small>${u.cert?(cOk?'Valable jusqu\'au ':'Expiré depuis le ')+fdm(u.cert)+' '+u.cert.slice(0,4):'Non déposé'}${cOk?'':' — requis pour les compétitions'}</small></div><button class="btn sm ${cOk?'ghost':'sec'}" data-act="cert">${cOk?'Remplacer':'Déposer'}</button></div>
       ${u.lic?`<div class="ck ok"><span class="ic">✓</span><div><b>Attestation de licence 2026</b><small>Fournie par la FFGolf · PDF</small></div><button class="btn sm ghost" data-act="docDl">Télécharger</button></div>`:''}
      </div>
      <div class="card" style="padding:16px 18px">
       <div class="h3" style="margin-bottom:8px">Notifications</div>
       <label class="chkbox"><input type="checkbox" data-smsrem ${u.smsOff?'':'checked'} ${u.tel?'':'disabled'}><span><b style="color:var(--ink);font-weight:500">Rappel par SMS 24 h avant</b><br>${u.tel?'Chaque départ, cours, stage ou compétition, au '+u.tel+'.':'Ajoutez un numéro de téléphone dans vos coordonnées.'}</span></label>
       <p class="mut" style="margin-top:8px;font-size:12px">Confirmations, modifications et annulations : toujours par e-mail, à ${u.email}.</p>
      </div>
      <div class="card" style="padding:16px 18px">
       <div class="h3" style="margin-bottom:4px">Visibilité sur les départs</div>
       <p class="mut" style="margin-bottom:10px">Ce que voient les joueurs inscrits sur le même créneau que vous.</p>
       <div class="seg2" style="margin-bottom:12px"><button class="${pub?'on':''}" data-act="pubProfile" data-v="1">Nom et index</button><button class="${pub?'':'on'}" data-act="pubProfile" data-v="0">Profil masqué</button></div>
       <div class="vis">
        <div class="vis-r"><span class="ic ok">✓</span><div><b>Vos proches</b><small>Voient toujours votre nom et votre index, même en profil masqué.</small></div></div>
        <div class="vis-r"><span class="ic ${pub?'ok':''}">${pub?'✓':'—'}</span><div><b>Les autres joueurs</b><small>${pub?'Voient votre nom et votre index.':'Voient seulement « Profil masqué » et votre index.'}</small></div></div>
       </div>
       <p class="mut" style="margin-top:10px;font-size:12px">Masquer votre profil ne le cache pas à tout le monde : les personnes ajoutées dans <button class="lnk" style="font-size:12px" data-act="spaceTab" data-t="proches">Mes proches</button> continuent de vous reconnaître sur un départ.</p>
      </div>
     </div></div>
     <p class="note">Retour du 24/09 : coordonnées, licence et profil golfeur à gauche ; documents et visibilité à droite. Téléphone, adresse postale et golf de rattachement ajoutés aux coordonnées.</p>`;
  }
  $('#v-espace').innerHTML=`
   <div class="scr-head"><div class="hello"><span class="av" style="width:58px;height:58px;font-size:17px">${u.ini}</span>
     <div><span class="eyebrow" style="margin-bottom:4px">Mon espace</span><h1 class="h1">Bonjour <b>${u.n.split(' ')[0]}</b></h1><p class="sub">${u.st.map(s=>ST[s].n).join(' · ')}</p></div></div>
     <button class="btn ghost sm logout" data-act="logout"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg><span class="lo-t">Se déconnecter</span></button></div>
   <div class="tabs">${tabs.map(([k,n,c])=>`<button class="${tab===k?'on':''}" data-act="spaceTab" data-t="${k}">${n}${c!=null?`<i>${c}</i>`:''}</button>`).join('')}</div>
   ${body}`;
};
document.addEventListener('change',e=>{const el=e.target.closest('[data-smsrem]');if(!el)return;
  me().smsOff=!el.checked;render();toast(el.checked?'Rappel SMS activé : 24 h avant chaque réservation.':'Rappel SMS désactivé. Vous gardez les e-mails de confirmation.')});
document.addEventListener('change',e=>{const el=e.target.closest('[data-avoirauto]');if(!el)return;
  const u=me();u.avoirAuto=el.checked;S.useAvoir=el.checked;render();
  toast(el.checked?'Vos avoirs seront déduits automatiquement au panier.':'Vos avoirs ne seront plus déduits automatiquement.')});
ACT.coordEdit=()=>{const u=me();
  sheet(shead('Mes coordonnées','')+`<label class="field"><span>E-mail</span><input value="${u.email}" disabled></label>
    <label class="field"><span>Téléphone</span><input id="cdTel" type="tel" value="${u.tel||''}" placeholder="06 00 00 00 00"></label>
    <label class="field"><span>Adresse postale</span><input id="cdAddr" value="${u.addr||''}" placeholder="N°, rue, code postal, ville"></label>
    <label class="field"><span>Golf de rattachement</span><input id="cdClub" list="cdClubs" value="${u.club||''}" placeholder="Le golf où vous êtes membre"></label>
    <datalist id="cdClubs">${['Le Touquet Golf Resort','Golf d\'Hardelot','Golf de Belle Dune','Golf de Brigode','Golf de Wimereux'].map(x=>`<option value="${x}">`).join('')}</datalist>
    <p class="mut" style="margin:-4px 0 14px">Le golf de rattachement est celui de votre licence FFGolf ; il sert aux compétitions et aux accords de réciprocité.</p>
    <button class="btn full" data-act="coordSave">Enregistrer</button>`)};
ACT.coordSave=()=>{const u=me();u.tel=$('#cdTel').value.trim();u.addr=$('#cdAddr').value.trim();u.club=$('#cdClub').value.trim();closeSheet();render();toast('Coordonnées enregistrées.')};
ACT.docDl=()=>toast('Attestation de licence téléchargée.');
ACT.spaceTab=a=>{S.space=a.dataset.t;if(S.screen==='espace')render();else go('espace')};
ACT.resTab=a=>{S.resTab=a.dataset.v;render()};
const findRes=id=>(S.res[S.user]||[]).find(r=>r.id===id);
ACT.resQr=a=>{const r=findRes(a.dataset.id);
  sheet(shead(r.t,'QR code de départ')+`<div style="display:grid;place-items:center;margin:16px 0"><div class="qr lg"></div></div>
   <p class="sub" style="text-align:center">${fday(r.d)} · ${r.h}<br>${r.sub}</p>
   <p class="mut" style="text-align:center;margin-top:8px">À présenter au starter. Il fonctionne aussi hors connexion une fois affiché.</p>`)};
ACT.resCancel=a=>{
  const r=findRes(a.dataset.id), wait=r.pay==='wait';
  const refund=r.pay==='card'&&r.amount>0;
  sheet(shead(wait?'Quitter la liste d\'attente':r.kind==='comp'?'Me désinscrire':'Annuler la réservation',KTAG[r.kind])+
   `<p class="sub" style="margin:4px 0 14px"><b style="color:var(--ink)">${r.t}</b> · ${fday(r.d)}${r.h?' · '+r.h:''}</p>

const resPlayers=r=>r.players||[{type:'self',paid:r.amount}];

function mvState(){
  const m=S.mv, r=findRes(m.rid), ps=resPlayers(r), sel=m.sel.filter(i=>ps[i]);
  const tc=m.tc||m.crs, c=crsV(tc,tc===m.crs?m.h9:false);
  const paid=sel.reduce((t,i)=>t+(ps[i].paid||0),0);
  const news=sel.map(i=>({i,p:ps[i],w:mvWho(ps[i],i),x:gfPrice(c,m.date,playerInfo(ps[i],i).st)}));
  const nw=news.reduce((t,y)=>t+y.x.p,0);
  return {m,r,ps,sel,c,paid,news,nw,diff:Math.round((nw-paid)*100)/100};
}
function mvTimes(c,k,n,r){

}

function mvOut(o,moved){
  const ps=resPlayers(o);
  if(!moved||moved.length>=ps.length){o.cancelled='Remplacé par la modification du '+fdm(TODAY);return}
  const out=moved.reduce((t,i)=>t+(ps[i].paid||0),0);
  o.players=ps.filter((p,i)=>!moved.includes(i));o.amount=Math.round((o.amount-out)*100)/100;
  o.sub=plural(o.players.length,'joueur')+' · '+o.players.map((p,i)=>mvWho(p,i).n.replace(' (vous)','')).join(', ');
}
ACT.mvGo=()=>{

  if(X.diff>0){
    players.forEach(p=>delete p.paid);
    addLine({kind:'gf',d:m.date,h:m.t,crs:tc,flights:[{crs:tc,t:m.t,h9}],players,fopts:[{}],
      editOf:{id:r.id,d:r.d,h:r.h,moved:sel,paid:X.paid}});

      <p class="mut" style="margin-top:8px">La date de naissance calcule le tarif jeune ou senior ; la licence ajoute le tarif licencié et l'index.</p>`;
  }
  if(a.mode==='invite'){
    const link='resonance-golf.fr/i/'+me().ini+'-7F3K';
    body=`<p class="sub" style="margin-bottom:14px">Transmettez ce lien à votre proche par SMS ou par messagerie : il crée son compte (ou se connecte) et apparaît aussitôt dans vos proches, et vous dans les siens.</p>
      <div class="codebox"><input value="${link}" readonly style="text-transform:none"><button class="btn sm" data-act="paCopy">Copier</button></div>
      <div class="row wrap" style="gap:8px;margin-top:10px"><button class="btn sm ghost" data-act="paCopy">Envoyer par SMS</button><button class="btn sm ghost" data-act="paCopy">Partager sur WhatsApp</button></div>
      <p class="mut" style="margin-top:10px">Lien valable 30 jours, utilisable une seule fois.</p>
      <p class="note">Plus d'ajout par e-mail (retour du 24/09) : ni recherche, ni invitation envoyée depuis le moteur à une adresse. Une même adresse pouvant être partagée par deux personnes, on risquerait de rattacher la mauvaise.</p>`;
  }
  return shead('Ajouter un proche')+
    `<div class="seg2" style="margin:8px 0 18px;display:flex">${[['find','Il a une licence'],['create','Créer son profil'],['invite','Inviter par lien']].map(([k,n])=>`<button class="${a.mode===k?'on':''}" style="flex:1" data-act="paMode" data-v="${k}">${n}</button>`).join('')}</div>`+body;
}

}

ACT.procheAdd=()=>{S.pa={mode:'find',rel:'Ami·e'};paOpen()};

ACT.paFind=()=>{
  const a=S.pa, q=(a.q||'').trim().toLowerCase(), u=me();
  a.found=null;a.err='';
  const acc=Object.values(PROFILES).find(x=>x.lic===q);
  if(acc&&acc.id===u.id)a.err='C\'est votre propre compte.';
  else if(acc&&u.partners.includes(acc.id))a.err=acc.n+' fait déjà partie de vos proches.';
  else if(acc)a.found=acc;
  else if(/^\d{9}$/.test(q))a.found={id:'lic'+q,n:q==='123456789'?'Julien Morel':'Licencié·e n° '+q,ini:q==='123456789'?'JM':'FF',st:['licencie'],idx:q==='123456789'?38:20,lic:q,cert:'2027-06-30',_new:true};

};
function addProche(p,rel){
  const u=me();

/* « Réserver un départ avec » : le proche est placé d'office dans le départ choisi */
ACT.procheBook=a=>{

  go('gf');toast(`Choisissez un départ : ${PROFILES[a.dataset.id].n.split(' ')[0]} y sera ajouté·e automatiquement.`);

function applyWith(){
  const g=S.gf;if(!g.with||!g.with.length)return;
  const free=g.players.map((p,i)=>p.type==='guest'?i:-1).filter(i=>i>=0);

/* inscription d'un enfant : ses proches mineurs sont proposés d'emblée */

  $$('[data-act="kidPick"]').forEach(b=>b.classList.toggle('on',b===a))};


/* ═════════ Mes proches sur le parcours ═════════
   Un proche n'apparaît que s'il partage ses départs (réglage de son compte,
   désactivé par défaut). Rejoindre son départ = une réservation indépendante :
   on ne paie que ses propres places, et le proche est prévenu. */
function proxOn(k){
  const u=me();if(!u)return [];
  return u.partners.map(id=>PROFILES[id]).filter(p=>p&&p.share&&FRES[p.id])
    .flatMap(p=>FRES[p.id].filter(r=>r.d===k).map(r=>{const x=slots(crs(r.crs),k).find(s=>s.t===r.t);return {...r,p,free:x?x.free:0}}))
    .sort((a,b)=>a.t<b.t?-1:1);
}
const proxNeed=()=>isGroup()?1:S.gf.pax;
const inGroupSel=(c,t)=>isGroup()&&S.gf.flights.some(f=>f.crs===c&&f.t===t);
function nearSlots(c,t,need){
  const all=slots(c,S.gf.date).filter(s=>s.free>=need&&!inGroupSel(c.id,s.t));
  return {before:all.filter(s=>s.t<t).pop()||null,after:all.find(s=>s.t>t)||null};
}
/* repères de la grille : créneaux des proches et créneaux voisins */
function proxMarks(c){
  const g=S.gf, byT={}, near={};
  if(!g.prox||!me())return {byT,near};
  const P=proxOn(g.date).filter(r=>r.crs===c.id&&inMoment(r.t,g.moment));
  P.forEach(r=>(byT[r.t]=byT[r.t]||[]).push(r));
  const seq=slots(c,g.date).map(s=>s.t);
  P.forEach(r=>{const i=seq.indexOf(r.t);[seq[i-1],seq[i+1]].forEach(t=>{if(t&&!byT[t])near[t]=r.p.n.split(' ')[0]})});
  return {byT,near};
}
const gav=r=>`<span class="gav" title="${r.p.n}">${r.p.ini}</span>`;
function proxSeg(){
  const g=S.gf, on=!!g.prox, n=on?new Set(proxOn(g.date).map(r=>r.p.id)).size:0;
  return `<div class="sbf sbf-prox"><span class="sbi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M2.5 19c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5"/><path d="M14 14.2c.8-.4 1.6-.6 2.5-.6 2.5 0 4.5 2 4.5 4.6"/></svg></span>
    <div class="sbt"><span class="sbl">Mes proches</span>
      <button class="sw ${on?'on':''}" data-act="proxTog" aria-pressed="${on}" style="padding:0"><span class="sbv" style="font-size:14px">${on?(n?`<b>${n}</b> ce jour`:'Aucun ce jour'):'Afficher'}</span><i></i></button></div></div>`;
}
function proxBar(){
  const u=me();if(!u)return '';
  const g=S.gf, L=proxOn(g.date), who=[...new Map(L.map(r=>[r.p.id,r.p])).values()], on=!!g.prox;
  return `<div class="proxbar ${on?'on':''} ${who.length?'':'none'}">
    <button class="sw ${on?'on':''}" data-act="proxTog" aria-pressed="${on}">
      <span class="pb-t"><b>Mes proches</b><span class="mut">${who.length?`${plural(who.length,'proche joue','proches jouent')} ${fday(g.date)}`:`Aucun proche ne joue ${fday(g.date)}`}</span></span>
      ${who.length?`<span class="pb-av">${who.map(p=>`<span class="gav">${p.ini}</span>`).join('')}</span>`:''}<i></i></button>
    <button class="lnk" style="font-size:12px" data-act="spaceTab" data-t="proches">Gérer le partage</button>
  </div>`;
}
function proxBlock(){
  const g=S.gf, u=me();
  if(!g.prox||!u)return '';
  const L=proxOn(g.date), need=proxNeed();
  if(!L.length)return `<div class="card prox"><div class="prox-h"><span class="eyebrow">Mes proches sur le parcours</span>
    <b class="h3">Aucun de vos proches ne joue ${fday(g.date)}</b>
    <span class="mut">Seuls les proches qui partagent leurs départs avec vous apparaissent ici.</span></div></div>`;
  const pick=(c,s,lbl)=>`<button class="btn sm ghost" data-act="proxPick" data-c="${c.id}" data-t="${s.t}">${s.t} · ${lbl}</button>`;
  return `<div class="card prox"><div class="prox-h"><span class="eyebrow">Mes proches sur le parcours</span>
      <b class="h2">Vos proches jouent ${fday(g.date)}</b></div>
    ${L.map(r=>{
      const c=crs(r.crs), blocked=c.idxMax&&u.idx!=null&&u.idx>c.idxMax, fn=r.p.n.split(' ')[0];
      const sel=inGroupSel(r.crs,r.t);
      let act;
      if(blocked){const alt=nearSlots(crs('foret'),r.t,need), s=alt.after||alt.before;
        act=`<span class="mut">Votre index dépasse la limite de ${c.idxMax} fixée pour ${c.n}.</span>${s?pick(crs('foret'),s,'La Forêt'):''}`}
      else if(sel)act=`<span class="done-t">✓ Dans votre sélection</span>`;
      else if(r.free>=need)act=`<button class="btn sm" data-act="proxJoin" data-c="${c.id}" data-t="${r.t}" data-id="${r.p.id}">${isGroup()?'Ajouter ce départ':'Rejoindre ce départ'}</button>`;
      else{const n=nearSlots(c,r.t,need);
        act=`<span class="mut">${r.free?`Plus que ${plural(r.free,'place')} : pas assez pour ${plural(need,'joueur')}.`:'Départ complet.'} Au plus près :</span>
          <span class="row wrap" style="gap:6px">${n.before?pick(c,n.before,'juste avant'):''}${n.after?pick(c,n.after,'juste après'):''}</span>`}
      return `<div class="prox-row"><span class="av" style="width:42px;height:42px">${r.p.ini}</span>
        <div class="pr-t"><b>${r.p.n} · ${c.n} · ${r.t}</b>
          <span class="mut">${relOf(u,r.p.id)} · ${plural(r.n,'joueur')} · ${r.free?plural(r.free,'place libre','places libres'):'complet'}</span></div>
        <div class="pr-a">${act}</div></div>`}).join('')}
    </div>`;
}
ACT.proxTog=()=>{S.gf.prox=!S.gf.prox;render()};
ACT.proxJoin=a=>{
  const g=S.gf, d=a.dataset;
  g.joinWith={id:d.id,crs:d.c,t:d.t};
  if(isGroup()){if(!inGroupSel(d.c,d.t))ACT.gfTog({dataset:{c:d.c,t:d.t}});return}
  ACT.gfPick({dataset:{c:d.c,t:d.t},join:true});
};
ACT.proxPick=a=>{
  const d=a.dataset;
  if(isGroup())ACT.gfTog({dataset:{c:d.c,t:d.t}}); else ACT.gfPick({dataset:{c:d.c,t:d.t}});
};
/* liste des créneaux d'un parcours (réservation 1 à 4 joueurs), proches compris */
function singleTimes(c,ok){
  const g=S.gf, {byT,near}=proxMarks(c), MAX=999;   /* limité à 2 lignes à l'affichage : clampSlots() */
  const extra=Object.keys(byT).concat(Object.keys(near));
  const list=ok.filter((s,i)=>i<MAX||extra.includes(s.t));
  Object.values(byT).forEach(rs=>{if(!list.some(s=>s.t===rs[0].t))list.push({t:rs[0].t,free:rs[0].free,prox:true})});
  list.sort((a,b)=>a.t<b.t?-1:1);
  const rest=ok.length-list.filter(s=>!s.prox).length;
  if(!list.length)return '';
  return `<div class="gtimes" data-clamp="${c.id}">${list.map(s=>{
    const rs=byT[s.t], can=s.free>=g.pax;
    if(rs)return `<button class="gtime pro ${can?'':'full'}" ${can?`data-act="proxJoin" data-id="${rs[0].p.id}"`:'disabled'} data-c="${c.id}" data-t="${s.t}">${rs.map(gav).join('')}<b>${s.t}</b><i>${can?'avec '+rs[0].p.n.split(' ')[0]:'complet'}</i></button>`;
    return `<button class="gtime ${near[s.t]?'nx':''}" data-act="gfPick" data-c="${c.id}" data-t="${s.t}"><b>${s.t}</b><i>${near[s.t]?'à côté de '+near[s.t]:s.free+' pl. libres'}</i></button>`}).join('')}${rest>0?`<button class="gtime more" data-act="gfMore" data-c="${c.id}">+${rest} autres</button>`:''}</div>`;
}
/* réglage « mes départs visibles par mes proches » (espace perso) */
ACT.shareMode=a=>{const u=me();u.shareMode=a.dataset.v;render();
  toast(a.dataset.v==='none'?'Vos départs ne sont plus visibles par vos proches.':a.dataset.v==='all'?'Tous vos proches peuvent voir vos départs.':'Choisissez les proches qui voient vos départs.')};
ACT.shareWith=a=>{const u=me();u.shareWith=u.shareWith||{};u.shareWith[a.dataset.id]=!u.shareWith[a.dataset.id];render()};


/* ═════════ Joueurs déjà inscrits sur un créneau ═════════
   Visible une fois connecté·e : le nom si le joueur a choisi « nom visible »,
   sinon « Profil masqué » avec son index seulement. */
const POOL=[{n:'Hélène Bruneau',idx:16.8,pub:true},{n:null,idx:18.4},{n:'Antoine Vasseur',idx:9.1,pub:true},{n:null,idx:27.0},
  {n:'Camille Bernard',idx:18.4,pub:true},{n:null,idx:11.2},{n:'Thomas Leroy',idx:26.1,pub:true},{n:null,idx:32.5},
  {n:'Nadia Sultan',idx:19.2,pub:true},{n:null,idx:14.9},{n:'Kevin Blanc',idx:16.8,pub:true},{n:null,idx:21.7}];
function occupants(cid,k,t){
  const u=me();if(!u)return [];
  const c=crs(cid), s=slots(c,k).find(x=>x.t===t), taken=Math.max(0,4-(s?s.free:4));
  if(!taken)return [];
  const out=[];
  Object.entries(FRES).forEach(([id,rs])=>rs.forEach(r=>{if(r.crs===cid&&r.d===k&&r.t===t){const p=PROFILES[id];
    out.push({n:p.n,idx:p.idx,pub:p.pubProfile!=null?p.pubProfile:!!p.share,proche:u.partners.includes(id)});
    for(let i=1;i<r.n;i++)out.push({...POOL[hash(cid+k+t+i)%POOL.length]})}}));
  let i=0;
  while(out.length<taken&&i<40){const q=POOL[hash(cid+k+t+'o'+i)%POOL.length];i++;if(q.n&&out.some(o=>o.n===q.n))continue;out.push({...q})}
  /* « Profil masqué » ne vaut que pour les inconnus : un proche voit toujours le nom */
  return out.slice(0,taken).map(o=>({...o,vis:!!((o.pub||o.proche)&&o.n),ini:o.n?o.n.split(' ').map(w=>w[0]).join('').slice(0,2):''}));
}
const occLbl=o=>o.vis?`${o.n} · index ${fidx(o.idx)}`:`Profil masqué · index ${fidx(o.idx)}`;
function occDots(cid,t){
  const L=occupants(cid,S.gf.date,t);if(!L.length)return '';
  return `<span class="occ">${L.map(o=>`<span class="oc ${o.vis?'':'mask'}">${o.vis?o.ini:'<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'}</span>`).join('')}</span>`;
}
function occList(f){
  const L=occupants(f.crs,S.gf.date,f.t);
  if(!L.length)return `<p class="mut occ-none">Personne n'est encore inscrit sur ce départ.</p>`;
  return `<div class="occ-list"><span class="sbl">Déjà inscrits sur ce départ</span>${L.map(o=>`<div class="occ-row"><span class="av ${o.vis?'lt':'mask'}">${o.vis?o.ini:'<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'}</span>
    <div><b>${o.vis?o.n:'Profil masqué'}</b><span class="mut">Index ${fidx(o.idx)}${o.proche&&o.vis?' · votre proche':''}</span></div></div>`).join('')}</div>`;
}
/* ajoute les inscrits sur chaque créneau affiché (liste, sélection de groupe, « + autres ») */
function decorateSlots(root){
  if(!me())return;
  $$(root+' .gtime[data-c][data-t]').forEach(b=>{if(b.querySelector('.occ'))return;
    const L=occupants(b.dataset.c,S.gf.date,b.dataset.t);if(!L.length)return;
    b.insertAdjacentHTML('beforeend',occDots(b.dataset.c,b.dataset.t));
    b.title='Déjà inscrits :\n'+L.map(occLbl).join('\n');
  });
}
ACT.pubProfile=a=>{me().pubProfile=a.dataset.v==='1';render();toast(me().pubProfile?'Votre nom et votre index sont visibles de tous les joueurs de vos départs.':'Profil masqué pour les autres joueurs. Vos proches voient toujours votre nom.')};

/* ═════════ Démarrage ═════════ */
function toggleVp(){
  const st=$('#stage'), m=st.dataset.vp!=='mobile';
  st.dataset.vp=m?'mobile':'desktop';
  document.body.classList.toggle('vp-mobile',m);
  st.scrollTop=0;window.scrollTo(0,0);
  fitPhone();
  if(S&&S.screen==='gf')clampSlots();
}
/* le cadre garde 402 × 874 ; on le réduit seulement si la fenêtre ne le contient pas */
function fitPhone(){
  const m=$('#stage').dataset.vp==='mobile', f=$('#frame'), w=$('.stagewrap');
  const k=m?Math.min(1,(innerHeight-40)/874,(innerWidth-28)/402):1;
  f.style.setProperty('--vps',k);
  w.style.height=m?Math.max(innerHeight,874*k+40)+'px':'';
}
addEventListener('resize',fitPhone);
/* « Voir la suite » : sur mobile, tant que la page continue loin sous l'écran
   et qu'on n'a pas encore fait défiler */
function paintHint(){
  const st=$('#stage'), mob=st.dataset.vp==='mobile'||innerWidth<=640, sc=st.dataset.vp==='mobile'?st:document.scrollingElement;
  const left=sc.scrollHeight-sc.scrollTop-sc.clientHeight;
  $('#moreHint').classList.toggle('on',mob&&S&&S.screen!=='site'&&sc.scrollTop<60&&left>500);
}
$('#stage').addEventListener('scroll',paintHint,{passive:true});addEventListener('scroll',paintHint,{passive:true});addEventListener('resize',paintHint);
$('#moreHint').onclick=()=>{const st=$('#stage'), sc=st.dataset.vp==='mobile'?st:window;sc.scrollBy({top:(st.dataset.vp==='mobile'?st.clientHeight:innerHeight)*.7,behavior:'smooth'})};
$('#vpTog').onclick=toggleVp;
document.addEventListener('keydown',e=>{
  if((e.key==='m'||e.key==='M')&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.target.closest('input,textarea,select'))toggleVp();
});
S=fresh();
go('site');
