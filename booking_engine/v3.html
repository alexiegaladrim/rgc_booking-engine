<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réserver — Le Touquet Golf Resort</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════ Direction artistique Resonance — Le Touquet ══════════
   Mêmes jetons que les écrans client existants (reservation_joueur, eshop) :
   Jost, or #BE9B45, crème, encre chaude. Les --g* de la v2 sont remappés sur
   la gamme chaude pour que les styles en ligne générés en JS suivent. */
:root{
  --gold:#BE9B45; --gold-dark:#A5842F; --gold-light:#F3EAD5; --gold-soft:#FBF6EA;
  --ink:#221C15; --ink-2:#1B150F; --ink-soft:#6B6257;
  --cream:#FAF7F1; --sand:#F3EEE4; --line:#E8E2D6; --line-2:#DDD5C6;
  --green:#5E8C5A; --green-soft:#E9F1E7; --terra:#B4653C; --terra-soft:#F6E9E1;
  --g800:#3A322A; --g700:#5A5147; --g600:#6B6257; --g500:#8C8377; --g400:#B3AA9C;
  --g300:#DDD5C6; --g200:#E8E2D6; --g100:#F1ECE3; --g50:#FAF7F1;
  --paper:#fff; --canvas:#EFEAE1;
  --shadow:0 1px 2px rgba(34,28,21,.04),0 8px 24px rgba(34,28,21,.06);
  --shadow-lg:0 24px 70px rgba(34,28,21,.22);
  --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Jost',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--canvas);
  color:var(--ink);font-size:14.5px;font-weight:400;-webkit-font-smoothing:antialiased;letter-spacing:.1px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
button:disabled{cursor:not-allowed}
b,strong{font-weight:500}
svg{flex:none}
ul{list-style:none}
::selection{background:var(--gold-light)}

/* ══════════ Scène ══════════ */
.stagewrap{display:flex;justify-content:center;padding:0}
.stage{width:100%;background:var(--cream);container-type:inline-size;position:relative}
.stage[data-vp="desktop"]{min-height:100vh}
.stagewrap:has(.stage[data-vp="mobile"]){padding:20px 14px;overflow:hidden;background:radial-gradient(900px 500px at 50% -10%,rgba(190,155,69,.18),transparent 60%),linear-gradient(160deg,#2A2118,#1B150F);min-height:calc(100vh - 0px)}
.stage[data-vp="mobile"]{height:100%;overflow-y:auto}
.stage[data-vp="mobile"]::-webkit-scrollbar{width:0}
/* cadre : en mobile, il contient la modale et le toast (le transform en fait
   le repère des éléments en position fixe) */
.frame{width:100%;display:flex;justify-content:center}
/* format iPhone 17 : 402 × 874 pt, réduit à l'échelle si la fenêtre est plus petite */
.frame:has(> .stage[data-vp="mobile"]){width:402px;height:874px;flex:none;transform-origin:top center;transform:scale(var(--vps,1));
  overflow:hidden;box-shadow:var(--shadow-lg),0 0 0 9px #0d0a07,0 0 0 11px #2a2118;border-radius:38px}
.frame:has(> .stage[data-vp="mobile"]) .sheet-bg{align-items:flex-end;padding:0}
.frame:has(> .stage[data-vp="mobile"]) .sheet{width:100%;max-height:88%;border-radius:22px 22px 0 0}
.frame:has(> .stage[data-vp="mobile"]) .toast{bottom:18px;max-width:calc(100% - 28px)}
.screen{display:none}
.screen.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.inner{max-width:1180px;margin:0 auto}

/* ══════════ Annotations (masquées par défaut) ══════════ */
.node{display:inline-flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:#7a5f1f;border:1px dashed #cdb070;background:#fffaf0;padding:5px 8px;border-radius:4px;white-space:nowrap;letter-spacing:.06em}
.note{border-left:2px dashed #cdb070;padding:3px 0 3px 10px;font-family:'Inter',sans-serif;font-size:11.5px;line-height:1.5;color:#7a6a50;margin:12px 0;background:#fffaf0;letter-spacing:0}
.oob{display:flex;align-items:flex-start;gap:12px;padding:12px 26px;font-family:'Inter',sans-serif;font-size:11.5px;line-height:1.55;color:#7a6a50;border-bottom:1px dashed #cdb070;background:#fffaf0;letter-spacing:0}
.oob b{display:block;color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
body:not(.ann) .node,body:not(.ann) .note,body:not(.ann) .oob{display:none!important}

/* ══════════ Primitives ══════════ */
.ph{background:linear-gradient(135deg,var(--sand),var(--gold-soft));border:1px dashed var(--line-2);border-radius:12px;
  display:grid;place-items:center;color:var(--g500);font-size:11px;letter-spacing:.12em;text-transform:uppercase;overflow:hidden}
.ph.img{background-size:cover;background-position:center;border:0;color:transparent;font-size:0}
.card{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;
  border-radius:999px;padding:14px 24px;font-size:12px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;line-height:1;white-space:nowrap;transition:.18s}
.btn:hover{background:var(--gold-dark)}
.btn[disabled]{background:var(--g200);color:var(--g500)}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sec:hover{background:var(--ink);color:#fff}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold-dark)}
.btn.ghost[disabled],.btn.sec[disabled]{background:transparent;color:var(--g400);box-shadow:inset 0 0 0 1px var(--g200)}
.btn.gold{background:var(--gold);color:#fff}
.btn.gold:hover{background:var(--gold-dark)}
.btn.sm{padding:10px 16px;font-size:10.5px;letter-spacing:1.3px}
.btn.full{width:100%}
.lnk{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px;color:var(--ink);font-size:13px}
.lnk:hover{color:var(--gold-dark)}
.lnk:disabled{color:var(--g400);text-decoration:none}
.h1{font-size:36px;font-weight:300;letter-spacing:.3px;line-height:1.12;text-wrap:balance}
.h1 b{font-weight:500}
.h2{font-size:19px;font-weight:500;letter-spacing:.2px;line-height:1.25}
.h3{font-size:14.5px;font-weight:500;letter-spacing:.2px}
.sub{font-size:14px;color:var(--ink-soft);line-height:1.6;font-weight:300}
.mut{font-size:12.5px;color:var(--g600);line-height:1.5;font-weight:300}
.eyebrow{display:block;font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-dark);font-weight:500;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;
  background:var(--sand);color:var(--g700);border-radius:999px;padding:5px 10px;white-space:nowrap}
.tag.dk{background:var(--ink);color:#fff}
.tag.ol{background:var(--gold-light);color:var(--gold-dark)}
.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:10.5px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--g600);margin-bottom:7px}
.field input,.field select,.field textarea,.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;background:var(--paper);outline:none;transition:.15s}
.field input:focus,.field select:focus,.inp:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.hr{height:1px;background:var(--line);margin:18px 0}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.chkbox{display:flex;align-items:flex-start;gap:11px;font-size:13px;line-height:1.55;color:var(--g700);cursor:pointer}
.chkbox input{accent-color:var(--gold);width:17px;height:17px;margin-top:2px;flex:none}

/* ══════════ En-tête ══════════ */
.appbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.appbar-in{display:flex;align-items:center;gap:18px;padding:12px 32px;max-width:1280px;margin:0 auto}
.wordmark{display:flex;align-items:center;gap:14px;line-height:1.15}
.wordmark img{height:40px;display:block}
.wordmark .wm-l{display:block;border-radius:8px;transition:opacity .15s}
.wordmark .wm-l:hover{opacity:.62}
.wordmark .wm-t{white-space:nowrap;border-left:1px solid var(--line-2);padding-left:14px;font-size:11px;font-weight:500;letter-spacing:2.6px;text-transform:uppercase;text-align:left;transition:color .15s}
.wordmark .wm-t:hover{color:var(--gold-dark)}
.wordmark .wm-t small{display:block;font-size:8.5px;letter-spacing:3px;color:var(--gold-dark);margin-top:3px}
.ico{height:40px;min-width:40px;border:1px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;color:var(--ink);padding:0 14px;font-size:11px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;white-space:nowrap;background:#fff;transition:.15s}
.ico:hover{border-color:var(--gold);color:var(--gold-dark)}
.ico .av{width:26px;height:26px;font-size:10px;margin-left:-8px}
.ico.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.ico.gold:hover{background:var(--gold-dark);border-color:var(--gold-dark);color:#fff}
.ico.gold .av{background:rgba(255,255,255,.22);color:#fff}
/* sélecteur de langue : illustratif dans le proto */
.langwrap{position:relative}
.langbtn .lg{font-size:11px;font-weight:500;letter-spacing:1.4px}
.langpop{position:absolute;top:calc(100% + 8px);right:0;width:186px;background:#fff;border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow-lg);padding:6px;z-index:40;animation:fade .2s ease}
.langpop::before{content:"";position:absolute;top:-7px;right:18px;width:12px;height:12px;background:#fff;
  border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.langpop button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:9px 12px;
  border-radius:11px;font-size:13.5px;text-align:left;color:var(--ink);transition:.15s}
.langpop button:hover{background:var(--gold-soft)}
.langpop button i{font-style:normal;font-size:10px;font-weight:500;letter-spacing:1.4px;color:var(--g400)}
.langpop button.on{background:var(--ink);color:var(--gold-light)}
.langpop button.on i{color:var(--gold-light)}
.cartbtn{position:relative;padding:0 12px}
.cartbtn b{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--gold);
  color:#fff;font-size:10.5px;font-weight:500;display:none;place-items:center;padding:0 5px;letter-spacing:0;border:2px solid #fff}
.cartbtn.has b{display:grid}
.av{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--gold-light);display:inline-grid;place-items:center;
  font-size:12px;font-weight:500;flex:none;letter-spacing:1px}
.av.lt{background:var(--sand);color:var(--g700)}

/* bloc liste d'attente green fee */
.wl{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:12px;padding:15px 18px;
  border:1px dashed var(--line-2);border-radius:14px;background:var(--gold-soft)}
.wl > div:first-child{flex:1;min-width:220px}
.wl b{display:block;font-size:14px;margin-bottom:2px}
.wl .mut{font-size:12.5px;line-height:1.5}
.card.wlc{padding:4px 18px 18px;margin-bottom:22px}
.card.wlc .wl{border:0;background:transparent;padding:14px 0 0}

/* ══════════ Navigation du moteur (4 portes) ══════════ */
.enav{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(255,255,255,.96)}
.enav-in{display:flex;gap:6px;padding:0 24px;max-width:1280px;margin:0 auto;overflow-x:auto}
.enav-in::-webkit-scrollbar{height:0}
.enav button{position:relative;display:flex;align-items:center;gap:9px;padding:17px 16px;font-size:15px;font-weight:500;letter-spacing:.1px;
  color:var(--g600);white-space:nowrap;transition:color .15s}
.enav button::after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:2px;border-radius:2px;background:var(--ink);transform:scaleX(0);transition:transform .2s}
.enav .en-ic{display:grid;place-items:center;color:var(--g500);transition:color .15s}
.enav button:hover{color:var(--ink)}
.enav button:hover .en-ic{color:var(--gold-dark)}
.enav button.on{color:var(--ink);font-weight:600}
.enav button.on::after{transform:scaleX(1)}
.enav button.on .en-ic{color:var(--gold-dark)}

/* ══════════ Site vitrine resonance.golf (hors périmètre du moteur) ══════════ */
.stage[data-scr="site"] .appbar,.stage[data-scr="site"] .enav,.stage[data-scr="site"] .appfoot{display:none}
.rsn{--rg:#D6A745;--rink:#18110D;background:#fff;color:var(--rink)}
.rsn-top{display:flex;align-items:center;gap:16px;background:var(--rink);color:#fff;height:36px;padding:0 24px;font-size:11.5px}
.rsn-top .sp{flex:1}
.rsn-top span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.rsn-acc{background:rgba(255,255,255,.1);padding:7px 14px}
.rsn-head{text-align:center;padding:18px 24px 0}
.rsn-head img{height:56px}
.rsn-nav{display:flex;align-items:center;gap:26px;padding:16px 24px;border-bottom:1px solid #EDEAE4;flex-wrap:wrap}
.rsn-nav span{font-size:11.5px;font-weight:500;letter-spacing:.9px;text-transform:uppercase;white-space:nowrap}
.rsn-cta{margin-left:auto;display:inline-flex;align-items:center;gap:9px;background:var(--rg);color:var(--rink);
  padding:14px 20px;font-size:11.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;white-space:nowrap;transition:.15s}
.rsn-cta:hover{background:#C99A38}
.rsn-book{position:relative;margin-left:auto}
.rsn-book .rsn-cta{margin-left:0}
.rsn-chev{transition:transform .2s}
.rsn-cta[aria-expanded="true"] .rsn-chev{transform:rotate(180deg)}
.rsn-dd{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:290px;background:#fff;border:1px solid #EDEAE4;box-shadow:0 18px 44px rgba(24,17,13,.18);padding:8px;
  display:flex;flex-direction:column;animation:rdd .16s ease-out}
@keyframes rdd{from{opacity:0;transform:translateY(-4px)}}
.rdd-h{padding:8px 10px 6px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:#8C8377}
.rsn-dd > button,.rdd-list button{display:flex;align-items:center;gap:12px;width:100%;padding:10px;text-align:left;font-size:14px;font-weight:500;color:var(--rink);transition:background .12s}
.rsn-dd > button:hover,.rdd-list button:hover{background:#F6F5F2}
.rsn-dd > button i{margin-left:auto;font-style:normal;color:#B3AA9C;font-size:18px}
.rdd-ic{display:grid;place-items:center;color:var(--rg)}
.rsn-dd2{width:340px}
.rdd-back{font-size:12px!important;font-weight:500;color:#6B6257!important;padding:6px 10px!important}
.rdd-list{max-height:320px;overflow-y:auto;display:flex;flex-direction:column}
.rdd-t{display:flex;flex-direction:column;min-width:0;flex:1}
.rdd-t small{font-size:11.5px;font-weight:300;color:#8C8377}
.rsn-nav .rsn-dd span{text-transform:none;letter-spacing:0;white-space:normal;font-size:inherit;font-weight:inherit}
.rsn-nav .rsn-dd .rdd-h{font-size:11px;letter-spacing:.9px;text-transform:uppercase;font-weight:500}
.rsn-nav .rsn-dd .tag{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.rsn-hero{position:relative;min-height:460px;display:grid;place-items:center;text-align:center;background:#1d1d1d center/cover;padding:70px 24px 120px}
.rsn-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 260px at 50% 55%,rgba(0,0,0,.42),transparent 70%),linear-gradient(180deg,rgba(0,0,0,.38),rgba(0,0,0,.14) 45%,rgba(0,0,0,.38))}
.rsn-hero h1{position:relative;color:#fff;font-weight:200;font-size:44px;line-height:1.28;letter-spacing:1.4px;max-width:720px;text-shadow:0 2px 20px rgba(0,0,0,.45)}
.rsn-search{display:flex;align-items:stretch;background:#fff;box-shadow:0 18px 48px rgba(24,17,13,.16);max-width:1000px;margin:-58px auto 0;position:relative;z-index:1}
.rs-l,.rs-m{padding:14px 18px}
.rs-l{border-right:1px solid #EDEAE4}
.rs-m{flex:1;background:#F6F5F2;display:flex;flex-direction:column;justify-content:center}
.rs-lbl{display:block;text-align:center;font-size:11.5px;color:#6B6257;margin-bottom:10px}
.rs-tiles{display:flex;gap:8px}
.rs-tile{width:76px;padding:9px 4px;border:1px solid #EDEAE4;text-align:center;font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:#8C8377;background:#fff}
.rs-tile.on{border-color:var(--rg);color:var(--rink)}
.rs-tile .dot{display:block;width:14px;height:14px;border-radius:50%;background:#E8E2D6;margin:0 auto 7px}
.rs-tile.on .dot{background:var(--rg)}
.rs-in{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #EDEAE4;padding:13px 14px;color:#B3AA9C;font-size:13.5px;font-style:italic}
.rs-go{background:var(--rg);color:var(--rink);padding:0 34px;font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;white-space:nowrap}
.rsn-p{max-width:660px;margin:0 auto;padding:44px 24px 54px;text-align:center;color:#5A5147;font-size:15px;line-height:1.7;font-weight:300}
.rsn-sel{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px 14px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
@container (max-width:900px){
  .rsn-hero{min-height:360px;padding:52px 20px 92px}
  .rsn-hero h1{font-size:34px}
  .rsn-search{flex-wrap:wrap;margin:-34px 16px 0}
  .rs-l{flex:1 1 100%;border-right:0;border-bottom:1px solid #EDEAE4}
  .rs-tiles{justify-content:center;flex-wrap:wrap}
  .rs-m{flex:1 1 58%}
  .rs-go{flex:1 1 30%;padding:16px}
}
@container (max-width:560px){
  .rsn-top{padding:0 14px;gap:10px;font-size:10.5px}
  .rsn-head img{height:46px}
  .rsn-nav{gap:14px;padding:12px 14px;justify-content:center}
  .rsn-nav span{font-size:10px;letter-spacing:.5px}
  .rsn-book{margin:8px 0 0;width:100%}
  .rsn-cta{width:100%;justify-content:center}
  .rsn-dd,.rsn-dd2{left:0;right:0;width:auto}
  .rsn-hero{min-height:300px;padding:40px 16px 80px}
  .rsn-hero h1{font-size:25px;letter-spacing:.5px}
  .rsn-hero::before{background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.3) 45%,rgba(0,0,0,.5))}
  .rsn-p{padding:30px 18px 38px;font-size:14px}
  .enav-in{gap:0;padding:0 8px}
  .enav button{flex:none;padding:13px 10px;font-size:13.5px;gap:7px}
  .enav button::after{left:10px;right:10px}
}

/* ══════════ Mise en page ══════════ */
.pad{padding:30px 32px 64px;max-width:1244px;margin:0 auto}
.back{font-size:11px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;color:var(--g600);margin-bottom:16px;display:inline-flex;gap:6px}
.back:hover{color:var(--gold-dark)}
.scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
.aside{position:sticky;top:88px}
.aside > .card{padding:22px!important;border-radius:20px}
.fil{display:flex;gap:0;flex-wrap:wrap;margin-bottom:22px;align-items:center}
.fil span{font-size:10.5px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;color:var(--g400);white-space:nowrap;display:flex;align-items:center}
.fil span + span::before{content:"";width:34px;height:1px;background:var(--line-2);margin:0 12px}
.fil span.on{color:var(--ink)}
.fil span.on::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:8px}
.fil span.done{color:var(--gold-dark)}
.sect{display:flex;align-items:center;gap:10px;font-size:10.5px;font-weight:500;letter-spacing:2.6px;text-transform:uppercase;color:var(--gold-dark);margin:30px 0 14px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}

/* bandeau de tarif : c'est la promesse du cadrage, il doit accrocher l'œil */
.pbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-radius:18px;padding:20px 24px;margin-bottom:22px;
  background:radial-gradient(520px 220px at 0% 0%,rgba(190,155,69,.34),transparent 70%),linear-gradient(135deg,#2A2118,#1B150F);
  border:1px solid rgba(190,155,69,.45);box-shadow:0 16px 38px rgba(34,28,21,.16);
  color:rgba(243,234,213,.88);font-size:13.5px;line-height:1.55;font-weight:300}
.pbar > div{flex:1;min-width:220px}
.pbar b{color:#fff;font-weight:500}
.pbar .btn{background:var(--gold);color:#fff}
.pbar .btn:hover{background:#fff;color:var(--ink)}
.pbar .lnk{color:#F3EAD5}
.pbar .pb-long b{display:block;font-size:16.5px;margin-bottom:2px}
.pb-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pb-chips span{font-size:10px;font-weight:500;letter-spacing:1.1px;text-transform:uppercase;color:var(--gold-light);
  background:rgba(243,234,213,.09);border:1px solid rgba(243,234,213,.2);border-radius:999px;padding:5px 10px}
.pbar > .pb-a{display:flex;flex-direction:column;align-items:stretch;gap:9px;flex:none;min-width:0}
.pbar > .pb-a .lnk{text-align:center}
.pbar.on{background:var(--gold-soft);color:var(--g700);border:1px solid var(--gold-light);box-shadow:none;padding:9px 16px 9px 10px;gap:12px;font-size:13px;border-radius:14px}
.pbar.on .av{width:30px;height:30px;font-size:11px}
.pbar.on .pb-long b{display:inline;font-size:13.5px;margin:0}
.pbar.on .pb-note{color:var(--g500)}
/* accueil green fee plus compact : faire apparaître le premier parcours sans défiler */
#v-gf .fil{margin-bottom:14px}
#v-gf .scr-head{margin-bottom:14px}
#v-gf .scr-head .eyebrow{margin-bottom:6px}
#v-gf .scr-head .h1{font-size:30px}
#v-gf .scr-head .sub{margin-top:4px!important}
#v-gf .pbar{margin-bottom:14px}
#v-gf .sbar{margin-bottom:12px;border-radius:18px}
#v-gf .sbf{padding:11px 18px;gap:12px}
#v-gf .sbi{width:38px;height:38px;border-radius:12px}
#v-gf button.sbf{border-radius:18px 0 0 18px}
#v-gf .daynav{margin-bottom:16px}
#v-gf .daystrip{padding-bottom:4px}
#v-gf .day{padding:7px 6px}
#v-gf .day .pp{margin-top:3px}
.pbar.on b{color:var(--ink)}
.pbar.on .lnk{color:var(--ink)}
.pbar.on .av{background:var(--gold);color:#fff}
.pb-short{display:none}
.pbar.lite{background:var(--cream);border:1px solid var(--line);box-shadow:none;color:var(--g700);padding:9px 14px 9px 18px;gap:14px;font-size:13px;border-radius:14px}
.pbar.lite b{color:var(--ink)}
.pbar.lite .pb-long b{display:inline;font-size:13.5px;margin:0}
.pbar.lite .pb-st{display:block;margin-top:2px;font-size:12px;color:var(--g500);cursor:default;user-select:text}
.pbar.lite .pb-st i{font-style:normal;margin:0 7px;color:var(--g400)}
.pbar.lite > .pb-a{flex-direction:row;align-items:center;gap:14px}
.pbar.lite .btn{background:var(--ink);color:#fff}
.pbar.lite .btn:hover{background:var(--gold)}
.pbar.lite .lnk{color:var(--ink)}

/* prix */
.price{font-size:24px;font-weight:400;letter-spacing:-.2px;text-align:right;white-space:nowrap;line-height:1.15}
.price small{display:block;font-size:10px;font-weight:400;color:var(--g500);letter-spacing:1.2px;text-transform:uppercase;margin-top:4px}
.was{text-decoration:line-through;text-decoration-color:var(--terra);color:var(--g500);font-weight:300;font-size:.66em;margin-right:7px;letter-spacing:0}
.stl{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;background:var(--gold-light);color:var(--gold-dark);
  border-radius:999px;padding:4px 9px;margin-top:6px;white-space:nowrap}
.stl::before{content:"✦";font-size:9px}

/* héros du portail */
.hero{position:relative;min-height:540px;display:flex;align-items:flex-end;color:#fff;background:#1B150F center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,15,10,.62) 0%,rgba(20,15,10,.25) 55%,rgba(20,15,10,0) 80%),linear-gradient(180deg,rgba(20,15,10,.3) 0%,rgba(20,15,10,.15) 35%,rgba(20,15,10,.85) 100%)}
.hero-in{position:relative;width:100%;max-width:1244px;margin:0 auto;padding:60px 32px 110px}
.hero .eyebrow{color:#F6E7C1;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.hero h1{font-size:54px;font-weight:300;letter-spacing:.5px;line-height:1.05;max-width:720px;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.hero h1 b{font-weight:500}
.hero p{font-size:16px;font-weight:400;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.6);max-width:560px;margin-top:14px;line-height:1.6}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.badges span{border:1px solid rgba(243,234,213,.4);border-radius:999px;padding:7px 14px;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;backdrop-filter:blur(6px);background:rgba(20,15,10,.45);color:#fff}
.quick{position:relative;margin:-64px auto 0;max-width:1180px;padding:0 32px;z-index:2}
.quick .card{display:grid;grid-template-columns:repeat(3,1fr);padding:8px;border-radius:22px;box-shadow:var(--shadow-lg)}
.quick button{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;text-align:left;transition:.15s}
.quick button:hover{background:var(--gold-soft)}
.quick button + button{box-shadow:-1px 0 0 var(--line)}
.quick .qi{width:44px;height:44px;border-radius:14px;background:var(--gold-light);color:var(--gold-dark);display:grid;place-items:center;flex:none}
.quick b{display:block;font-size:15px}
.quick small{display:block;font-size:12px;color:var(--g600);font-weight:300;margin-top:2px}
.quick .go{margin-left:auto;color:var(--gold)}

/* portes */
.door{padding:0;display:flex;flex-direction:column;text-align:left;cursor:pointer;overflow:hidden;transition:.2s}
.door:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(34,28,21,.12);border-color:var(--gold-light)}
.door .ph{height:230px;border-radius:0;margin:0}
.door > :not(.ph){margin-left:22px;margin-right:22px}
.door > .tag{margin-top:-16px;position:relative;align-self:flex-start;background:#fff;box-shadow:var(--shadow)}
.door > b{margin-top:12px;font-size:24px;font-weight:300}
.door > .sub{margin-top:6px}
.door .foot{margin-top:auto;padding:18px 0 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px solid var(--line);margin-top:18px}
.door .foot .price{font-size:20px}
.door > .tag,.pack > .tag,.xsell > .tag{align-self:flex-start}
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:0;align-items:stretch;border-radius:22px;overflow:hidden;background:var(--ink);color:#F3EAD5;margin-top:48px}
.split .ph{border-radius:0;min-height:320px}
.split > div:last-child{padding:40px}
.split .h1{color:#fff;font-size:32px}
.split .sub{color:rgba(243,234,213,.75)}
.split ul{margin:18px 0 24px;display:grid;gap:10px}
.split li{display:flex;gap:10px;font-size:14px;font-weight:300}
.split li::before{content:"✦";color:var(--gold)}

/* recherche golf */
.searchbar{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:0;padding:8px;margin-bottom:16px;border-radius:20px}
.sb-f{padding:8px 16px}
.sb-f + .sb-f{box-shadow:-1px 0 0 var(--line)}
.sb-f > span{display:block;font-size:10px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold-dark);margin-bottom:6px}
.sb-f select,.sb-f input{width:100%;height:40px;border:0;border-radius:10px;padding:0 8px;background:var(--cream);font-size:14px}
.navd{display:grid;place-items:center;padding:0;text-align:center;width:36px;height:40px;border:1px solid var(--line);border-radius:10px;font-size:16px;color:var(--ink);flex:none;background:#fff}
.navd:hover:not(:disabled){border-color:var(--gold);color:var(--gold-dark)}
.navd:disabled{color:var(--g300)}
.qty{display:inline-flex;align-items:center;gap:12px;height:40px}
.qty button{display:grid;place-items:center;padding:0;width:34px;height:34px;border:1px solid var(--line-2);border-radius:50%;font-size:15px;line-height:1;background:#fff;transition:.15s}
.qty button:hover:not(:disabled){border-color:var(--gold);color:var(--gold-dark)}
.qty button:disabled{color:var(--g300);border-color:var(--g200)}
.qty b{min-width:16px;text-align:center;font-size:16px}
.qty.sm{height:32px;gap:9px}
.qty.sm button{width:30px;height:30px}
.daystrip{display:flex;gap:8px;overflow-x:auto;margin:4px 0 22px;padding:2px 2px 6px}
.daystrip::-webkit-scrollbar{height:0}
.day{min-width:86px;flex:1;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;background:var(--paper);transition:.15s}
.day:hover{border-color:var(--gold)}
.day.on{background:var(--ink);border-color:var(--ink);color:#fff}
.day.on .mut{color:#c9bfae}
.day .dd{font-size:13px;font-weight:500;text-transform:capitalize}
.day .pp{font-size:12px;font-weight:500;margin-top:6px;color:var(--gold-dark)}
.day.on .pp{color:var(--gold-light)}
.day.full .pp{color:var(--g400);font-weight:300}
.crs{padding:0;margin-bottom:16px;overflow:hidden}
.crs.off{background:var(--paper)}
.crs.off .crs-img{filter:grayscale(.8);opacity:.6}
.crs-h{display:flex;gap:20px;align-items:stretch;padding:0}
.crs-img{width:210px;flex:none;background:var(--sand) center/cover;min-height:150px}
.crs-t{flex:1;min-width:0;padding:20px 0}
.crs-h .price{padding:20px 22px 0 0}
.crs-img{position:relative}
.crs-holes{position:absolute;left:12px;top:12px;display:flex;align-items:baseline;gap:5px;padding:6px 11px;border-radius:10px;background:rgba(27,21,15,.82);color:#fff;
  font-size:10.5px;font-weight:500;letter-spacing:1.3px;text-transform:uppercase;backdrop-filter:blur(4px)}
.crs-holes b{font-size:20px;font-weight:600;letter-spacing:0}
.crs-hn{font-size:15px;font-weight:400;color:var(--g600);letter-spacing:0;white-space:nowrap}
.crs > :not(.crs-h){margin:0 22px 20px}
.crs .gtimes{margin-top:0;padding-top:16px;border-top:1px solid var(--line)}
.crs > .wl,.crs > .alert{margin-top:18px}
.gtimes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.gtime[hidden]{display:none!important}
.gtime{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;min-width:74px;background:var(--paper);transition:.15s}
.gtime:hover{border-color:var(--gold);background:var(--gold-soft)}
.gtime b{display:block;font-size:15px;font-weight:500}
.gtime i{display:block;font-style:normal;font-size:10px;letter-spacing:.5px;color:var(--g500);margin-top:1px}
.gtime.more{color:var(--gold-dark);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:500}

/* bandeau d'écran avec photo */
.band{position:relative;border-radius:22px;overflow:hidden;min-height:190px;display:flex;align-items:flex-end;color:#fff;margin-bottom:24px;background:#1B150F center/cover}
.band::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(27,21,15,.85),rgba(27,21,15,.25))}
.band > div{position:relative;padding:26px 30px}
.band .eyebrow{color:var(--gold-light)}
.band .h1{color:#fff}
.band .sub{color:#EDE5D6}

/* joueurs */
.prow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .pb{flex:1;min-width:0}
.prow .pb b{display:block;font-size:15px}
.prow .pp{text-align:right;font-weight:500;white-space:nowrap;font-size:17px}
.prow.warn .av{background:var(--terra-soft);color:var(--terra)}
.optrow{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.optrow:first-child{border-top:0}
.optrow > div:first-child{flex:1;min-width:0}
.disc{margin:8px 0 2px;padding:10px 12px;background:var(--cream);border-radius:12px}
.disc .sbl{display:block;margin-bottom:4px}
.dsc{padding:7px 0;border-top:1px solid var(--line)}
.disc .sbl + .dsc{border-top:0}
.dsc-h{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:300;color:var(--g700)}
.dsc-h b{font-weight:500;color:var(--ink);white-space:nowrap}
.dsc ul{margin-top:3px;display:grid;gap:1px}
.dsc li{font-size:11.5px;color:var(--g600);font-weight:300;line-height:1.45;padding-left:10px;position:relative;display:flex;justify-content:space-between;gap:10px}
.dsc li small{font-size:11px;color:var(--g500)}
.dsc li > b{font-weight:500;color:var(--g700);white-space:nowrap}
.dsc.new{margin:4px -8px;padding:9px 8px;border:1px solid var(--gold);border-radius:10px;background:var(--paper)}
.dsc.new + .dsc{border-top:0}
.dsc-new{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold-dark);margin-bottom:4px}
.lic-gain .lg-h{display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid rgba(0,0,0,.08);font-weight:500;color:var(--ink)}
.lic-gain .lg-h b{font-size:16px}
.lic-gain .lg-l{list-style:none;margin:6px 0;padding:0;display:grid;gap:4px}
.lic-gain .lg-l li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.lic-gain .lg-l i{font-style:normal;color:var(--g600)}
.lic-gain .lg-l small{color:var(--g600)}
.lic-gain .lg-l b{white-space:nowrap}
.lic-gain .lg-t{display:block;font-size:12.5px;margin-top:4px}
.dsc li::before{content:"";position:absolute;left:0;top:.62em;width:4px;height:1px;background:var(--g500)}
.dsc-t{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line-2);margin-top:4px;padding-top:8px;font-size:13px}
.dsc-t b{font-weight:500}
.plink{padding:20px;margin-bottom:18px;border-color:var(--gold-light)}
.pl-l{display:grid;border-top:1px solid var(--line)}
.pl-l li{display:grid;grid-template-columns:minmax(0,1fr) auto 76px;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:300}
.pl-l b{font-weight:500}
.pl-l em{font-style:normal;font-size:11px;text-align:right;color:var(--terra)}
.pl-l em.ok{color:var(--g500)}
.steps{display:grid;gap:2px}
.dws{margin:16px 0 4px}
.dws-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.dws-h .lnk{font-size:12.5px}
.dws-c{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px}
.dws-i{width:64px;height:64px;border-radius:10px;flex:none;background:var(--sand) center/cover}
.dws-c > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.dws-c .tag{align-self:flex-start;font-size:9px;padding:3px 8px}
.dws-c b{font-size:13.5px;font-weight:500;line-height:1.3}
.dws-c .mut{font-size:12.5px}
.dws-c .btn{flex:none}
.hdl{padding:0;overflow:hidden;margin-bottom:22px;border-color:var(--gold-light)}
.hdl-h{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:26px 20px 18px;background:center/cover;color:#fff;min-height:140px}
.hdl-h::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,12,.15),rgba(20,16,12,.72))}
.hdl-h > *{position:relative}
.hdl-h .eyebrow{color:var(--gold-light)}
.hdl-h b{display:block;margin:4px 0;color:#fff;font-weight:300}
.hdl-h span:last-child{font-size:12.5px;opacity:.9;font-weight:300}
.hdl-h .lnk{color:#fff;text-decoration-color:#fff;font-size:12px}
.hdl-c{padding:16px 20px;border-top:1px solid var(--line)}
.hdl-c:first-of-type{border-top:0}
.hdl-l{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px 12px 12px;margin-bottom:22px;text-align:left}
.hdl-l .hdl-i{width:64px;height:48px;border-radius:10px;flex:none;background:center/cover}
.hdl-l > span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hdl-l > .lnk{flex:none;font-size:12.5px}
.perk-ck{margin:2px 0 4px;font-size:12.5px;color:var(--ink)}
.perk{margin-top:5px;font-size:12px;line-height:1.45;color:var(--gold-dark);font-weight:400}
.clubcfg{display:grid;gap:8px;margin:-4px 0 14px;padding:10px 12px;background:var(--cream);border-radius:12px}
.cc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cc-row > .mut{min-width:56px;font-size:12.5px}
.sumline{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:6px 0;color:var(--g700);font-weight:300}
.sumline b{color:var(--ink);white-space:nowrap;font-weight:500}
.sumtot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--line);margin-top:12px;padding-top:14px}
.sumtot .h3{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--g600)}
.sumtot b{font-size:30px;font-weight:300;letter-spacing:-.3px}
.alert{display:flex;gap:14px;align-items:flex-start;border:1px solid #EBCDBB;background:var(--terra-soft);border-radius:16px;padding:15px 16px;margin:14px 0;font-size:13.5px;line-height:1.55;color:#6d3f25;font-weight:300}
.alert b{color:#4b2914;font-weight:500}
.alert .ic{width:28px;height:28px;border-radius:9px;background:var(--terra);color:#fff;display:grid;place-items:center;font-weight:500;font-size:13px;flex:none}
.alert.soft{border-color:#EAD9AD;background:#FBF3DF;color:#5C4A28}
.alert.soft b{color:var(--ink)}
.alert.soft .ic{background:var(--gold)}

/* onglets & puces */
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tabs button{padding:12px 4px;margin-right:18px;font-size:11px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:var(--g500);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.tabs button i{font-style:normal;font-size:10px;color:#fff;background:var(--gold);border-radius:10px;padding:1px 7px;margin-left:7px;letter-spacing:0}
/* onglet qui renvoie vers une autre porte du moteur */
.tabs .tab-go{display:inline-flex;align-items:center;gap:6px;color:var(--gold-dark)}
.tabs .tab-go:hover{color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font-size:12.5px;color:var(--ink);background:var(--paper);transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:disabled{color:var(--g400)}

/* compétitions */
.comp{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:22px;padding:22px;margin-bottom:16px;align-items:start;transition:.15s}
.comp:hover{border-color:var(--gold-light)}
.cdate{background:var(--ink);color:#fff;border-radius:14px;text-align:center;padding:12px 4px;line-height:1.1}
.cdate small{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:1.8px;color:var(--gold-light)}
.cdate b{display:block;font-size:32px;font-weight:300;margin:2px 0}
.res.past .cdate{background:var(--sand);color:var(--g600)}
.res.past .cdate small{color:var(--g500)}
.cond{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.bar{height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:14px;max-width:300px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-dark))}
.cside{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:170px}
.checks{display:grid;gap:0}
.ck{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line);font-size:14px}
.ck:first-child{border-top:0}
.ck .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;margin-top:0}
.ck.ok .ic{background:var(--green-soft);color:var(--green)}
.ck.ko .ic{background:var(--terra);color:#fff}
.ck.ko b{color:var(--terra)}
.ck > div{flex:1;min-width:0}
.ck small{display:block;color:var(--g600);font-size:12.5px;margin-top:2px;line-height:1.5;font-weight:300}
.radios{display:grid;gap:10px}
.radio{display:flex;gap:13px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;cursor:pointer;text-align:left;width:100%;background:var(--paper);transition:.15s}
.radio:hover{border-color:var(--gold)}
.radio.on{border-color:var(--gold);background:var(--gold-soft)}
.radio .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:none;position:relative;align-self:flex-start;margin-top:1px}
.radio.on .dot{border-color:var(--gold)}
.radio.on .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--gold)}
.radio > div{flex:1;min-width:0}
.radio small{display:block;color:var(--g600);font-size:12px;margin-top:3px;line-height:1.45;font-weight:300}
.radio.dis{opacity:.5;cursor:not-allowed}

/* cours */
.pro{display:flex;gap:14px;align-items:center}
.pro .ph{width:56px;height:56px;border-radius:50%;flex:none;border:0;background:linear-gradient(135deg,var(--ink),#4a3c2c);color:var(--gold-light);font-size:15px;letter-spacing:1px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wcol h6{font-size:12px;font-weight:500;text-align:center;padding:9px 0;margin-bottom:10px;background:var(--sand);border-radius:12px;letter-spacing:.5px}
.wcol h6 small{display:block;font-weight:300;color:var(--g600);font-size:11px}
.pills{display:grid;gap:6px}
.pill{border:1px solid var(--line);border-radius:999px;padding:8px 0;font-size:13px;font-weight:400;text-align:center;background:var(--paper);width:100%;transition:.15s}
.pill:hover{border-color:var(--gold);background:var(--gold-soft)}
.pill.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.pill{border-radius:14px;padding:6px 0 5px;line-height:1.2;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pill small{display:block;font-size:9.5px;letter-spacing:.3px;color:var(--gold-dark);font-weight:400;margin-top:1px}
.pill.on small{color:#fff}
.wcol .none{font-size:11px;color:var(--g400);text-align:center;padding:8px 0}
.lesson{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:20px;padding:0;margin-bottom:14px;align-items:center;overflow:hidden}
.lesson::before{content:"";align-self:stretch;min-height:120px;background:var(--lesson-img,linear-gradient(135deg,var(--sand),var(--gold-soft))) center/cover}
.lesson > .cside{padding-right:22px}
.lesson > div:first-of-type{padding:18px 0}
.pack{padding:22px;display:flex;flex-direction:column;gap:8px}
.pack .foot{margin-top:auto;padding-top:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px solid var(--line)}

/* panier & maintien */
.hold{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1.5px solid var(--gold);background:#F8EBC8;border-radius:14px;
  padding:14px 18px;font-size:14px;color:var(--ink);margin-bottom:20px;line-height:1.5;font-weight:400;box-shadow:0 4px 16px rgba(190,155,69,.22)}
.hold::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(190,155,69,.25);flex:none;animation:pulse 1.6s infinite}
.hold .holdTimer{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:1px 10px;font-weight:600;letter-spacing:.5px}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(190,155,69,0)}}
.hold span:nth-child(2){flex:1;min-width:200px}
.hold b{color:var(--ink);font-weight:500}
.hold .holdTimer{font-variant-numeric:tabular-nums}
.hold.dead{border-color:var(--terra);background:#F6D9CB;color:#4b2914;box-shadow:0 4px 16px rgba(176,90,50,.22)}
.hold.dead::before{content:"!";width:26px;height:26px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;background:var(--terra);animation:none;box-shadow:none}
.hold.dead b{color:#4b2914;font-weight:600}
.mvp{align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.mvp:first-child{border-top:0}
.req{color:var(--terra);font-weight:600;margin-left:2px}
.field.bad input{border-color:var(--terra)}
.ferr{display:block;color:var(--terra);font-size:12px;margin-top:6px}
.pwr{list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 0;padding:0;font-size:12px;color:var(--g500)}
.pwr li::before{content:'○';margin-right:5px}
.pwr li.ok{color:var(--green)}
.pwr li.ok::before{content:'✓'}
.ktip{display:flex;flex-direction:column;gap:4px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--gold-soft);font-size:12.5px;line-height:1.5;color:var(--g700)}
.ktip b{color:var(--ink);font-weight:500;font-size:13px}
.lic-soon .ic{background:var(--terra-soft);color:var(--terra)}
.infos .col{display:flex;flex-direction:column;gap:16px;min-width:0}
.kv{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv b{font-weight:500;overflow-wrap:anywhere}
.vis{display:flex;flex-direction:column;gap:10px;background:var(--cream);border-radius:12px;padding:12px 14px}
.vis-r{display:flex;gap:11px;align-items:flex-start;font-size:13.5px}
.vis-r small{display:block;color:var(--g600);font-size:12.5px;margin-top:1px}
.vis-r .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--line);color:var(--g600)}
.vis-r .ic.ok{background:var(--green);color:#fff}
.wrow{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wrow .btn{flex:none}
@media (max-width:640px){.wrow{flex-wrap:wrap}.wrow > .tag{order:0}.wrow .btn{width:100%}}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:20px 0;border-top:1px solid var(--line)}
.cline:first-child{border-top:0;padding-top:6px}
.cline .cl-p{text-align:right;display:flex;align-items:flex-start;gap:10px}
.delx{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--g500);border:1px solid transparent;transition:.15s}
.delx:hover{color:var(--terra);background:var(--terra-soft);border-color:#EBCDBB}
.dwl .delx{margin:-3px -6px 0 -4px}
.cline .delx{margin-top:4px}
.cline ul{margin-top:10px;display:grid;gap:4px;background:var(--cream);border-radius:12px;padding:10px 12px}
.cline li{display:flex;justify-content:space-between;gap:14px;font-size:12.5px;color:var(--g600);font-weight:300}
.cline li b{font-weight:500;color:var(--ink);white-space:nowrap}
.xsell{padding:0 0 18px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.xsell > :not(.ph){margin-left:18px;margin-right:18px}
.xsell .ph{height:150px!important;margin:0 0 10px!important;border-radius:0!important}
.xsell .foot{margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.done-t{font-size:10.5px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;color:var(--green)}
.codebox{display:flex;gap:8px}
.codebox input{flex:1;min-width:0;height:44px;border:1.5px solid var(--line);border-radius:999px;padding:0 16px;text-transform:uppercase;outline:none}
.codebox input:focus{border-color:var(--gold)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;padding:12px 0}
.sw i{width:42px;height:24px;border-radius:12px;background:var(--line);flex:none;position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on i{background:var(--gold)}
.sw.on i::after{transform:translateX(18px)}
.qr{width:92px;height:92px;flex:none;border-radius:12px;padding:8px;background:#fff;border:1px solid var(--line);position:relative;
  background-image:repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%);background-size:12px 12px;background-origin:content-box;background-clip:content-box}
.qr::after{content:"";position:absolute;inset:36%;background:#fff url(favicon.png) center/70% no-repeat;border-radius:4px}
.qr.lg{width:200px;height:200px;background-size:18px 18px;padding:14px}

/* espace perso */
.mcard{border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px;min-height:230px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(420px 260px at 100% 0%,rgba(190,155,69,.55),transparent 65%),linear-gradient(135deg,#2A2118,#120e0a);box-shadow:var(--shadow-lg)}
.mcard::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(243,234,213,.14)}
.mcard .mut{color:#c7bba8}
.mcard .tag{background:rgba(243,234,213,.12);color:var(--gold-light)}
.ttable{width:100%;border-collapse:collapse;font-size:14px}
.ttable th{font-size:10px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold-dark);text-align:left;padding:12px;border-bottom:1px solid var(--line)}
.ttable td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-weight:300}
.ttable tr:last-child td{border-bottom:0}
.ttable td.r,.ttable th.r{text-align:right;white-space:nowrap}
.ttable td b{font-weight:500}
.res{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:18px;padding:18px 20px;margin-bottom:12px;align-items:start}
.res.past{background:var(--cream);box-shadow:none}
.res .acts{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.prog{display:flex;gap:5px;margin-top:10px}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--gold)}
.hello{display:flex;align-items:center;gap:16px}
.logout{flex:none;align-self:center}
.logout:hover{box-shadow:inset 0 0 0 1px var(--terra)!important;color:var(--terra)!important}

/* feuille modale & toast */
.sheet-bg{position:fixed;inset:0;background:rgba(27,21,15,.5);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center;padding:18px}
.sheet-bg.on{display:flex}
.sheet::-webkit-scrollbar{width:0}
.sheet{background:var(--paper);border-radius:24px;width:min(540px,100%);max-height:calc(100vh - 40px);overflow-y:auto;padding:28px 28px 24px;box-shadow:var(--shadow-lg);animation:fade .25s ease}
.sheet .h2{font-size:24px;font-weight:300}
.sheet .x{display:grid;place-items:center;padding:0;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);font-size:14px;color:var(--g600);flex:none}
.sheet .x:hover{border-color:var(--gold);color:var(--gold-dark)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#F3EAD5;border-radius:999px;
  padding:12px 22px;font-size:13.5px;z-index:300;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px);box-shadow:var(--shadow-lg);font-weight:300}
.toast b{color:var(--gold)}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ══════════ Tiroir panier (cart drawer) ══════════
   Il s'ouvre tout seul au premier ajout, avec la ligne ajoutée, le total en
   cours et les deux sorties. Aux ajouts suivants, on se contente du toast et
   du rappel permanent (icône en haut à droite, bandeau fixe en mobile) pour
   ne pas couper le parcours à chaque clic. */
.dw-bg{position:fixed;inset:0;background:rgba(27,21,15,.42);backdrop-filter:blur(2px);z-index:240;opacity:0;pointer-events:none;transition:opacity .25s}
.dw-bg.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:250;background:var(--cream);display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);transform:translateX(102%);visibility:hidden;transition:transform .32s cubic-bezier(.22,.7,.25,1),visibility .32s}
.drawer.on{transform:none;visibility:visible}
.dw-h{flex:none;display:flex;align-items:center;gap:12px;padding:16px 20px;background:#fff;border-bottom:1px solid var(--line)}
.dw-h .h2{flex:1;font-size:21px;font-weight:300}
.dw-h .h2 b{font-weight:500}
.dw-h .x{display:grid;place-items:center;padding:0;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--g600);flex:none}
.dw-h .x:hover{border-color:var(--gold);color:var(--gold-dark)}
.dw-b{flex:1;overflow-y:auto;padding:18px 20px 22px}
.dw-b::-webkit-scrollbar{width:0}
.dw-b .hold{margin-bottom:16px;font-size:12.5px;padding:10px 14px;gap:10px}
.dw-b .hold span:nth-child(2){min-width:0}
.dw-b .hold .btn.sm{padding:8px 12px;font-size:9.5px}
.dw-f{flex:none;background:#fff;border-top:1px solid var(--line);padding:14px 20px 18px}
.dw-f .sumtot{margin-top:6px;padding-top:12px}
.dw-btn{display:grid;gap:8px;margin-top:14px}
.dw-f .dw-btn{grid-template-columns:1fr 1fr;margin-top:12px}
.dw-f .dw-btn .btn{padding:13px 8px;font-size:10.5px;letter-spacing:1.1px}
.dw-ok{display:flex;align-items:center;gap:12px;background:var(--gold-soft);border:1px solid var(--gold-light);border-radius:14px;padding:11px 14px;margin-bottom:16px}
.dw-ok i{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px;flex:none}
.dw-ok b{display:block;font-size:13.5px}
.dw-ok small{display:block;font-size:11.5px;color:var(--g600);font-weight:300;margin-top:1px}
.dwl{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.dwl:first-of-type{border-top:0;padding-top:0}
.dwl > div:first-child{flex:1;min-width:0}
.dwl b.h3{display:block;margin:7px 0 2px}
.dwl .mut{display:block}
.dwl .lnk{font-size:11.5px;margin-top:7px;display:inline-block}
.dwl-p{text-align:right;white-space:nowrap;font-size:16px;font-weight:400}
.dwl.new{background:#fff;border:1px solid var(--gold-light);border-radius:16px;padding:14px 16px;box-shadow:0 8px 22px rgba(34,28,21,.07)}
.dwl.new + .dwl{border-top:0;padding-top:16px}
.dw-sug{display:inline-block;margin-top:18px;font-size:12.5px}
.dw-empty{text-align:center;padding:26px 0}
.dw-empty .cp-ic{margin:0 auto 12px}

/* rappel permanent : icône panier chiffrée (desktop) */
.cartbtn.has{padding-right:15px;border-color:var(--gold-light);background:var(--gold-soft)}
.cartbtn .amt{font-size:11px;font-weight:500;letter-spacing:1.2px;white-space:nowrap}
.cartbtn:not(.has) .amt{display:none}
@keyframes cbump{30%{transform:scale(1.13)}62%{transform:scale(.97)}}
.bump{animation:cbump .5s ease}

/* rappel permanent : bandeau fixe en bas d'écran (mobile) */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:180;display:none;align-items:center;gap:12px;padding:11px 16px 13px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line-2);box-shadow:0 -6px 26px rgba(34,28,21,.13)}
.cartbar > div{flex:1;min-width:0;line-height:1.2}
.morehint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:170;display:none;padding:9px 16px;border-radius:999px;background:var(--ink);color:#fff;
  font-size:11px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;box-shadow:0 10px 24px rgba(34,28,21,.25)}
.morehint span{margin-left:4px}
.morehint.on{display:block;animation:mh 1.6s ease-in-out infinite}
body.cbar .morehint{bottom:84px}
@keyframes mh{50%{transform:translate(-50%,4px)}}
.cartbar b{display:block;font-size:17px;font-weight:500}
.cartbar small{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--g500);margin-top:3px}
.cartbar .btn{flex:none}
.frame:has(> .stage[data-vp="mobile"]) .cartbar.on{display:flex}
.frame:has(> .stage[data-vp="mobile"]) .drawer{width:100%}
body.cbar .frame:has(> .stage[data-vp="mobile"]) .appfoot{padding-bottom:88px}
@media (max-width:640px){
  .cartbar.on{display:flex}
  body.cbar .appfoot{padding-bottom:88px}
}

.appfoot{background:var(--ink);color:#bfb3a1;padding:40px 32px;font-size:12.5px;font-weight:300;margin-top:40px}
.appfoot .inner{display:flex;gap:28px;flex-wrap:wrap;align-items:center}
.appfoot img{height:34px;filter:brightness(0) invert(1);opacity:.85}
.appfoot span:first-of-type{margin-right:auto}
.mailok{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--gold-soft);color:var(--ink);font-size:13.5px;font-weight:300}
.mailok svg{flex:none;color:var(--gold-dark)}
.mailok b{font-weight:500}
.okmark{width:64px;height:64px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:28px;margin-bottom:14px}

/* bouton discret de présentation : bascule desktop / cadre mobile */
.vptog{position:fixed;left:14px;bottom:14px;z-index:400;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:rgba(34,28,21,.55);color:#F3EAD5;opacity:.28;transition:.2s;backdrop-filter:blur(6px)}
.vptog:hover,.vptog:focus-visible{opacity:1;background:var(--ink)}
.vptog .i-desk{display:none}
body.vp-mobile .vptog .i-desk{display:block}
body.vp-mobile .vptog .i-mob{display:none}

/* barre de recherche green fee : trois segments à icône, calendrier maison */
.sbar{display:grid;grid-template-columns:minmax(0,1.25fr) max-content minmax(0,1.3fr);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);margin-bottom:16px;position:relative}
.sbf{display:flex;gap:14px;align-items:center;padding:16px 20px;min-width:0;text-align:left}
.sbf + .sbf{border-left:1px solid var(--line)}
button.sbf{border-radius:22px 0 0 22px;transition:background .15s}
button.sbf:hover,button.sbf.open{background:var(--gold-soft)}
.sbi{width:44px;height:44px;border-radius:14px;background:var(--gold-light);color:var(--gold-dark);display:grid;place-items:center;flex:none}
.sbt{flex:1;min-width:0}
.sbl{display:block;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--g500);font-weight:500;margin-bottom:6px}
.sbv{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbv svg{color:var(--gold);transition:transform .2s}
button.sbf.open .sbv svg{transform:rotate(180deg)}
.pxs{display:flex;gap:6px}
.px{flex:none;display:grid;place-items:center;padding:0;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);font-size:14px;font-weight:500;background:#fff;transition:.15s}
.px:hover{border-color:var(--gold)}
.px,.seg2 button,.cd{text-align:center}
.px.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg2{display:inline-flex;background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:3px;max-width:100%}
.seg2 button{flex:none;padding:7px 12px;border-radius:999px;font-size:12.5px;color:var(--g700);white-space:nowrap;transition:.15s}
.seg2 button:hover{color:var(--ink)}
.seg2.hsel{display:flex;width:max-content;margin-top:10px}
.seg2 button.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 4px rgba(34,28,21,.14)}
.calpop{position:absolute;top:calc(100% + 10px);left:0;z-index:30;width:380px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);padding:18px;animation:fade .2s ease}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calh b{font-size:16px;font-weight:500;text-transform:capitalize}
.calnav{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);background:#fff}
.calnav:hover:not(:disabled){border-color:var(--gold);color:var(--gold-dark)}
.calnav:disabled{color:var(--g300)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calg .dw{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--g500);text-align:center;padding:4px 0 6px}
.cd{height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;gap:2px;transition:.12s}
.cd small{font-size:9px;color:var(--gold-dark);letter-spacing:.2px}
.cd:hover:not(:disabled){background:var(--gold-soft)}
.cd.on{background:var(--ink);color:#fff}
.cd.on small{color:var(--gold-light)}
.cd.full small{color:var(--g400)}
.cd:disabled{color:var(--g300)}
.calfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--g500)}
.daynav{display:flex;align-items:center;gap:8px;margin:0 0 22px}
.daynav .daystrip{margin:0;flex:1}
.daynav .calnav{flex:none}

/* réservation de groupe (5 à 12 joueurs) */
.alert.bigg{align-items:center;margin:-4px 0 20px}
.alert.bigg .btn{flex:none}
@media (max-width:640px){.alert.bigg{flex-wrap:wrap}.alert.bigg .btn{width:100%}}
.pxg{display:flex;align-items:center;height:36px;border:1.5px solid var(--line);border-radius:999px;background:#fff;flex:none;overflow:hidden}
.pxg .pxg-open{padding:0 13px;height:100%;font-size:12.5px;font-weight:500;white-space:nowrap}
.pxg .pxg-open:hover{color:var(--gold-dark)}
.pxg.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pxg.on button{display:grid;place-items:center;padding:0;width:30px;height:100%;font-size:16px;color:#F3EAD5;text-align:center}
.pxg.on button:disabled{opacity:.35}
.pxg.on b{min-width:22px;text-align:center;font-weight:500}
.gpanel{padding:20px 22px;margin-bottom:22px;border-color:var(--gold-light);background:linear-gradient(180deg,var(--gold-soft),#fff 60%)}
.gp-h{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.gp-count{font-size:26px;font-weight:300;color:var(--gold-dark);white-space:nowrap}
.gp-sec{margin-top:16px}
.flights{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:16px}
.flight{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line-2);border-radius:14px;padding:11px 12px;background:#fff;text-align:left;position:relative;transition:.15s}
.flight:hover{border-color:var(--gold)}
.flight.act{border-style:solid;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.flight.set{border-style:solid;border-color:var(--line)}
.flight.set.act{border-color:var(--gold)}
.fl-n{width:30px;height:30px;border-radius:50%;background:var(--sand);color:var(--g700);display:grid;place-items:center;font-size:13px;font-weight:500;flex:none}
.flight.set .fl-n,.fhead .fl-n{background:var(--ink);color:var(--gold-light)}
.flight.act:not(.set) .fl-n{background:var(--gold);color:#fff}
.fl-t{flex:1;min-width:0}
.fl-t small{display:block;white-space:nowrap;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--g500)}
.fl-t b{display:block;font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flight:not(.set) .fl-t b{font-weight:400;color:var(--g600)}
.flight.act:not(.set) .fl-t b{color:var(--gold-dark)}
.fl-x{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--g500);flex:none}
.fl-x:hover{background:var(--terra-soft);color:var(--terra)}
.sugg{display:flex;gap:8px;flex-wrap:wrap}
.sg{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 14px;background:#fff;font-size:13px;transition:.15s}
.sg:hover{border-color:var(--gold);background:var(--gold-soft)}
.sg span{color:var(--g600);font-weight:300}
.sg i{font-style:normal;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:999px;padding:5px 10px}
.gtime.on{background:var(--ink);border-color:var(--ink);color:#fff}
.gtime.on i{color:var(--gold-light)}
.gtime.nx{border-color:var(--gold);background:var(--gold-soft)}
.gtime.nx i{color:var(--gold-dark);font-weight:500}
.gbar{position:sticky;bottom:14px;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:10px;
  background:var(--ink);color:#fff;border-radius:18px;padding:14px 14px 14px 22px;box-shadow:var(--shadow-lg)}
.gbar b{display:block;font-weight:500}
.gbar .mut{color:#c7bba8;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar > div{min-width:0}
.gbar .btn{background:var(--gold)}
.gbar .btn[disabled]{background:#4a4038;color:#9a8f80}
.fhead{display:flex;align-items:center;gap:12px;margin:4px 0 10px}
.fhead b{display:block;font-size:14.5px}
.fhead .mut{display:block}

.addp{display:flex;align-items:center;gap:14px;width:100%;padding:13px 0;border-top:1px dashed var(--line-2);text-align:left;color:var(--gold-dark)}
.addp .av{border:1.5px dashed var(--gold);background:var(--gold-soft);color:var(--gold-dark);font-size:18px}
.addp b{display:block;font-size:14.5px}
.addp small{display:block;font-size:12px;color:var(--g600);font-weight:300;margin-top:1px}
.addp:hover b{text-decoration:underline;text-underline-offset:4px}
.addp-off{padding:12px 0;border-top:1px dashed var(--line-2)}
.rm{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--g500);flex:none;text-align:center}
.rm:hover{background:var(--terra-soft);color:var(--terra)}

/* choix du golf : liste par région + carte cliquable */
.sheet.wide{width:min(1100px,100%);padding:0;overflow:hidden}
.gs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);height:min(780px,calc(100vh - 40px))}
.gs-l{padding:26px 26px 0;display:flex;flex-direction:column;min-height:0}
.gs-q{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:999px;padding:0 16px;height:46px;color:var(--g500);background:#fff;flex:none}
.gs-q:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.gs-q input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;color:var(--ink)}
.gs-list{overflow-y:auto;flex:1;margin:0 -10px;padding:0 10px 22px}
.gs-list::-webkit-scrollbar{width:0}
.gs-row{display:flex;align-items:center;gap:13px;width:100%;padding:11px 12px;border-radius:14px;text-align:left;transition:background .15s}
.gs-row:hover,.gs-row.hov{background:var(--gold-soft)}
.gs-row.on{background:var(--ink);color:#fff}
.gs-row.on small{color:#c7bba8}
.gs-row.on .tag.ol{background:rgba(243,234,213,.14);color:var(--gold-light)}
.gs-pin{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--gold-light);flex:none}
.gs-row.on .gs-pin{box-shadow:0 0 0 3px rgba(190,155,69,.4)}
.gs-t{flex:1;min-width:0}
.gs-t b{display:block;font-size:14.5px}
.gs-t small{display:block;font-size:12px;color:var(--g600);font-weight:300;margin-top:2px}
.gs-r{background:#FDFCF6;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.gmap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 18px 6px}
.gmap{container-type:size}
/* la boîte garde exactement le ratio de la carte : les pastilles restent calées */
.gmap-in{position:relative;width:min(100cqw,calc(100cqh * 1870 / 2000));aspect-ratio:1870/2000}
.gmap-in img{width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;width:26px;height:26px;transform:translate(-50%,-50%);border-radius:50%;z-index:1}
.hs i{position:absolute;inset:6px;border-radius:50%;transition:.15s}
.hs:hover i,.hs.hov i{box-shadow:0 0 0 5px rgba(190,155,69,.35)}
.hs.on{z-index:2}
.hs.on i{background:var(--ink);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--gold)}
.hs.on::after{content:"";position:absolute;inset:2px;border-radius:50%;border:2px solid var(--gold);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(1.8);opacity:0}}
.hs.dim i{background:rgba(253,252,246,.85)}
.hs-tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11.5px;white-space:nowrap;
  border-radius:999px;padding:5px 11px;opacity:0;pointer-events:none;transition:.15s}
.hs:hover .hs-tip,.hs.hov .hs-tip{opacity:1}
.gs-sel{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 22px;border-top:1px solid var(--line);background:#fff;flex:none}
.gs-sel > div{min-width:0}
.gs-sel b{display:block;font-size:17px;font-weight:500}
.gs-sel .mut{display:block}
.frame:has(> .stage[data-vp="mobile"]) .sheet.wide .gs,
.sheet.wide .gs.narrow{grid-template-columns:1fr;height:auto;max-height:80vh}
.frame:has(> .stage[data-vp="mobile"]) .sheet.wide{height:88%;max-height:88%}
.frame:has(> .stage[data-vp="mobile"]) .sheet.wide .gs{height:100%;max-height:none}
.frame:has(> .stage[data-vp="mobile"]) .gs-r{border-left:0;border-top:1px solid var(--line)}
.frame:has(> .stage[data-vp="mobile"]) .gmap{display:none}
.frame:has(> .stage[data-vp="mobile"]) .gs-l{padding:22px 18px 0}
.frame:has(> .stage[data-vp="mobile"]) .gs-sel{padding:14px 18px}
@media (max-width:760px){
  .sheet.wide .gs{grid-template-columns:1fr;height:min(700px,calc(100vh - 40px))}
  .sheet.wide .gmap{display:none}
  .sheet.wide .gs-r{border-left:0;border-top:1px solid var(--line)}
}

/* mes proches */
.pcard{padding:18px;display:flex;flex-direction:column;gap:12px}
.pcard .pc-f{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.pcard.add{border:1.5px dashed var(--gold);background:var(--gold-soft);box-shadow:none;align-items:center;justify-content:center;text-align:center;min-height:210px;gap:8px;transition:.15s}
.pcard.add:hover{background:var(--gold-light)}

/* fenêtre « panier vide » sous l'icône */
.appbar-in{position:relative}
.cartpop{position:absolute;top:calc(100% + 8px);right:32px;width:340px;max-width:calc(100% - 24px);background:#fff;border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow-lg);padding:18px;z-index:40;animation:fade .2s ease}
.cartpop::before{content:"";position:absolute;top:-7px;right:16px;width:12px;height:12px;background:#fff;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.cp-h{display:flex;gap:14px;align-items:flex-start}
.cp-h b{display:block;font-size:16px}
.cp-h .mut{display:block;margin-top:3px}
.cp-ic{width:42px;height:42px;border-radius:14px;background:var(--gold-light);color:var(--gold-dark);display:grid;place-items:center;flex:none}
.cp-l{display:grid;gap:4px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.cp-l button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-size:14px;text-align:left;color:var(--ink);transition:.15s}
.cp-l button svg{color:var(--gold-dark)}
.cp-l button:hover{background:var(--gold-soft)}

.gp-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:16px}
.gp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-dark));transition:width .3s}
.gp-sel{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.gchip{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:6px 6px 6px 14px;font-size:13px}
.gchip small{color:var(--gold-light);font-size:11px;font-weight:300}
.gchip button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#c7bba8;padding:0}
.gchip button:hover{background:rgba(255,255,255,.12);color:#fff}

/* créneaux de cours en mobile : bandeau de jours + un jour à la fois */
.grid > *,.two > *{min-width:0}
.wkm{display:none}
.wkm-days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -2px}
.wkm-days::-webkit-scrollbar{height:0}
.wkm-d{flex:none;width:62px;border:1px solid var(--line);border-radius:14px;padding:8px 0;background:#fff;text-align:center;line-height:1.2}
.wkm-d small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--g500)}
.wkm-d b{display:block;font-size:18px;font-weight:500;margin:2px 0}
.wkm-d i{display:block;font-style:normal;font-size:9.5px;color:var(--gold-dark)}
.wkm-d.on{background:var(--ink);border-color:var(--ink);color:#fff}
.wkm-d.on small{color:#c7bba8}.wkm-d.on i{color:var(--gold-light)}
.wkm-d:disabled{opacity:.45}
.wkm-t{font-size:14px;font-weight:500;margin:14px 0 10px}
.wkm-pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* mes proches sur le parcours */
.proxbar{display:flex;align-items:center;gap:14px;margin:-4px 0 16px;padding:10px 12px 10px 18px;background:#fff;border:1px solid var(--line);border-radius:16px}
.proxbar .sw{flex:1;padding:0;gap:14px}
.proxbar .pb-t{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.proxbar .pb-t b{font-size:14px}
.proxbar.none{opacity:.7}
.proxbar.on{border-color:var(--gold);background:var(--gold-soft)}
.pb-av{display:flex}
.pb-av .gav{position:static;margin-left:-6px;width:26px;height:26px;font-size:9.5px;box-shadow:0 0 0 2px #fff}
.gav{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--gold-light);font-size:8.5px;font-weight:600;letter-spacing:.3px;flex:none}
.prox{padding:18px 20px;margin-bottom:22px;border-color:var(--gold-light)}
.prox-h{margin-bottom:6px}
.prox-h .mut{display:block;margin-top:4px}
.prox-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.prox-row:nth-child(2){border-top:0}
.pr-t{flex:1;min-width:0}
.pr-t b{display:block;font-size:14.5px}
.pr-a{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right;max-width:52%}
.gtime.pro{position:relative;border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);padding-top:11px}
.gtime.pro .gav{position:absolute;top:-9px;right:-7px;box-shadow:0 0 0 2px #fff}
.gtime.pro i{color:var(--ink);font-weight:500}
.gtime.pro.full{opacity:.55;cursor:not-allowed;box-shadow:none;border-style:dashed}
.gtime.pro.full i{color:var(--g500);font-weight:400}
.gtime.on.pro .gav{background:var(--gold);color:#fff}
.day{position:relative}
.ddot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #fff}
.day.on .ddot{box-shadow:0 0 0 2px var(--ink)}
.joinw{align-items:center}
.sharec{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 20px;margin-bottom:18px}
.sharec > div:first-child{flex:1;min-width:240px}
.sharec .mut{display:block;margin-top:3px}

/* recherche : 4e segment « Mes proches » (connecté) */
.sbar.sbar4{grid-template-columns:minmax(0,1.1fr) max-content minmax(0,1.2fr) auto}
.sbar.sbar4 .sbf{padding:16px 16px}
/* connecté : 4 segments ne tiennent plus sur une ligne sous ~1180 px → 2 × 2 */
@media (max-width:1180px) and (min-width:641px){
  .sbar.sbar4{grid-template-columns:minmax(0,1fr) max-content}
  .sbar.sbar4 .sbf:nth-child(n+3){border-top:1px solid var(--line)}
  .sbar.sbar4 .sbf:nth-child(3){border-left:0}
  .sbar.sbar4 button.sbf:first-child{border-radius:22px 0 0 0}
}
.sbf-prox .sbv b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:#fff;font-size:12px;padding:0 6px}
.sbf-prox .sw{gap:12px;justify-content:flex-start}
.sbf-prox .sw .sbv{flex:1}
/* inscrits sur un créneau */
.occ{display:flex;justify-content:center;margin-top:5px}
.oc{width:16px;height:16px;border-radius:50%;background:var(--ink);color:var(--gold-light);font-size:6.5px;font-weight:600;display:grid;place-items:center;margin-left:-4px;box-shadow:0 0 0 1.5px #fff;letter-spacing:0}
.oc:first-child{margin-left:0}
.oc.mask{background:var(--sand);color:var(--g500)}
.gtime.on .oc{box-shadow:0 0 0 1.5px var(--ink)}
.occ-list{background:#fff;border:1px dashed var(--line-2);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.occ-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.occ-list .sbl + .occ-row{border-top:0}
.occ-row .av{width:30px;height:30px;font-size:10px}
.occ-row .av.mask{background:var(--sand);color:var(--g500)}
.occ-row b{display:block;font-size:13.5px}
.occ-row .mut{display:block}
.occ-none{margin:0 0 12px}

/* ══════════ Mobile (conteneur) ══════════ */
@container (max-width:900px){
  .two{grid-template-columns:1fr}
  .aside{position:static}
  .g3{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(7,96px);overflow-x:auto;padding-bottom:4px}
  .quick .card{grid-template-columns:1fr}
  .sbar{grid-template-columns:1fr 1fr}
  .sbar .sbf:first-child{grid-column:1/-1;border-radius:22px 22px 0 0;border-bottom:1px solid var(--line)}
  .sbar .sbf:nth-child(2){border-left:0}
  .sbar.sbar4 .sbf-prox{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
  .sbar.sbar4{grid-template-columns:1fr 1fr}
  .quick button + button{box-shadow:0 -1px 0 var(--line)}
  .split{grid-template-columns:1fr}
}
@container (max-width:560px){
  .pad{padding:20px 18px 48px}
  .appbar-in{padding:10px 16px;gap:8px}
  .cartpop{right:12px}
  .wordmark img{height:30px}
  .wordmark .wm-t{display:none}
  .ico{padding:0 11px}
  .ico .lbl{display:none}
  /* sans libellé, les boutons de la barre redeviennent des ronds parfaits */
  .ico .av{margin:0;width:30px;height:30px;font-size:11px}
  #accBtn{width:40px;padding:0}
  .langbtn{padding:0 10px;gap:5px}
  .langbtn > svg:first-child{display:none}   /* le globe ne sert à rien à côté de « FR » */
  .langpop{width:172px}
  .g2{grid-template-columns:1fr}
  .h1{font-size:28px}
  .logout{width:42px;height:42px;padding:0!important;border-radius:50%;align-self:flex-start}
  .logout .lo-t{display:none}
  .hello .av{width:46px!important;height:46px!important;font-size:14px!important}
  .hello{gap:12px}
  .hero{min-height:520px}
  .hero::before{background:linear-gradient(180deg,rgba(20,15,10,.55) 0%,rgba(20,15,10,.5) 45%,rgba(20,15,10,.88) 100%)}
  .hero .eyebrow{letter-spacing:2px}
  .hero p{font-size:15px}
  .badges span{font-size:9.5px;padding:6px 11px}
  .hero-in{padding:40px 20px 96px}
  .hero h1{font-size:36px}
  .quick{padding:0 16px}
  .searchbar{grid-template-columns:1fr 1fr}
  .sbar{grid-template-columns:1fr}
  .sbar.sbar4{grid-template-columns:1fr}
  .flights{grid-template-columns:1fr}

/* ═════════ Tarifs selon le statut ═════════
   Règle unique : quand une personne cumule plusieurs statuts, le tarif le plus
   avantageux s'applique — jamais de cumul de remises entre statuts. */
function gfPub(c,k){return c.p+(isWe(k)?c.we:0)}
function gfPrice(c,k,sts){
  const base=gfPub(c,k);let best={p:base,st:null};
  (sts||[]).forEach(s=>{
    let p=base;
    if(s==='abonne')p=c.site?base*.6:c.id==='mer'?(c.h9?30:60):0;
    else if(s==='reseau')p=base*.6;
    else if(s==='jeune')p=base*.5;
    else if(s==='senior')p=isWe(k)?base:base*.65;
    else if(s==='licencie')p=base*.7;
    p=Math.round(p);
    if(p<best.p)best={p,st:s};
  });
  return {...best,pub:base};
}
const LK={abonne:.8,reseau:.9,jeune:.7};
function lessonPrice(base,sts){
  let best={p:base,st:null};
  (sts||[]).forEach(s=>{if(LK[s]){const p=Math.round(base*LK[s]);if(p<best.p)best={p,st:s}}});
  return {...best,pub:base};
}
function stagePrice(s,sts){
  if(s.kid)return {p:s.p,st:null,pub:s.p};
  const k={abonne:.9,jeune:.8};let best={p:s.p,st:null};
  (sts||[]).forEach(x=>{if(k[x]){const p=Math.round(s.p*k[x]);if(p<best.p)best={p,st:x}}});
  return {...best,pub:s.p};
}
/* options : tarif d'UN joueur selon SON statut. Abonné Le Touquet :
   voiturette (sa place) et seau inclus dans la cotisation, chariot à 10 €. */
function optPrice(o,c,sts){

  if((sts||[]).includes('abonne')&&o.pa!=null&&!(c&&c.site))return {p:o.pa,pub:base,st:'abonne'};
  return {p:base,pub:base,st:null};
}
