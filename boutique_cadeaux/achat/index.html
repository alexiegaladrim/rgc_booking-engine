/* ═════════ Restaurant (retour test du 24/09) ═════════
   Réserver une table depuis « Continuer mes achats » : jour, heure et
   couverts pré-remplis d'après la réservation qui vient d'être ajoutée.
   La table rejoint le panier à 0 € et se règle sur place. */
const RESTO='Restaurant du club-house';
const RSVC={dej:['12:00','12:30','13:00','13:30','14:00'],din:['19:00','19:30','20:00','20:30','21:00']};
function restoWhen(l){
  if(l.kind==='carnet'||l.kind==='pass'||l.kind==='resto'||l.kind==='gfx')return null;
  const d=l.kind==='comp'?comp(l.compId).date:l.kind==='coll'?COLL.find(x=>x.id===l.id).d:l.kind==='stage'?STAGES.find(x=>x.id===l.id).d:l.d;
  const h=l.kind==='comp'?comp(l.compId).h:l.kind==='coll'?COLL.find(x=>x.id===l.id).h:l.h||'09:00';
  const nine=l.kind==='gf'&&(flightsOf(l)[0].h9||crs(l.crs).nine);
  const dur=l.kind==='gf'||l.kind==='comp'?(nine?150:270):l.kind==='ind'?l.dur:90;
  let m=Math.ceil((toMin(h)+dur)/30)*30;
  const svc=m<=14*60?'dej':'din';
  m=svc==='dej'?Math.max(12*60,m):Math.max(19*60+30,m);
  const t=toT(Math.min(m,svc==='dej'?14*60:21*60));
  const n=l.kind==='gf'?l.players.length:l.kind==='comp'&&l.partner?2:1;
  return {d,svc,t,n};
}
function restoSug(l){const w=restoWhen(l);if(!w)return null;
  return {k:'resto',tag:'Restaurant',d0:w.d,t:'Réserver une table au club-house',d:`${cap(fday(w.d))} · ${w.svc==='dej'?'déjeuner':'dîner'} vers ${w.t.replace(':',' h ')} · ${plural(w.n,'couvert')}`,
    p:{p:0,pub:0},free:true,act:'xResto',data:`data-d="${w.d}" data-h="${w.t}" data-n="${w.n}"`,d:`${cap(fday(w.d))} · ${w.svc==='dej'?'déjeuner':'dîner'} vers ${w.t.replace(':',' h ')} · ${plural(w.n,'couvert')}`}}
ACT.xResto=a=>{S.rs={d:a.dataset.d,t:a.dataset.h,n:+a.dataset.n||2,note:''};restoSheet()};
function restoSheet(){const r=S.rs, svc=toMin(r.t)<16*60?'dej':'din';
  sheet(shead('Réserver une table',RESTO)+`<p class="sub" style="margin:4px 0 14px">${RESTO} · vue sur le parcours. La table est gardée 15 min après l'heure réservée.</p>
    <label class="field"><span>Date</span><input type="date" id="rsD" value="${r.d}" min="${DMIN}"></label>
    <div class="sect" style="margin:6px 0 8px">Service</div>
    <div class="seg2" style="margin-bottom:12px">${[['dej','Déjeuner'],['din','Dîner']].map(([k,n])=>`<button class="${svc===k?'on':''}" data-act="rsSvc" data-v="${k}">${n}</button>`).join('')}</div>
    <div class="gtimes" style="margin:0 0 14px">${RSVC[svc].map(t=>`<button class="gtime ${r.t===t?'on':''}" data-act="rsT" data-t="${t}"><b>${t}</b></button>`).join('')}</div>
    <div class="between" style="margin-bottom:14px"><b class="h3">Couverts</b>
      <div class="qty sm"><button data-act="rsN" data-n="-1" ${r.n<=1?'disabled':''} aria-label="Moins">−</button><b>${r.n}</b><button data-act="rsN" data-n="1" ${r.n>=12?'disabled':''} aria-label="Plus">+</button></div></div>
    <label class="field"><span>Précisions <i style="font-style:normal;text-transform:none;letter-spacing:0;color:var(--g500)">— facultatif</i></span><input id="rsNote" value="${r.note}" placeholder="Allergie, chaise haute, table en terrasse…"></label>
    <button class="btn full" data-act="rsAdd">${r.edit?'Enregistrer':'Ajouter la table au panier · réglée sur place'}</button>
    <p class="mut" style="margin-top:8px;font-size:12px">Rien à payer maintenant. Annulation libre jusqu'à 2 h avant, depuis Mon espace.</p>`);
  $('#rsD').onchange=e=>{r.d=e.target.value};$('#rsNote').oninput=e=>{r.note=e.target.value};
}
ACT.rsSvc=a=>{S.rs.t=a.dataset.v==='dej'?'12:30':'19:30';restoSheet()};
ACT.rsT=a=>{S.rs.t=a.dataset.t;restoSheet()};
ACT.rsN=a=>{S.rs.n=Math.max(1,Math.min(12,S.rs.n+ +a.dataset.n));restoSheet()};
ACT.rsAdd=()=>{const r=S.rs;closeSheet();
  if(r.edit){const o=findRes(r.edit);Object.assign(o,{d:r.d,h:r.t,n:r.n,sub:plural(r.n,'couvert')+(r.note?' · '+r.note:'')});render();toast('Table modifiée.');return}
  if(!S.cart.length){hold=HOLD;holdDead=false}
  const l={kind:'resto',d:r.d,h:r.t,n:r.n,note:r.note,uid:uid()};S.cart.push(l);
  render();openDrawer(l);toast('Table ajoutée à votre panier.')};
function sugFor(l){
  if(l.kind==='gfx'||l.kind==='gift')return [];   /* bons cadeaux · lot B2 */
  const has=k=>S.cart.some(x=>x.kind===k);
  const sug=[];
  const nextComp=COMPS.find(cp=>!isFull(cp)&&cp.date>(l.d||TODAY)&&(!l.crs||cp.crs===l.crs))||COMPS[0];
  if(l.kind==='gf'){
    sug.push({k:'ind',tag:'Enseignement',t:'Un cours de 30 min avant votre départ',d:`Échauffement et routine avec un pro, le ${fdm(l.d)} au matin.`,p:lessonPrice(45,mySt()),act:'xInd',data:`data-d="${l.d}"`});
    sug.push({k:'comp',tag:'Compétition',t:nextComp.n,d:`${fday(nextComp.date)} · ${crs(nextComp.crs).n} · ${nextComp.fmt}`,p:compPrice(nextComp,mySt()),act:'compOpen',data:`data-id="${nextComp.id}"`});
    sug.push({k:'carnet',tag:'Carnet',t:'Carnet 5 cours · 30 min',d:'Le cours revient à 40 € au lieu de 45 €, valable 12 mois.',p:lessonPrice(200,mySt()),act:'xCarnet'});
  } else if(l.kind==='comp'){
    const cp=comp(l.compId), c=crs(cp.crs), rk=dshift(cp.date,-1);
    sug.push({k:'gf',tag:'Green fee',t:`Reconnaissance de ${c.n} la veille`,d:`${fday(rk)} — jouez le tracé avant l'épreuve.`,p:gfPrice(c,rk,mySt()),act:'xGf',data:`data-d="${rk}" data-c="${c.id}"`});
    sug.push({k:'coll',tag:'Cours collectif',t:'Putting — lire les greens',d:'Atelier d\'une heure avec Lou Castel, le 27 septembre.',p:lessonPrice(30,mySt()),act:'xTab',data:'data-t="coll"'});
    sug.push({k:'ind',tag:'Enseignement',t:'Un cours individuel d\'1 h',d:'Préparer la compétition avec un pro.',p:lessonPrice(80,mySt()),act:'xInd',data:`data-dur="60"`});
  } else {
    const k=l.d||'2026-09-24';
    sug.push({k:'gf',tag:'Green fee',t:l.kind==='carnet'?'Mettre vos cours en jeu':'Jouer le même jour',d:l.kind==='carnet'?'Un 9 trous sur Le Manoir, accessible à tous les niveaux.':`Un départ l'après-midi du ${fdm(k)}, après votre cours.`,p:gfPrice(crs('manoir'),k,mySt()),act:'xGf',data:`data-d="${k}" data-c="manoir"`});
    if(l.kind!=='carnet')sug.push({k:'carnet',tag:'Carnet',t:'Carnet 5 cours · 30 min',d:'Pour la suite : 5 cours, valable 12 mois.',p:lessonPrice(200,mySt()),act:'xCarnet'});
    else sug.push({k:'ind',tag:'Enseignement',t:'Réserver votre premier cours',d:'Les crédits seront disponibles dès le paiement confirmé.',p:lessonPrice(45,mySt()),act:'xInd',data:''});
    sug.push({k:'comp',tag:'Compétition',t:nextComp.n,d:`${fday(nextComp.date)} · ${nextComp.fmt}`,p:compPrice(nextComp,mySt()),act:'compOpen',data:`data-id="${nextComp.id}"`});
  }
  const rs=restoSug(l);if(rs)sug.splice(1,0,rs);
  sug.forEach(s=>{const d=(s.data||'').match(/data-d="([^"]+)"/), id=(s.data||'').match(/data-id="([^"]+)"/);
    s.dup=s.k==='gf'?S.cart.some(x=>x.kind==='gf'&&d&&x.d===d[1])
      :s.k==='resto'?S.cart.some(x=>x.kind==='resto'&&x.d===s.d0)
      :s.k==='comp'?!!(id&&(S.cart.some(x=>x.kind==='comp'&&x.compId===id[1])||compRegistered(comp(id[1]))))
      :has(s.k)});
  return sug;
}
R.cross=()=>{
  const l=S.lastAdded;if(!l){go('panier');return}

       ${inC?'<span class="done-t">Déjà dans votre panier</span>':`<button class="btn sm sec" data-act="${s.act}" ${s.data||''}>Ajouter</button>`}</div></div>`}).join('')}</div>
   <p class="note">Les suggestions croisent les trois activités du périmètre et reprennent la date de la ligne ajoutée. Un service déjà au panier est marqué « Déjà dans votre panier » et ne peut pas être ajouté une seconde fois (règle du 17/09).</p>`;
};

/* ═════════ Tiroir panier & rappel permanent ═════════

const DW={on:false,hi:null};

const delX=l=>`<button class="delx" data-act="lineDel" data-u="${l.uid}" title="Retirer du panier" aria-label="Retirer du panier">${XICO}</button>`;
const XICO='<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg>';
function dwHtml(){
  const head=`<div class="dw-h"><div class="h2">Votre <b>panier</b></div>${
    S.cart.length?`<span class="tag">${gcCartN()}</span>`:''}
    <button class="x" data-act="dwClose" aria-label="Fermer">${XICO}</button></div>`;
  if(!S.cart.length)return head+`<div class="dw-b"><div class="dw-empty">
    <span class="cp-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1.4 12H5.4L4 7Z"/><path d="M9 7V5.5a3 3 0 0 1 6 0V7"/></svg></span>
    <b class="h2">Votre panier est vide</b>
    <p class="sub" style="margin:6px 0 4px">Un départ, une compétition ou un cours : tout se règle en un seul paiement.</p>

  const T=cartTotals(), hi=DW.hi;
  return head+`
   <div class="dw-b">

     ${holdHtml()}
     ${S.cart.map(l=>{const v=lineView(l);return `<div class="dwl${l.uid===hi?' new':''}">
       <div><span class="tag">${v.tag}</span><b class="h3">${v.title}</b><span class="mut">${v.sub}</span>
</div>

     ${hi&&S.lastAdded?(()=>{const sg=sugFor(S.lastAdded).filter(x=>!x.dup).slice(0,2);if(!sg.length)return '';
       return `<div class="dws"><div class="dws-h"><b class="h3">Pour compléter</b><button class="lnk" data-act="dwSug">Voir davantage de suggestions →</button></div>

           <div><span class="tag">${x.tag}</span><b>${x.t}</b><span class="mut">${x.free?'À régler sur place':x.p.p===0&&x.p.pub>0?'Inclus':(x.p.p<x.p.pub?`<span class="was">${eur(x.p.pub)}</span>`:'')+eur(x.p.p)}</span></div>

ACT.coPay=()=>{
  if(gcPayGuard())return;   /* bons cadeaux · lot B2 : facture société, refus de carte de démo */
  const u=me(), T=cartTotals(), sav=savingsHtml(T);   /* figé avant de débiter l'avoir */
  const ref='TQ-'+(++S.ref)+'-'+uid().slice(0,3).toUpperCase();
  const lines=S.cart.map(l=>({l,v:lineView(l)}));
  if(u){
    const RS=S.res[u.id]||(S.res[u.id]=[]);
    lines.forEach(({l,v})=>{
      if(l.kind==='gfx'){const r=RS.find(x=>x.id===l.resId);if(r){r.ox={...(r.ox||{})};Object.entries(l.add).forEach(([k,q])=>r.ox[k]=(r.ox[k]||0)+q);
        if(l.cfg)r.cfg=(r.cfg||[]).concat(l.cfg);r.amount=Math.round((r.amount+v.total-v.promo)*100)/100;if(r.pay==='incl')r.pay='card'}return}
      if(l.kind==='gift')return;   /* bons cadeaux · lot B2 : un bon n'est pas une réservation */
      if(l.kind==='pass'){const k=pass(l.id);(u.passes=u.passes||[]).push({id:l.id,d:TODAY,left:k.q||null});return}
      if(l.kind==='carnet'){const k=CARNETS.find(x=>x.id===l.id), c=u.credits[k.dur];
        u.credits[k.dur]={left:(c?c.left:0)+k.q,tot:(c?c.tot:0)+k.q,end:'2027-09-24'};return}
      if(l.kind==='ind'&&(l.credit||l.viaCarnet)&&u.credits[l.dur])u.credits[l.dur].left--;
      if(l.editOf){const o=RS.find(r=>r.id===l.editOf.id);if(o)mvOut(o,l.editOf.moved)}
      const cp=l.kind==='comp'?comp(l.compId):null;
      if(l.kind==='gf'&&(l.book||[]).length){const b=myBook(l.crs);if(b)b.left=Math.max(0,(b.left??pass(b.id).q)-l.book.length)}
      /* Loisir 5/7 : un départ inclus consomme un green fee du quota annuel */
      if(l.kind==='gf'&&u.quota){const me0=gfCalc(l).find(x=>x.who&&/\(vous\)$/.test(x.who)&&!x.opt);if(me0&&me0.p===0&&me0.st==='loisir')u.quota.used=Math.min(u.quota.max,u.quota.used+1)}
      const ox={};(l.fopts||[]).forEach(o=>GOPTS.forEach(op=>{if(o[op.id])ox[op.id]=(ox[op.id]||0)+o[op.id]}));
      const gfx=l.kind==='gf'?{ox,crs:l.crs,h9:!!flightsOf(l)[0].h9,players:l.players.map((p,i)=>({...p,paid:(gfCalc(l)[i]||{p:0}).p}))}:{};
      RS.push({id:"r"+uid(),kind:l.kind,compId:l.compId,t:l.editOf&&l.kind==='gf'?v.title.replace('Changement de départ','Green fee'):v.title,sub:v.sub.split(' · ').slice(2).join(' · ')||v.sub,d:cp?cp.date:l.d,h:cp?cp.h:l.h,
        close:cp?cp.close:null,pay:l.kind==='resto'?'place':l.kind==='ind'&&(l.credit||l.viaCarnet)||l.kind==='gf'&&(l.book||[]).length&&v.total===0?'credit':v.total===0?'incl':'card',amount:v.total-v.promo+(l.editOf&&l.editOf.paid||0),fresh:true,...gfx,...(l.kind==='resto'?{n:l.n}:{})});
      if(cp){cp.taken=Math.min(cp.cap,cp.taken+(l.partner?2:1))}
    });
    if(T.avoir)u.avoir=Math.round((u.avoir-T.avoir)*100)/100;
  }
  const X=payRest(T,u);if(u&&X.w)u.wallet=Math.round((u.wallet-X.w)*100)/100;
  S.done={ref,lines,T,sav,guest:!u,mail:u?u.email:S.co.gMail,tel:u?(u.smsOff?null:u.tel):S.co.gTel,garantie:S.co.garantie,pay:S.co.pay,X,gift:S.co.gift,
    link:S.co.pay==='link'?'resonance-golf.fr/p/'+ref.toLowerCase():null};
  Object.assign(S.co,{pay:'all',wallet:false,gift:null,giftErr:''});S.newSt=null;
  const joins=lines.map(({l})=>l.kind==='gf'&&joinOf(l)).filter(Boolean);
  if(joins.length&&u)setTimeout(()=>toast(joins.map(j=>`Notification envoyée à ${PROFILES[j.id].n.split(' ')[0]} : « ${u.n.split(' ')[0]} a rejoint votre départ de ${j.t} »`).join('<br>')),600);
  S.cart=[];S.promo=null;S.co.cgv=false;S.co.garantie=false;hold=HOLD;holdDead=false;
  gcAfterPay();   /* bons cadeaux · lot B2 */
  go('confirm');
};

/* panier : ce qui relève des bons et ce qui relève des réservations */
const gcIsGift=l=>l.kind==='gift';
function gcHasGift(){return S.cart.some(gcIsGift)}
function gcGiftOnly(){return S.cart.length>0&&S.cart.every(gcIsGift)}
function gcHoldOn(){return S.cart.some(l=>!gcIsGift(l))}   /* le maintien des places ne vise que les réservations */
function gcCartN(L){

const gcCardLeft=b=>Math.max(0,Math.round(((b.solde!=null?b.solde:0)-(GCS.cardUsed[b.code]||0))*100)/100);
function gcCardLookup(raw){
  const c=String(raw||'').toUpperCase().replace(/[\s.]/g,'');
  if(!c)return {err:'Saisissez le code de la carte cadeau, au format RGC-XXXX-XXXX : il figure sur le bon reçu par e-mail.'};
  const giftOnly=()=>GCSW.I==='non'&&gcGiftOnly()
    ?{err:'Une carte cadeau ne peut pas servir à payer un bon cadeau, et votre panier ne contient que des bons. Réglez-les par carte bancaire : la carte cadeau reste utilisable pour une réservation.'}:null;
  if(GIFTS[c]!=null){   /* chèques cadeaux de la v3, gardés pour la démo */
    const left=Math.max(0,GIFTS[c]-(GCS.cardUsed[c]||0));
    if(!left)return {err:`La carte cadeau ${c} a déjà été utilisée en totalité : son solde est de 0 €.`};
    return giftOnly()||{ok:{code:c,amt:left,legacy:true}};
  }
  const m=/^RGC-?([A-Z0-9]{4})-?([A-Z0-9]{4})$/.exec(c);
  if(!m)return {err:`« ${gcEsc(String(raw).trim())} » n’est pas un code de carte cadeau. Il se présente sous la forme RGC suivi de deux groupes de 4 lettres ou chiffres, par exemple RGC-XXXX-XXXX. Un code promo se saisit dans le panier.`};
  const code=`RGC-${m[1]}-${m[2]}`, b=GC_TEST_BONS.find(x=>x.code===code);
  if(!b)return {err:`Le code ${code} ne correspond à aucune carte cadeau. Vérifiez-le sur le bon reçu par e-mail, en particulier les 0 et les O, les 1 et les I.`};
  const o=gcOffer(b.offer);
  if(b.st==='Expiré')return {err:`Le bon ${code} (${o.title}) a expiré : il ne peut plus être utilisé. Contactez l’établissement pour demander une prolongation.`};
  if(b.st==='Consommé')return {err:`Le bon ${code} (${o.title}) a déjà été utilisé en totalité.`};
  if(o.type!=='carte')return {err:`Le code ${code} est celui d’une expérience (${o.title}) : il ne se déduit pas comme un montant. Il s’utilise en une seule fois, pour ${o.lines.length>1?'les prestations de l’expérience':'la prestation elle-même'}, en le présentant à l’établissement.`};   /* lot B2c */
  const left=gcCardLeft(b);
  if(!left)return {err:`La carte cadeau ${code} a déjà été utilisée en totalité : son solde est de 0 €.`};
  return giftOnly()||{ok:{code,amt:left,init:b.init,rgc:true}};
}

function yearStats(u){
  const h=n=>hash(u.id+n);
  const months=[5,4,6,8,9,11,12,10,9].map((b,i)=>Math.max(1,b+(h('m'+i)%5)-2-(u.st.includes('abonne')?0:3)));
  const n=months.reduce((a,b)=>a+b,0);
  const crsN=[['La Forêt',Math.round(n*.48)],['La Mer',Math.round(n*.34)],['Le Manoir',0]];crsN[2][1]=n-crsN[0][1]-crsN[1][1];
  const mates=u.partners.map((id,i)=>({n:(PROFILES[id]||{}).n||id,ini:(PROFILES[id]||{}).ini||'?',c:Math.max(2,Math.round(n*(.42-i*.11))+(h('p'+id)%3))})).sort((a,b)=>b.c-a.c);
  const nine=Math.round(n*.18), holes=(n-nine)*18+nine*9;
  return {months,n,crsN,mates,holes,hrs:Math.round(((n-nine)*4.3+nine*2.2)),early:h('e')%2?'8 h 10':'9 h 20',idxFrom:u.idx!=null?+(u.idx+1.8+(h('i')%20)/10).toFixed(1):null,idxTo:u.idx,

}

  S.mv={rid:r.id,sel:resPlayers(r).map((p,i)=>i),date:r.d,crs:r.crs||'foret',h9:!!r.h9,t:null,tc:null,other:false};go('gf-move');

function mvState(){
  const m=S.mv, r=findRes(m.rid), ps=resPlayers(r), sel=m.sel.filter(i=>ps[i]);
  const tc=m.tc||m.crs, c=crsV(tc,tc===m.crs?m.h9:false);
  const paid=sel.reduce((t,i)=>t+(ps[i].paid||0),0);
  const news=sel.map(i=>({i,p:ps[i],w:mvWho(ps[i],i),x:gfPrice(c,m.date,playerInfo(ps[i],i).st,m.t)}));
  const nw=news.reduce((t,y)=>t+y.x.p,0);
  return {m,r,ps,sel,c,paid,news,nw,diff:Math.round((nw-paid)*100)/100};

function mvOut(o,moved){
  const ps=resPlayers(o);
  if(!moved||moved.length>=ps.length){o.cancelled='Remplacé par la modification du '+fdm(TODAY);return}
  const out=moved.reduce((t,i)=>t+(ps[i].paid||0),0);
  o.players=ps.filter((p,i)=>!moved.includes(i));o.amount=Math.round((o.amount-out)*100)/100;
  o.sub=plural(o.players.length,'joueur')+' · '+o.players.map((p,i)=>mvWho(p,i).n.replace(' (vous)','')).join(', ');

/* ═════════ Mes proches sur le parcours ═════════
   Un proche n'apparaît que s'il partage ses départs (réglage de son compte,
   désactivé par défaut). Rejoindre son départ = une réservation indépendante :
   on ne paie que ses propres places, et le proche est prévenu. */
function proxOn(k){
  const u=me();if(!u)return [];
  return u.partners.map(id=>PROFILES[id]).filter(p=>p&&p.share&&FRES[p.id])
    .flatMap(p=>FRES[p.id].filter(r=>r.d===k).map(r=>{const x=slots(crs(r.crs),k).find(s=>s.t===r.t);return {...r,p,free:x?x.free:0}}))
    .sort((a,b)=>a.t<b.t?-1:1);
}
const proxNeed=()=>isGroup()?1:S.gf.pax;
const inGroupSel=(c,t)=>isGroup()&&S.gf.flights.some(f=>f.crs===c&&f.t===t);
function nearSlots(c,t,need){
  const all=slots(c,S.gf.date).filter(s=>s.free>=need&&!inGroupSel(c.id,s.t));
  return {before:all.filter(s=>s.t<t).pop()||null,after:all.find(s=>s.t>t)||null};
}
/* repères de la grille : créneaux des proches et créneaux voisins */
function proxMarks(c){
  const g=S.gf, byT={}, near={};
  if(!g.prox||!me())return {byT,near};
  const P=proxOn(g.date).filter(r=>r.crs===c.id&&inMoment(r.t,g.moment));
  P.forEach(r=>(byT[r.t]=byT[r.t]||[]).push(r));
  const seq=slots(c,g.date).map(s=>s.t);
  P.forEach(r=>{const i=seq.indexOf(r.t);[seq[i-1],seq[i+1]].forEach(t=>{if(t&&!byT[t])near[t]=r.p.n.split(' ')[0]})});
  return {byT,near};
}

/* ═════════ Joueurs déjà inscrits sur un créneau ═════════
   Visible une fois connecté·e : le nom si le joueur a choisi « nom visible »,
   sinon « Profil masqué » avec son index seulement. */
const POOL=[{n:'Hélène Bruneau',idx:16.8,pub:true},{n:null,idx:18.4},{n:'Antoine Vasseur',idx:9.1,pub:true},{n:null,idx:27.0},
  {n:'Camille Bernard',idx:18.4,pub:true},{n:null,idx:11.2},{n:'Thomas Leroy',idx:26.1,pub:true},{n:null,idx:32.5},
  {n:'Nadia Sultan',idx:19.2,pub:true},{n:null,idx:14.9},{n:'Kevin Blanc',idx:16.8,pub:true},{n:null,idx:21.7}];
function occupants(cid,k,t){
  const u=me();if(!u)return [];
  const c=crs(cid), s=slots(c,k).find(x=>x.t===t), taken=Math.max(0,4-(s?s.free:4));
  if(!taken)return [];
  const out=[];
  Object.entries(FRES).forEach(([id,rs])=>rs.forEach(r=>{if(r.crs===cid&&r.d===k&&r.t===t){const p=PROFILES[id];
    out.push({n:p.n,idx:p.idx,pub:p.pubProfile!=null?p.pubProfile:!!p.share,proche:u.partners.includes(id)});
    for(let i=1;i<r.n;i++)out.push({...POOL[hash(cid+k+t+i)%POOL.length]})}}));
  let i=0;
  while(out.length<taken&&i<40){const q=POOL[hash(cid+k+t+'o'+i)%POOL.length];i++;if(q.n&&out.some(o=>o.n===q.n))continue;out.push({...q})}
  /* « Profil masqué » ne vaut que pour les inconnus : un proche voit toujours le nom */
  return out.slice(0,taken).map(o=>({...o,vis:!!((o.pub||o.proche)&&o.n),ini:o.n?o.n.split(' ').map(w=>w[0]).join('').slice(0,2):''}));
}
const occLbl=o=>o.vis?`${o.n} · index ${fidx(o.idx)}`:`Profil masqué · index ${fidx(o.idx)}`;
function occList(f){
  const L=occupants(f.crs,S.gf.date,f.t);
  if(!L.length)return `<p class="mut occ-none">Personne n'est encore inscrit sur ce départ.</p>`;
  return `<div class="occ-list"><span class="sbl">Déjà inscrits sur ce départ</span>${L.map(o=>`<div class="occ-row"><span class="av ${o.vis?'lt':'mask'}">${o.vis?o.ini:'<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'}</span>
    <div><b>${o.vis?o.n:'Profil masqué'}</b><span class="mut">Index ${fidx(o.idx)}${o.proche&&o.vis?' · votre proche':''}</span></div></div>`).join('')}</div>`;
}

function gcIsShopScr(id){return GC_SHOP_SCR.includes(id)}

  if(gcIsShopScr(id))GB4.ctx=true;else if(!GC_SHOP_KEEP.includes(id))GB4.ctx=false;
  const st=$('#stage');st.dataset.shop=GB4.ctx?'1':'';
  $('#shopHdr').hidden=!GB4.ctx;$('#shopFoot').hidden=!GB4.ctx;GB4.mega=false;$('#shopHdr').classList.remove('compact');gcLastY=0;   /* nouvelle page : header complet */
}

/* 03/11 (Alexie) : au défilement vers le bas, le header se réduit (logo, panier, rubriques) ; il revient en entier à la remontée */
var gcLastY=0, gcHdrLock=0;
function gcHdrSet(h,on,y){if(h.classList.contains('compact')===on){gcLastY=y;return}h.classList.toggle('compact',on);gcLastY=y;gcHdrLock=Date.now()+480}
function gcHdrScroll(){
  const st=$('#stage'), h=$('#shopHdr');if(!h||h.hidden)return;
  const y=st.dataset.vp==='mobile'?st.scrollTop:(window.scrollY||0);
  if(Date.now()<gcHdrLock){gcLastY=y;return}   /* pendant l'animation, les variations de hauteur ne comptent pas comme un défilement */
  if(y<120){gcHdrSet(h,false,y);return}
  if(y>gcLastY+8)gcHdrSet(h,true,y);
  else if(y<gcLastY-8)gcHdrSet(h,false,y);
}
addEventListener('scroll',gcHdrScroll,{passive:true});$('#stage').addEventListener('scroll',gcHdrScroll,{passive:true});

function gcVchCard(b){
  const o=gcOffer(b.offer), carte=o.type==='carte', end=['Expiré','Consommé'].includes(b.st);

ACT.gcBonGo=()=>{
  const v=($('#gbBonCode').value||'').trim(), k=v.toUpperCase().replace(/[\s-]/g,'');
  if(!k){sheet(gcVchHtml({v,err:gcT('Saisissez le code inscrit sur votre bon.','Enter the code printed on your voucher.')}),'gb-bon');return}
  const b=GC_TEST_BONS.find(x=>x.code.replace(/-/g,'')===k);
  if(!b){sheet(gcVchHtml({v,err:gcT(`Aucun bon ne correspond à « ${gcEsc(v)} ». Vérifiez les 8 caractères après RGC : les lettres O et I n’y figurent jamais.`,`No voucher matches “${gcEsc(v)}”. Check the 8 characters after RGC.`)}),'gb-bon');return}
  sheet(gcVchHtml({v:b.code,b}),'gb-bon');
};

/* ---------- routage : #/boutique/… ---------- */
function gcB4Hash(id){
  if(id==='gchome')return '#/boutique';
  if(id==='gcuniv')return '#/boutique/'+GC_USLUG[GB4.univ];
  if(id==='gcdest')return '#/boutique/destinations';
  if(id==='gcgolf')return '#/boutique/destinations/'+GC_SSLUG[GB4.golf];
  if(id==='gcnoel')return '#/boutique/noel';
  if(id==='gcoffrir')return '#/boutique/offrir';
  return '';
}
function gcB4Route(h){
  const m=/^#\/boutique(?:\/([^/?#]+))?(?:\/([^/?#]+))?\/?$/.exec(h||'');if(!m)return false;
  const a=m[1]?decodeURIComponent(m[1]):'', b=m[2]?decodeURIComponent(m[2]):'';
  if(gcB4Hash(S.screen)===h)return true;
  if(!a){go('gchome');return true}
  if(a==='destinations'&&!b){go('gcdest');return true}
  if(a==='destinations'){const c=Object.keys(GC_SSLUG).find(k=>GC_SSLUG[k]===b);if(c){gcGolf(c);return true}}
  else if(a==='noel'&&!b){gcResetF();go('gcnoel');return true}
  else if(a==='offrir'&&!b){go('gcoffrir');return true}
  else if(!b){const u=Object.keys(GC_USLUG).find(k=>GC_USLUG[k]===a);if(u){gcUniv(u);return true}}
  go('gchome');toast('Cette page de la boutique est introuvable : l’adresse est peut-être incomplète. Voici l’accueil de la boutique.');return true;
}
const _gcRoute0=gcRoute;
gcRoute=function(h){return gcB4Route(h)||_gcRoute0(h)};

function gcNewCode(seed){
  let h=gcHash(seed), c='';
  do{c='';for(let i=0;i<8;i++){h=Math.imul(h^(h>>>15),2246822507)>>>0;c+=GC_CODE_ALPHA[h%GC_CODE_ALPHA.length]}c='RGC-'+c.slice(0,4)+'-'+c.slice(4);h++}
  while(GC_TEST_BONS.some(b=>b.code===c));
  return c;
}
/* QR de démonstration : motif déterministe tiré du code (21 × 21, repères aux coins) */
function gcQr(code,size){
  const n=21, h0=gcHash(code);let h=h0, r='';
  const fin=(x,y)=>[[0,0],[n-7,0],[0,n-7]].some(([a,b])=>x>=a&&x<a+7&&y>=b&&y<b+7);
  const ring=(x,y)=>{for(const [a,b] of [[0,0],[n-7,0],[0,n-7]]){const dx=x-a,dy=y-b;if(dx>=0&&dx<7&&dy>=0&&dy<7)return dx===0||dy===0||dx===6||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4)}return false};
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){let on;if(fin(x,y))on=ring(x,y);else{h=Math.imul(h^(h>>>13),1597334677)>>>0;on=(h&3)===0||(h&5)===1}if(on)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  return `<svg class="gb-qr" width="${size}" height="${size}" viewBox="-1 -1 23 23" role="img" aria-label="QR code du bon ${code}"><rect x="-1" y="-1" width="23" height="23" fill="var(--paper)"/><g fill="var(--ink)">${r}</g></svg>`;
}

/* ---------- au paiement : un code par bon, statut d'envoi, registre des bons ---------- */
const _gcAfterPay3=gcAfterPay;
gcAfterPay=function(){
  _gcAfterPay3();closeDrawer();const d=S.done;if(!d||!d.gc)return;   /* le tiroir du panier ne reste pas ouvert, vide, sur la confirmation */
  let fail=GB3.failNext;
  d.gc.bons=d.gc.bons.map((l,i)=>{
    const o=gcOffer(l.offer), code=gcNewCode(d.ref+'/'+i), dated=l.send==='date'&&l.date, end=gcValidEnd(l);
    let st=dated?'programme':'envoye';
    if(fail&&l.mode==='offrir'&&!dated){st='echec';fail=false}
    GC_TEST_BONS.push({code,offer:l.offer,st:dated?'Programmé':'Émis',solde:o.type==='carte'?gcLineBase(l)-(l.opts||[]).reduce((t,k)=>t+GC_OPTS[k].p,0):undefined,init:o.type==='carte'?l.amount:undefined,
      to:l.to,mail:l.mail,sendAt:dated?l.date:TODAY,end,etab:l.etab||'',fresh:true});
    return Object.assign({},l,{code,st,end,sendAt:dated?l.date:TODAY});
  });
  GB3.failNext=false;GB3.acct=false;GB3.acctErr='';
};
const gcBonRec=code=>GC_TEST_BONS.find(b=>b.code===code);
const gcBonSt=b=>GB3.st[b.code]||b.st;
function gcStTxt(b,buyer){
  const where=b.mode==='offrir'?`à <b>${gcEsc(b.mail)}</b>`:`à votre adresse e-mail${buyer?', <b>'+gcEsc(buyer)+'</b>':''}`;
  if(b.st==='echec')return {k:'off',t:'Échec d’envoi',d:`L’adresse ${gcEsc(b.mail)} n’a pas accepté l’e-mail. Corrigez-la : le bon sera renvoyé aussitôt.`};
  if(b.st==='programme')return {k:'prog',t:'Envoi programmé',d:`Le ${fday(b.sendAt)} au matin, ${where}. Vous pouvez déjà télécharger le bon.`};
  return {k:'ok',t:b.mode==='offrir'?'Envoyé':b.mode==='remettre'?'Envoyé, à remettre':'Envoyé',d:`À l’instant, ${where}${b.mode==='remettre'?', avec le bon à imprimer pour le remettre vous-même':''}.`};
}

function gb8Match(o,st,skip){
  if(o.type==='carte')return false;
  if(st.pour&&skip!=='pour'&&!gb8Pour(o,st.pour))return false;
  return gcMatch(o,{occ:st.occ,univ:st.univ,budget:st.budget,etab:st.etab},skip);
}
const gb8List=(st,skip)=>GC_OFFERS.filter(o=>gb8Match(o,st||GB8,skip));
const gb8Count=(k,v)=>gb8List(Object.assign({},GB8,{[k]:v})).length;
function gb8Sort(l){
  const r=id=>{const i=GC_BEST.indexOf(id);return i<0?99:i};
  if(GB8.sort==='asc')return l.slice().sort((a,b)=>a.price-b.price);
  if(GB8.sort==='desc')return l.slice().sort((a,b)=>b.price-a.price);
  return l.slice().sort((a,b)=>r(a.id)-r(b.id));   /* pertinence : meilleures ventes d'abord */
}
const gb8Lab=(list,v)=>(list.find(x=>x[0]===v)||['',''])[1];
function gb8Sum(){
  const p=[];
  if(GB8.pour)p.push('pour '+gb8Lab(GC_POUR,GB8.pour).replace(/^Un /,'un ').replace(/^Quelqu’un/,'quelqu’un'));
  if(GB8.budget)p.push(gb8Lab(GC_BUDGETS,GB8.budget).toLowerCase());
  if(GB8.occ)p.push(gb8Lab(GC_OCCASIONS,GB8.occ));
  if(GB8.univ)p.push(gb8Lab(GC_UNIVERS,GB8.univ));
  if(GB8.etab)p.push(gb8Lab(GC_PLACES,GB8.etab));
  return p;
}
/* rien ne correspond : on lâche le budget et on nomme l'écart, sinon on lâche « pour qui » */
function gb8Near(){
  const b=GB8.budget&&GC_BUDGETS.find(x=>x[0]===GB8.budget);
  if(b){
    const l=gb8List(GB8,'budget').map(o=>{const d=o.price<b[2]?o.price-b[2]:Math.round(o.price-Math.floor(b[3]));return {o,d}}).sort((x,y)=>Math.abs(x.d)-Math.abs(y.d)).slice(0,3);
    if(l.length)return l;
  }
  return gb8Sort(gb8List(Object.assign({},GB8,{pour:''}))).slice(0,3).map(o=>({o,d:0}));
}
const gb8Gap=d=>d>0?`${eur(d)} au-dessus de votre budget`:d<0?`${eur(-d)} en dessous de votre budget`:'';
function gb8Carte(){
  const o=gcOffer('carte-cadeau'), a=GB8.budget?GC_BAMT[GB8.budget]:0;
  const vis=a?gcGiftVis(o).replace(/<b class="gc-gv-amt">[\s\S]*?<\/b>/,`<b class="gc-gv-amt">${eur(a)}</b>`):gcGiftVis(o);
  return `<article class="gc-offer gc-oc gc-oc-carte" data-offer="carte-cadeau" data-role="guide-carte">
    <button class="gc-oc-img" data-act="gb8Carte" aria-label="Offrir la carte cadeau${a?' de '+eur(a):''}">${vis}</button>
    <span class="gc-oc-venue">Valable dans nos ${GC_SITES.length} golfs</span>
    <h3 class="gc-oc-t"><button class="gc-tt" data-act="gb8Carte">Vous hésitez ? La carte cadeau</button></h3>
    <p class="gc-oc-sub">Il ou elle choisira, en une ou plusieurs fois.</p>
    <div class="gc-oc-foot"><div class="gc-cprice" data-role="carte-amt">${a?`<b>${eur(a)}</b>`:`dès <b>${eur(Math.min(...o.amounts))}</b>`}</div>
      <button class="btn sm gc-go" data-act="gb8Carte">${a?'Offrir '+eur(a):'Choisir'}</button></div></article>`;
}
function gb8Grid(list){
  const cards=list.map(gcCard), at=Math.min(3,cards.length);
  cards.splice(at,0,gb8Carte());
  return `<div class="crsrow h gc-crsrow" data-role="guide-grid">${cards.join('')}</div>`;
}
function gb8Row(k,label,opts,all,opt){
  return `<div class="gb8-row" data-q="${k}" role="group" aria-labelledby="gb8-l-${k}"><span class="gb8-l" id="gb8-l-${k}">${label}${opt?'<small>facultatif</small>':''}</span>
    <div class="gb8-chips">${[['',all],...opts].map(([v,l])=>{const n=gb8Count(k,v);
      return `<button class="chip${GB8[k]===v?' on':''}${n?'':' gb8-zero'}" data-act="gb8Set" data-k="${k}" data-v="${v}" aria-pressed="${GB8[k]===v}">${l}<span class="gb8-n" aria-label="${n} idée${n>1?'s':''}">${n}</span></button>`}).join('')}</div></div>`;
}
R.gcoffrir=()=>{
  const list=gb8Sort(gb8List()), n=list.length, any=GB8.pour||GB8.budget||GB8.occ||GB8.univ||GB8.etab, sum=gb8Sum();
  const near=n?[]:gb8Near();
  const univ=`<div class="gc-upills" role="group" aria-label="Envies">${[['','Toutes les envies'],...GC_UNIVERS].map(([v,l])=>`<button class="chip${GB8.univ===v?' on':''}" data-act="gb8Set" data-k="univ" data-v="${v}" aria-pressed="${GB8.univ===v}">${l} <span class="gb8-n">${gb8Count('univ',v)}</span></button>`).join('')}</div>`;
  const etab=`<select class="inp gc-sel" data-gb8="etab" aria-label="Destination"><option value="">Tous les golfs</option>${GC_PLACES.map(([v,l])=>`<option value="${v}"${GB8.etab===v?' selected':''}>${l} (${gb8Count('etab',v)})</option>`).join('')}</select>`;
  const sort=`<select class="inp gc-sel" data-gb8="sort" aria-label="Trier"><option value="">Trier : pertinence</option><option value="asc"${GB8.sort==='asc'?' selected':''}>Prix croissant</option><option value="desc"${GB8.sort==='desc'?' selected':''}>Prix décroissant</option></select>`;
  $('#v-gcoffrir').innerHTML=`${gcCrumb([['Trouver un cadeau','']])}
   <section class="gb8-hero" data-role="guide" aria-label="Guide cadeaux">
     <span class="eyebrow">Guide cadeaux</span>
     <h1 class="h1">Trouver le bon cadeau</h1>
     <p class="sub">Pour qui, et quel budget : les idées se trient en direct. Le chiffre indique combien d’idées se cachent derrière chaque choix.</p>
     ${gb8Row('pour','Pour qui ?',GC_POUR,'Tout le monde')}
     ${gb8Row('budget','Quel budget ?',GC_BUDGETS.map(b=>[b[0],b[1]]),'Tous les budgets')}
     ${GB8.occOpen||GB8.occ?gb8Row('occ','Une occasion ?',GC_OCCASIONS,'Aucune en particulier',true):`<button class="gb8-add" data-act="gb8Occ">+ Préciser une occasion (anniversaire, fête des pères…)</button>`}
     <div class="gb8-cta"><button class="btn" data-act="gb8Go" data-role="guide-count">${n?`Voir ${n>1?'les '+n+' idées':'l’idée'}`:'Voir les idées proches'}</button>
       ${any?'<button class="lnk" data-act="gb8Clear">Tout effacer</button>':''}</div>
   </section>
   ${gcReas()}
   <section class="gb8-res" id="gb8Res" aria-live="polite" aria-label="Idées de cadeaux">
     <div class="gb-h2"><h2 class="h2" data-role="guide-title">${n?cap(gcN(n)):'Aucune idée exacte'}</h2></div>
     ${sum.length?`<p class="gb8-sum" data-role="guide-sum">${cap(sum.join(' · '))}</p>`:''}
     <div class="gb8-tools">${univ}<span style="display:flex;gap:10px;flex-wrap:wrap">${etab}${sort}</span></div>
     ${n?gb8Grid(list):`<div class="gb8-empty" data-role="guide-empty"><b>Rien ne correspond exactement à ces choix.</b><p>Voici les idées les plus proches, avec l’écart. La carte cadeau reste possible pour tous les budgets.</p></div>
       <div class="crsrow h gc-crsrow" data-role="guide-near">${near.map(({o,d})=>gcCard(o).replace('<div class="gc-oc-foot">',`${d?`<p class="gb8-gap" data-role="gap">${gb8Gap(d)}</p>`:''}<div class="gc-oc-foot">`)).join('')}${gb8Carte()}</div>`}
   </section>
   ${gcHow()}`;
};
function gb8Url(){try{history.replaceState(null,'',gcB4Hash('gcoffrir'))}catch(e){}}
ACT.gb8Set=a=>{GB8[a.dataset.k]=a.dataset.v;render();gb8Url()};
ACT.gb8Occ=()=>{GB8.occOpen=true;render()};
ACT.gb8Clear=()=>{Object.assign(GB8,gb8Init());render();gb8Url()};
ACT.gb8Go=()=>{const el=$('#gb8Res');if(el&&el.scrollIntoView)el.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})};
ACT.gb8Carte=()=>{
  const a=GB8.budget?GC_BAMT[GB8.budget]:0, o=gcOffer('carte-cadeau');gcOpen('carte-cadeau');
  if(a){if(o.amounts.includes(a))GCS.amt=a;else{GCS.amt='libre';GCS.free=String(a)}render()}
};
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.gb8;if(!k)return;GB8[k]=e.target.value;render();if(k!=='sort')gb8Url()});
/* adresse partageable : #/boutique/offrir/<pour>/<budget> (« tout-le-monde », « tous-budgets » si vide) */
const _gcB4Hash8=gcB4Hash;
gcB4Hash=function(id){
  if(id==='gcoffrir'){
    if(!GB8.pour&&!GB8.budget)return '#/boutique/offrir';
    return '#/boutique/offrir/'+(GB8.pour?GC_PSLUG[GB8.pour]:'tout-le-monde')+(GB8.budget?'/'+GC_BSLUG[GB8.budget]:'');
  }
  return _gcB4Hash8(id);
};
const _gcB4Route8=gcB4Route;
gcB4Route=function(h){
  const m=/^#\/boutique\/offrir\/([a-z0-9-]+)(?:\/([a-z0-9-]+))?\/?$/.exec(h||'');
  if(!m)return _gcB4Route8(h);
  if(S.screen==='gcoffrir'&&gcB4Hash('gcoffrir')===h)return true;
  const p=Object.keys(GC_PSLUG).find(k=>GC_PSLUG[k]===m[1]), b=m[2]?Object.keys(GC_BSLUG).find(k=>GC_BSLUG[k]===m[2]):'';
  if((!p&&m[1]!=='tout-le-monde')||b===undefined){go('gcoffrir');toast('Ce lien de sélection n’est plus valable : choisissez à nouveau pour qui et votre budget.');return true}
  Object.assign(GB8,{pour:p||'',budget:b||''});go('gcoffrir');return true;
};
const _gcReset8=ACT.gcReset;
ACT.gcReset=a=>{Object.assign(GB8,gb8Init());_gcReset8(a)};
const _gcCtlB3_8=gcCtlB3;
gcCtlB3=function(){
  return _gcCtlB3_8()+`<hr><h4>Lot B8 · guide cadeaux (maquette ClickUp V2, 06/11)</h4>
    <ul data-role="ctl-b8"><li>« Pour qui » : 5 profils qui changent vraiment les idées. Golfeur et golfeuse réunis (les offres ne sont pas genrées) ; papa, maman et Secret Santa renvoient aux occasions et au budget.</li>
    <li>Champ « Pour qui » réglé au BO, section Classement de l’offre (lot A7, profils de démo identiques) ; « Un couple » se déduit du nombre de personnes.</li>
    <li>Débutant : seule l’initiation, un green fee sur La Mer demande un niveau. À confirmer par les golfs.</li>
    <li>Budgets : les 4 tranches sans chevauchement du lot B7, pas les montants « autour de » de la V2.</li>
    <li>Carrousel « Inspirations » non repris : les envies sont les 4 univers, la saison est la Boutique de Noël. Une troisième classification serait à tenir au CMS avec 11 offres seulement.</li>
    <li>Pas de visuel plein écran sous les choix : lisibilité et premier écran mobile. Favoris et comparaison de la V1 : hors maquette.</li>
    <li>Adresse : <code>#/boutique/offrir/&lt;pour&gt;/&lt;budget&gt;</code>. Pages indexables et textes SEO : au CMS.</li></ul>`;
};
Object.assign(window.__gc,{GB8,GC_POUR,GC_POUR_OF,gb8List,gb8Near,gb8Pour});

S=fresh();
go('site');

</script>
