.gtime.on i{color:var(--gold-light)}
.gtime.nx{border-color:var(--gold);background:var(--gold-soft)}
.gtime.nx i{color:var(--gold-dark);font-weight:500}
.gbar{position:sticky;bottom:14px;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:10px;
  background:var(--ink);color:#fff;border-radius:18px;padding:14px 14px 14px 22px;box-shadow:var(--shadow-lg)}
.gbar b{display:block;font-weight:500}
.gbar .mut{color:#c7bba8;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar > div{min-width:0}
.gbar .btn{background:var(--gold)}
.gbar .btn[disabled]{background:#4a4038;color:#9a8f80}
.fhead{display:flex;align-items:center;gap:12px;margin:4px 0 10px}
.fhead b{display:block;font-size:14.5px}
.fhead .mut{display:block}

.addp{display:flex;align-items:center;gap:14px;width:100%;padding:13px 0;border-top:1px dashed var(--line-2);text-align:left;color:var(--gold-dark)}
.addp .av{border:1.5px dashed var(--gold);background:var(--gold-soft);color:var(--gold-dark);font-size:18px}
.addp b{display:block;font-size:14.5px}
.addp small{display:block;font-size:12px;color:var(--g600);font-weight:400;margin-top:1px}
.addp:hover b{text-decoration:underline;text-underline-offset:4px}
.addp-off{padding:12px 0;border-top:1px dashed var(--line-2)}
.rm{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--g500);flex:none;text-align:center}
.rm:hover{background:var(--terra-soft);color:var(--terra)}

/* choix du golf : liste par région + carte cliquable */
.sheet.wide{width:min(1100px,100%);padding:0;overflow:hidden}
.gs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);height:min(780px,calc(100vh - 40px))}
.gs-l{padding:26px 26px 0;display:flex;flex-direction:column;min-height:0}
.gs-q{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:999px;padding:0 16px;height:46px;color:var(--g500);background:#fff;flex:none}
.gs-q:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.gs-q input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;color:var(--ink)}
.gs-list{overflow-y:auto;flex:1;margin:0 -10px;padding:0 10px 22px}
.gs-list::-webkit-scrollbar{width:0}
.gs-row{display:flex;align-items:center;gap:13px;width:100%;padding:11px 12px;border-radius:14px;text-align:left;transition:background .15s}
.gs-row:hover,.gs-row.hov{background:var(--gold-soft)}
.gs-row.on{background:var(--ink);color:#fff}
.gs-row.on small{color:#c7bba8}
.gs-row.on .tag.ol{background:rgba(243,234,213,.14);color:var(--gold-light)}
.gs-pin{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--gold-light);flex:none}
.gs-row.on .gs-pin{box-shadow:0 0 0 3px rgba(190,155,69,.4)}
.gs-t{flex:1;min-width:0}
.gs-t b{display:block;font-size:14.5px}
.gs-t small{display:block;font-size:12px;color:var(--g600);font-weight:400;margin-top:2px}
.gs-r{background:#FDFCF6;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.gmap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 18px 6px}
.gmap{container-type:size}
/* la boîte garde exactement le ratio de la carte : les pastilles restent calées */
.gmap-in{position:relative;width:min(100cqw,calc(100cqh * 1870 / 2000));aspect-ratio:1870/2000}
.gmap-in img{width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;width:26px;height:26px;transform:translate(-50%,-50%);border-radius:50%;z-index:1}
.hs i{position:absolute;inset:6px;border-radius:50%;transition:.15s}
.hs:hover i,.hs.hov i{box-shadow:0 0 0 5px rgba(190,155,69,.35)}
.hs.on{z-index:2}
.hs.on i{background:var(--ink);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--gold)}
.hs.on::after{content:"";position:absolute;inset:2px;border-radius:50%;border:2px solid var(--gold);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(1.8);opacity:0}}
.hs.dim i{background:rgba(253,252,246,.85)}
.hs-tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11.5px;white-space:nowrap;
  border-radius:999px;padding:5px 11px;opacity:0;pointer-events:none;transition:.15s}
.hs:hover .hs-tip,.hs.hov .hs-tip{opacity:1}
.gs-sel{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 22px;border-top:1px solid var(--line);background:#fff;flex:none}
.gs-sel > div{min-width:0}
.gs-sel b{display:block;font-size:17px;font-weight:500}
.gs-sel .mut{display:block}
.frame:has(> .stage[data-vp="mobile"]) .sheet.wide .gs,
.sheet.wide .gs.narrow{grid-template-columns:1fr;height:auto;max-height:80vh}
.frame:has(> .stage[data-vp="mobile"]) .sheet.wide{height:88%;max-height:88%}
.frame:has(> .stage[data-vp="mobile"]) .sheet.wide .gs{height:100%;max-height:none}
.frame:has(> .stage[data-vp="mobile"]) .gs-r{border-left:0;border-top:1px solid var(--line)}
.frame:has(> .stage[data-vp="mobile"]) .gmap{display:none}
.frame:has(> .stage[data-vp="mobile"]) .gs-l{padding:22px 18px 0}
.frame:has(> .stage[data-vp="mobile"]) .gs-sel{padding:14px 18px}
@media (max-width:760px){
  .sheet.wide .gs{grid-template-columns:1fr;height:min(700px,calc(100vh - 40px))}
  .sheet.wide .gmap{display:none}
  .sheet.wide .gs-r{border-left:0;border-top:1px solid var(--line)}
}

/* mes proches */
.pcard{padding:18px;display:flex;flex-direction:column;gap:12px}
.pcard .pc-f{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.pcard.add{border:1.5px dashed var(--gold);background:var(--gold-soft);box-shadow:none;align-items:center;justify-content:center;text-align:center;min-height:210px;gap:8px;transition:.15s}
.pcard.add:hover{background:var(--gold-light)}

/* fenêtre « panier vide » sous l'icône */
.appbar-in{position:relative}
.cartpop{position:absolute;top:calc(100% + 8px);right:32px;width:340px;max-width:calc(100% - 24px);background:#fff;border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow-lg);padding:18px;z-index:40;animation:fade .2s ease}
.cartpop::before{content:"";position:absolute;top:-7px;right:16px;width:12px;height:12px;background:#fff;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.cp-h{display:flex;gap:14px;align-items:flex-start}
.cp-h b{display:block;font-size:16px}
.cp-h .mut{display:block;margin-top:3px}
.cp-ic{width:42px;height:42px;border-radius:14px;background:var(--gold-light);color:var(--gold-dark);display:grid;place-items:center;flex:none}
.cp-l{display:grid;gap:4px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.cp-l button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-size:14px;text-align:left;color:var(--ink);transition:.15s}
.cp-l button svg{color:var(--gold-dark)}
.cp-l button:hover{background:var(--gold-soft)}

.gp-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:16px}
.gp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-dark));transition:width .3s}
.gp-sel{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.gchip{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:6px 6px 6px 14px;font-size:13px}
.gchip small{color:var(--gold-light);font-size:11px;font-weight:400}
.gchip button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#c7bba8;padding:0}
.gchip button:hover{background:rgba(255,255,255,.12);color:#fff}

/* créneaux de cours en mobile : bandeau de jours + un jour à la fois */
.grid > *,.two > *{min-width:0}
.wkm{display:none}
.wkm-days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -2px}
.wkm-days::-webkit-scrollbar{height:0}
.wkm-d{flex:none;width:62px;border:1px solid var(--line);border-radius:14px;padding:8px 0;background:#fff;text-align:center;line-height:1.2}
.wkm-d small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--g500)}
.wkm-d b{display:block;font-size:18px;font-weight:500;margin:2px 0}
.wkm-d i{display:block;font-style:normal;font-size:9.5px;color:var(--gold-dark)}
.wkm-d.on{background:var(--ink);border-color:var(--ink);color:#fff}
.wkm-d.on small{color:#c7bba8}.wkm-d.on i{color:var(--gold-light)}
.wkm-d:disabled{opacity:.45}
.wkm-t{font-size:14px;font-weight:500;margin:14px 0 10px}
.wkm-pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* mes proches sur le parcours */
.proxbar{display:flex;align-items:center;gap:14px;margin:-4px 0 16px;padding:10px 12px 10px 18px;background:#fff;border:1px solid var(--line);border-radius:16px}
.proxbar .sw{flex:1;padding:0;gap:14px}
.proxbar .pb-t{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.proxbar .pb-t b{font-size:14px}
.proxbar.none{opacity:.7}
.proxbar.on{border-color:var(--gold);background:var(--gold-soft)}
.pb-av{display:flex}
.pb-av .gav{position:static;margin-left:-6px;width:26px;height:26px;font-size:9.5px;box-shadow:0 0 0 2px #fff}
.gav{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--gold-light);font-size:8.5px;font-weight:600;letter-spacing:.3px;flex:none}
.prox{padding:18px 20px;margin-bottom:22px;border-color:var(--gold-light)}
.prox-h{margin-bottom:6px}
.prox-h .mut{display:block;margin-top:4px}
.prox-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.prox-row:nth-child(2){border-top:0}
.pr-t{flex:1;min-width:0}
.pr-t b{display:block;font-size:14.5px}
.pr-a{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right;max-width:52%}
.gtime.pro{position:relative;border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);padding-top:11px}
.gtime.pro .gav{position:absolute;top:-9px;right:-7px;box-shadow:0 0 0 2px #fff}
.gtime.pro i{color:var(--ink);font-weight:500}
.gtime.pro.full{opacity:.55;cursor:not-allowed;box-shadow:none;border-style:dashed}
.gtime.pro.full i{color:var(--g500);font-weight:400}
.gtime.on.pro .gav{background:var(--gold);color:#fff}
.day{position:relative}
.ddot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #fff}
.day.on .ddot{box-shadow:0 0 0 2px var(--ink)}
.joinw{align-items:center}
.sharec{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 20px;margin-bottom:18px}
.sharec > div:first-child{flex:1;min-width:240px}
.sharec .mut{display:block;margin-top:3px}

/* recherche : 4e segment « Mes proches » (connecté) */
.sbar.sbar4{grid-template-columns:minmax(0,1.1fr) max-content minmax(0,1.2fr) auto}
.sbar.sbar4 .sbf{padding:16px 16px}
/* connecté : 4 segments ne tiennent plus sur une ligne sous ~1180 px → 2 × 2 */
@media (max-width:1180px) and (min-width:641px){
  .sbar.sbar4{grid-template-columns:minmax(0,1fr) max-content}
  .sbar.sbar4 .sbf:nth-child(n+3){border-top:1px solid var(--line)}
  .sbar.sbar4 .sbf:nth-child(3){border-left:0}
  .sbar.sbar4 button.sbf:first-child{border-radius:22px 0 0 0}
}
.sbf-prox .sbv b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:#fff;font-size:12px;padding:0 6px}
.sbf-prox .sw{gap:12px;justify-content:flex-start}
.sbf-prox .sw .sbv{flex:1}
/* inscrits sur un créneau */
.occ-list{background:#fff;border:1px dashed var(--line-2);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.occ-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.occ-list .sbl + .occ-row{border-top:0}
.occ-row .av{width:30px;height:30px;font-size:10px}
.occ-row .av.mask{background:var(--sand);color:var(--g500)}
.occ-row b{display:block;font-size:13.5px}
.occ-row .mut{display:block}
.occ-none{margin:0 0 12px}

/* ══════════ Mobile (conteneur) ══════════ */

  .two{grid-template-columns:1fr}
  .aside{position:static}
  .g3{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(7,96px);overflow-x:auto;padding-bottom:4px}
  .quick .card{grid-template-columns:1fr}

  .sbar .sbf:nth-child(2){border-left:0}
  .sbar.sbar4 .sbf-prox{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
  .sbar.sbar4{grid-template-columns:1fr 1fr}

}

  .hello{gap:12px}
  .hero{min-height:520px}
  .hero::before{background:linear-gradient(180deg,rgba(20,15,10,.55) 0%,rgba(20,15,10,.5) 45%,rgba(20,15,10,.88) 100%)}
  .hero .eyebrow{letter-spacing:2px}

  .searchbar{grid-template-columns:1fr 1fr}

  .prow{flex-wrap:wrap;row-gap:8px}

  .prow .pp .stl{margin-top:4px}

  .gbar{padding:12px 12px 12px 16px;bottom:10px}
  .px{width:34px;height:34px}
  .sbf + .sbf{border-left:0;border-top:1px solid var(--line)}
  button.sbf{border-radius:22px 22px 0 0}

  .calpop{left:-1px;right:-1px;width:auto;max-width:none}

  .searchbar .sb-f:nth-child(2){box-shadow:none}
  .scr-head .node{display:none!important}
  .crs-h{flex-wrap:wrap;gap:0}
  .crs-img{width:100%;min-height:130px}
  .crs-t{padding:16px 20px 4px;flex:1 1 100%}
  .crs-h .price{flex:1 1 100%}
  .pbar{padding:10px 12px 10px 14px;border-radius:14px;gap:10px;margin-bottom:16px;flex-wrap:nowrap;font-size:12.5px}
  .pbar .av{display:none}
  .pbar{padding:14px 16px;gap:12px}
  .pbar .pb-long{display:none}
  .pbar .pb-short{display:block;flex:1;min-width:0}
  .pbar .btn{padding:8px 12px;font-size:10px;flex:none}
  .pbar .lnk{font-size:12px;flex:none}
  .pbar .stl{white-space:normal}
  .crs-h .price{padding:0 20px 14px;text-align:left}
  .crs-hn{display:block;margin-top:2px}

.sf-brand .sh-lang{margin:0;border-color:var(--g600)}
.sf-brand .sh-lang button{color:var(--g300)}
.sf-brand .sh-lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.sf-col summary{list-style:none;font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold-light);margin-bottom:10px;pointer-events:none}
.sf-col summary::-webkit-details-marker{display:none}
.sf-col button,.sf-col span{display:block;text-align:left;font-size:13px;padding:4px 0;color:var(--g200)}
.sf-col button:hover{color:var(--paper);text-decoration:underline;text-underline-offset:3px}
.gb-nl.sf-nl{max-width:1244px;margin:0 auto;padding:36px 32px 32px;border:0;border-bottom:1px solid rgba(255,255,255,.12);border-radius:0;background:none;color:var(--paper);grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:36px}
.sf-nlt{margin:0;font-size:20px;font-weight:400;color:var(--paper)}
.gb-nl.sf-nl p{color:var(--g300)}
.sf-nl .field span{color:var(--gold-light)}
.sf-nl .gb-chk{color:var(--g300)}
.sf-nl .btn{background:var(--gold);color:var(--paper)}
.sf-nl .btn:hover{background:var(--gold-dark)}
.sf-nl .gc-err{color:var(--gold-light)}
.sf-pay{font-size:12.5px;line-height:1.55;margin:0 0 8px;color:var(--g300)}
@container (max-width:900px){
  .sf-in{grid-template-columns:minmax(0,1fr);gap:0;padding:28px 16px 36px}
  .sf-brand{margin-bottom:12px}
  .sf-col{border-top:1px solid var(--g700)}
  .sf-col summary{pointer-events:auto;cursor:pointer;padding:14px 0;margin:0}
  .sf-col > div{padding-bottom:12px}
}
/* briques de page */
.gb-h2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:40px 0 16px}
.gb-h2 .h2{font-size:24px;font-weight:300}
.gb-seo{max-width:760px;margin:28px 0 8px}
.gb-seo .h2{font-size:20px;font-weight:400;margin-bottom:6px}
.gb-seo p{font-size:14.5px;line-height:1.6;color:var(--ink-soft);margin:0}
.gb-ptitle{margin:4px 0 8px}
.gb-ptitle .sub{margin-top:6px;max-width:640px}
.gb-band{min-height:220px}
.gb-band .h1 b{font-weight:500}
.gb-bandph{position:absolute;inset:0;display:grid;place-items:center;color:var(--gold-light);background:linear-gradient(135deg,var(--g800),var(--ink))}
.gb-bandph .gc-cph{font-size:11px;opacity:.7;align-self:start;margin-top:22px}
/* hero commercial */
.gb-hero{position:relative;border-radius:22px;overflow:hidden;min-height:470px;display:flex;align-items:flex-end;background:var(--ink)}
.gb-hero-img{position:absolute;inset:0;background-size:cover;background-position:center}
.gb-hero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(27,21,15,.86),rgba(27,21,15,.2) 70%)}
.gb-hero-tx{position:relative;padding:40px 44px;max-width:620px;color:var(--paper)}
.gb-hero-tx .eyebrow{color:var(--gold-light)}
.gb-hero-tx .h1{color:var(--paper);font-size:46px}
.gb-hero-tx .sub{color:var(--g100);margin-top:10px;font-size:16px;line-height:1.55}
.gb-ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.gb-hero .btn{background:var(--paper);color:var(--ink)}
.gb-hero .btn.sec{background:transparent;color:var(--paper);border:1.5px solid rgba(255,255,255,.7)}
@container (max-width:640px){
  .gb-hero{display:block;min-height:0;background:none;border-radius:0;margin:-30px -16px 0}
  .gb-hero-img{position:relative;height:auto;aspect-ratio:16/10;max-height:none;min-height:0}   /* 03/11 : hero moins haut en mobile (≈ 250 px sur 402 px) */
  .gb-hero-img::after{display:none}
  .gb-hero-tx{padding:22px 16px 4px;color:var(--ink)}
  .gb-hero-tx .eyebrow{color:var(--gold-dark)}
  .gb-hero-tx .h1{color:var(--ink);font-size:32px}
  .gb-hero-tx .sub{color:var(--ink-soft);font-size:15px}
  .gb-hero .btn{background:var(--ink);color:var(--paper);width:100%}
  .gb-hero .btn.sec{background:var(--paper);color:var(--ink);border-color:var(--line-2)}
}
/* univers */
.gb-univ{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.gb-utile{position:relative;height:230px;border-radius:16px;overflow:hidden;background:var(--sand) center/cover;display:flex;align-items:flex-end;text-align:left;color:var(--paper)}
.gb-utile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(27,21,15,.75))}
.gb-utile .gc-cph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;color:var(--gold-dark);font-size:10px;text-align:center}
.gb-utile > span:last-child{position:relative;z-index:1;padding:16px}
.gb-utile b{display:block;font-size:20px;font-weight:400}
.gb-utile small{font-size:12.5px;opacity:.9}
.gb-utile:hover{filter:brightness(1.06)}
.gb-utile:focus-visible,.gb-dcard:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@container (max-width:760px){.gb-univ{grid-template-columns:repeat(2,minmax(0,1fr))}.gb-utile{height:170px}}
/* temps fort */
.gb-noel{margin-top:40px;border-radius:20px;background:var(--ink);padding:30px 34px;color:var(--paper)}
.gb-noel .eyebrow{color:var(--gold-light)}
.gb-noel .h2{font-size:26px;font-weight:300;color:var(--paper)}
.gb-noel p{margin:6px 0 16px;color:var(--g200);font-size:14.5px}
.gb-noel .btn{background:var(--gold);color:var(--paper)}
.gb-noel .btn:hover{background:var(--gold-dark)}
/* 03/11 : temps fort Noël de l'accueil, visuel cliquable à gauche, texte et deux actions à droite (wireframe) */
.gb-tf{margin-top:40px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center}
.gb-tf-img{display:block;width:100%;aspect-ratio:16/10;border:0;padding:0;border-radius:20px;background:var(--g100) center/cover no-repeat;cursor:pointer;transition:opacity .2s}
.gb-tf-img:hover{opacity:.92}
.gb-tf-tx .h2{font-size:30px;line-height:1.15;margin:6px 0 0}
.gb-tf-tx p{margin:12px 0 22px;color:var(--ink-soft);font-size:15px;line-height:1.6}
.gb-tf .gb-ctas{margin-top:0}
@media (max-width:760px){.gb-tf{grid-template-columns:1fr;gap:20px}.gb-tf-tx .h2{font-size:24px}.gb-tf .gb-ctas .btn{width:100%}}
/* rails */
.gb-railw{position:relative}
.crsrow.h.gc-crsrow.gc-rail{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px) / 3);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:22px;scrollbar-width:thin}
.crsrow.h.gc-crsrow.gc-rail > .crs,.crsrow.h.gc-crsrow.gc-rail > .gc-oc{scroll-snap-align:start}   /* 03/11 : 22 px entre cartes et barre de défilement */
.gb-rbtn{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:38px;height:38px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow)}
.gb-rbtn.prev{left:-14px}.gb-rbtn.next{right:-14px}
.gb-rbtn:hover{border-color:var(--gold)}
.gb-drail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 48px) / 5);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.gb-dcard{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--sand) center/cover;scroll-snap-align:start;display:flex;align-items:flex-end;text-align:left;color:var(--paper)}
.gb-dcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(27,21,15,.8))}
.gb-dph{position:absolute;inset:0;display:grid;place-items:center;color:var(--gold-dark)}
.gb-dph svg{width:28px;height:28px}
.gb-dtx{position:relative;z-index:1;padding:14px}
.gb-dtx small{display:block;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;opacity:.85}
.gb-dtx b{display:block;font-size:18px;font-weight:400;margin:2px 0}
.gb-dtx i{font-style:normal;font-size:12.5px;opacity:.9}
@container (max-width:900px){.crsrow.h.gc-crsrow.gc-rail{grid-auto-columns:calc((100% - 18px) / 2)}.gb-drail{grid-auto-columns:calc((100% - 24px) / 3)}}
@container (max-width:560px){
  .crsrow.h.gc-crsrow.gc-rail{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:84%;margin-right:-16px;padding-right:16px}
  .gb-drail{grid-auto-columns:62%;margin-right:-16px;padding-right:16px}
  .gb-rbtn{display:none}
}
/* budgets */
.gb-budg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gb-budg button{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:18px;text-align:left}
.gb-budg button:hover{border-color:var(--gold)}
.gb-budg b{display:block;font-size:17px;font-weight:400}
.gb-budg small{font-size:12.5px;color:var(--g500)}
@container (max-width:760px){.gb-budg{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* carte cadeau */
.gb-carte{margin-top:44px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;background:var(--gold-soft);border-radius:20px;padding:30px 34px}
.gb-carte .h2{font-size:26px;font-weight:300}
.gb-carte p{margin:6px 0 14px;color:var(--ink-soft);font-size:14.5px;line-height:1.55}
.gb-amts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.gb-carte-img{aspect-ratio:1.6;border-radius:16px;background-size:cover;background-position:center;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.gb-carte-img::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(27,21,15,.75),rgba(27,21,15,.15))}
.gb-carte-img span{position:absolute;left:20px;bottom:18px;color:var(--paper);font-size:11px;letter-spacing:2.2px;text-transform:uppercase}
.gb-carte-img b{display:block;font-size:26px;letter-spacing:.5px;text-transform:none;font-weight:300}
@container (max-width:760px){.gb-carte{grid-template-columns:minmax(0,1fr);padding:22px 18px}.gb-carte-img{order:-1}}
/* comment ça marche, réassurance, newsletter */
.gb-steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gb-steps li{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}
.gb-steps b{display:block;font-size:16px;font-weight:500;margin:10px 0 4px}
.gb-steps p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.gb-n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:13px}
.gb-reas{list-style:none;padding:22px 0 0;margin:36px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.gb-reas li{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:start}
.gb-reas svg{grid-row:span 2;color:var(--gold-dark)}
.gb-reas b{font-size:14px;font-weight:500}
.gb-reas small{font-size:12.5px;color:var(--g500)}
@container (max-width:760px){.gb-steps{grid-template-columns:minmax(0,1fr)}.gb-reas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gb-nl{margin-top:40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px 32px}
.gb-nl p{margin:6px 0 0;font-size:14px;color:var(--ink-soft);line-height:1.55}
.gb-chk{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--ink-soft);margin:0 0 12px}
.gb-chk input{margin-top:2px;accent-color:var(--gold)}
.gb-nlok{margin:0;padding:14px 16px;border-radius:12px;background:var(--green-soft);color:var(--green);font-size:14px}
@container (max-width:760px){.gb-nl{grid-template-columns:minmax(0,1fr);padding:22px 18px;gap:14px}.gb-nl .btn{width:100%}}
/* FAQ */
.gb-faq details{border-bottom:1px solid var(--line);padding:14px 0}
.gb-faq summary{cursor:pointer;font-size:15px;color:var(--ink);list-style:none;display:flex;justify-content:space-between;gap:12px}
.gb-faq summary::after{content:"+";color:var(--gold-dark);font-size:18px;line-height:1}
.gb-faq details[open] summary::after{content:"−"}
.gb-faq p{margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--ink-soft)}
/* J'ai un bon cadeau */
.gb-boncard{margin-top:16px;padding:18px}
.gb-boncard .h2{margin-bottom:4px}
.gb-bonst{display:inline-block;margin:10px 0 6px;padding:5px 12px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:13px}
.gb-bonst.off{background:var(--terra-soft);color:var(--terra)}
/* destinations */
.gb-loctools{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-top:20px}
.gb-loctools .chips{margin:0}
.gb-view{display:none;border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.gb-view button{padding:7px 14px;border-radius:999px;font-size:13px;color:var(--g500)}
.gb-view button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.gb-locg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:16px;align-items:start}
.gb-loclist .sect{margin:18px 0 8px}
.gb-loclist .sect:first-child{margin-top:0}
.gb-lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper);margin-bottom:8px;transition:border-color .15s}
.gb-lrow.on,.gb-lrow.hov{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.gb-lpin{color:var(--gold-dark)}
.gb-lt b{display:block;font-size:15px;font-weight:500}
.gb-lt small{font-size:12.5px;color:var(--g500)}
.gb-ln{font-size:12.5px;color:var(--g600);white-space:nowrap}
.gb-map{position:sticky;top:140px}
.gb-map .gmap{height:520px;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:18px}
.gb-map .hs i{background:var(--gold)}
.gb-map .hs.hov i{box-shadow:0 0 0 5px rgba(190,155,69,.35)}
.gb-map .hs.hov .hs-tip{opacity:1}
.gb-mapcard{margin-top:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.gb-mapcard small{grid-column:1;font-size:12.5px;color:var(--g500)}
.gb-mapcard .btn{grid-column:2;grid-row:1/3}
.gb-maphint{margin-top:10px;font-size:13px}
@container (max-width:760px){
  .gb-loctools{flex-direction:column}
  .gb-loctools .chips{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px}
  .gb-view{display:inline-flex}
  .gb-locg{grid-template-columns:minmax(0,1fr)}
  .gb-loc[data-view="liste"] .gb-map,.gb-loc[data-view="carte"] .gb-loclist{display:none}
  .gb-map{position:static}
  .gb-map .gmap{height:440px}
  .gb-lrow{grid-template-columns:auto minmax(0,1fr);row-gap:8px}
  .gb-lrow .gb-ln{grid-column:2}
  .gb-lrow .btn{grid-column:1/-1}
}
/* page golf */
.gb-etab{margin-top:36px;padding:22px 24px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.gb-etab .h2{margin-bottom:4px}
.gb-etab p{margin:2px 0 0}
.gb-etab .lnk{display:inline-flex;align-items:center;gap:6px}
/* aide au choix */
.gb-aide{margin-top:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 32px;align-items:start}   /* 03/11 : trois questions côte à côte */
.gb-aide > .gb-astep,.gb-aide > .gb-ares{grid-column:1/-1}
.gb-aq{border:0;padding:0;margin:0 0 22px;min-width:0}
.gb-aq .chip{padding:8px 14px}
@container (max-width:900px){.gb-aide{grid-template-columns:minmax(0,1fr)}}
.gb-aq legend{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:400;margin-bottom:12px;padding:0}
.gb-aq .chips{margin:0}
.gb-astep{display:none}
.gb-ares{border-top:1px solid var(--line);margin-top:8px}
.gb-ares .gb-h2{margin-top:24px}
@container (max-width:640px){
  .gb-aq{display:none}.gb-aq.cur{display:block}
  .gb-ares{display:none;border-top:0}.gb-ares.cur{display:block}
  .gb-astep{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 8px;font-size:13px;color:var(--g500)}
  .gb-aide[data-step="3"] .gb-astep{margin-bottom:0}
}
.gb-res{margin-top:22px}
/* ═════════ Bons cadeaux · lot B5 : cartes et fiche produit ═════════ */
/* cartes */
.gb-cbadge{position:absolute;top:12px;right:12px;z-index:1;font-size:10.5px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--ink);color:var(--gold-light)}
.gb-cbadge.off{background:var(--paper);color:var(--terra);box-shadow:inset 0 0 0 1px var(--terra)}
.crs-img{position:relative}
.gc-offer .gc-cprom{margin:8px 0 0;font-size:13.5px;line-height:1.45;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gc-offer .gc-cmeta{display:flex;align-items:center;gap:6px;margin:8px 0 0;font-size:12.5px;color:var(--g600)}
.gc-offer .gc-cmeta svg{color:var(--gold-dark)}
.gc-offer .gc-cinc{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--g600)}
.gc-offer .gc-cinc li{position:relative;padding-left:12px}
.gc-offer .gc-cinc li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.gc-cpp{display:block;font-size:11.5px;color:var(--g500);margin-top:2px}
.gc-go.gc-go-t{width:auto;height:auto;min-height:40px;padding:0 12px 0 14px;gap:8px;display:inline-flex;align-items:center;font-size:12.5px;letter-spacing:.3px;white-space:nowrap}
.gc-offer.gb-off .crs-img{filter:grayscale(.6)}
.gc-offer.gb-off .gc-cprice b{color:var(--g500);text-decoration:line-through;text-decoration-thickness:1px}
/* fiche : prix par personne, bloc « Votre expérience comprend » */
.gb-pp{margin:4px 0 0;font-size:13px;color:var(--g500)}
.gb-comp{margin-top:18px;padding:16px 16px 12px;border-radius:14px;background:var(--cream);border:1px solid var(--line)}
.gb-comph{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-dark);font-weight:500;margin:0 0 10px}
.gb-comp ul{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.gb-comp li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.gb-comp li svg{flex:none;margin-top:2px;color:var(--gold-dark)}
.gb-comp li b{display:block;font-weight:500}
.gb-comp li small{display:block;font-size:12.5px;color:var(--g500);margin-top:1px}
.gb-comp .gb-inc,.gb-comp .gb-exc,.gb-comp .gb-sup{color:var(--g600);font-size:12.5px}
.gb-comp .gb-exc svg{color:var(--g400)}
/* onglets (accordéon en mobile) */
.gb-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.gb-tabs button{padding:12px 14px;font-size:14px;color:var(--g500);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.gb-tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.gb-tabs button:focus-visible,.gb-acc:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.gb-tp{display:none}
.gb-tp.on{display:block}
.gb-acc{display:none}
.gb-h3{font-size:15px;font-weight:500;margin:22px 0 10px}
.gb-ld{display:block;font-size:13px;color:var(--ink-soft)}
.gb-incx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:6px}

/* ═════════ Tarifs selon le statut ═════════
   Règle unique : quand une personne cumule plusieurs statuts, le tarif le plus
   avantageux s'applique — jamais de cumul de remises entre statuts. */
/* Retour du 29/09 : price yield — le prix d'un départ dépend de son heure.
   Tranches hypothétiques (à caler avec le revenue manager) : tôt le matin
   −15 %, créneaux recherchés du matin +5 % en semaine / +15 % le week-end,
   milieu de journée au tarif de base, twilight −25 %. Sans heure : tarif de base. */
const YIELD=[{to:'08:30',k:.85,n:'Tôt le matin'},{to:'11:30',k:1.05,kwe:1.15,n:'Heures prisées'},{to:'15:00',k:1,n:'Tarif de base'},{to:'99:99',k:.75,n:'Twilight'}];
const yBand=t=>YIELD.find(y=>t<y.to);
const yieldK=(t,k)=>{if(!t)return 1;const y=yBand(t);return isWe(k)&&y.kwe?y.kwe:y.k};
function gfPub(c,k,t){const b=c.p+(isWe(k)?c.we:0);return t?Math.round(b*yieldK(t,k)):b}
function gfPrice(c,k,sts,t){
  const base=gfPub(c,k,t);let best={p:base,st:null};
  (sts||[]).forEach(s=>{
    let p=base;
    if(s==='abonne')p=c.site?base*.6:c.id==='mer'?(c.h9?30:60):0;
    else if(s==='reseau')p=base*.6;
    else if(s==='jeune')p=base*.5;
    /* Loisir 5/7 : Forêt & Manoir inclus en semaine (quota de 30 GF/an suivi dans l'espace), La Mer −30 % en semaine, rien le week-end */
    else if(s==='loisir')p=c.site||isWe(k)?base:c.id==='mer'?base*.7:0;
    else if(s==='licencie')p=base*.7;
    p=Math.round(p);
    if(p<best.p)best={p,st:s};
  });
  return {...best,pub:base};
}
const LK={abonne:.8,reseau:.9,jeune:.7,loisir:.9};
function lessonPrice(base,sts){
  let best={p:base,st:null};
  (sts||[]).forEach(s=>{if(LK[s]){const p=Math.round(base*LK[s]);if(p<best.p)best={p,st:s}}});
  return {...best,pub:base};
}
function stagePrice(s,sts){
  if(s.kid)return {p:s.p,st:null,pub:s.p};
  const k={abonne:.9,jeune:.8};let best={p:s.p,st:null};
  (sts||[]).forEach(x=>{if(k[x]){const p=Math.round(s.p*k[x]);if(p<best.p)best={p,st:x}}});
  return {...best,pub:s.p};
}
/* options : tarif d'UN joueur selon SON statut. Abonné Le Touquet :
   voiturette (sa place) et seau inclus dans la cotisation, chariot à 10 €. */
function optPrice(o,c,sts){
  const base=c&&c.nine&&o.p9!=null?o.p9:o.p;
  if((sts||[]).includes('abonne')&&o.pa!=null&&!(c&&c.site))return {p:o.pa,pub:base,st:'abonne'};
  return {p:base,pub:base,st:null};
}
/* Répartit les options d'un départ entre ses joueurs : ceux pour qui
   l'option est incluse ou remisée la reçoivent d'abord, les autres paient
   le prix public. Voiturette : pas de notion de place — elle se paie
   entière, sauf si un abonné choisit de la prendre avec son abonnement
   (une voiturette par abonné, case à décocher dans les options). */
function optSplit(op,c,ps,q,o){
  const L=ps.map(x=>({...x,x:optPrice(op,c,x.pi.st)})), perk=L.filter(x=>x.x.p<x.x.pub);
  const order=[...perk,...L.filter(x=>!(x.x.p<x.x.pub))], units=[];
  if(op.per==='voit'){
    const pub=optPrice(op,c,[]).pub, off=(o&&o.noAbo)||{}, H=perk.filter(x=>!off[x.i]);
    for(let v=0;v<q;v++){const h=H[v];
      units.push(h?{who:h.pi.n,you:h.pi.you&&!h.pi.anon,p:h.x.p,pub,st:h.x.st}:{who:null,p:pub,pub,st:null})}
  } else {order.slice(0,q).forEach(x=>units.push({who:x.pi.n,you:x.pi.you&&!x.pi.anon,p:x.x.p,pub:x.x.pub,st:x.x.p<x.x.pub?x.x.st:null}));
    const pub=optPrice(op,c,[]).pub;for(let v=order.length;v<q;v++)units.push({who:null,p:pub,pub,st:null})}
  return units;
}
/* compétition : droit de jeu + green fee du jour ; l'abonné ne paie que le droit de jeu */
function compPrice(cp,sts){
  sts=sts||[];
  const c=crs(cp.crs), g=gfPrice(c,cp.date,sts);
  const gf=sts.includes('abonne')&&!c.site?0:g.p;
  const dj=sts.includes('jeune')&&cp.djJ?cp.djJ:cp.dj;
  const pubT=cp.dj+gfPub(c,cp.date);
  const st=sts.includes('abonne')&&!c.site?'abonne':(g.st||(dj<cp.dj?'jeune':null));
  return {dj,gf,p:dj+gf,pub:pubT,gfPub:gfPub(c,cp.date),st};
}
/* affichage d'un prix avec le prix public barré */
function pr(x,opt){
  opt=opt||{};
  const inc=x.p===0&&x.pub>0;
  const main=inc?'Inclus':eur(x.p);
  return (x.p<x.pub?`<span class="was">${eur(x.pub)}</span>`:'')+main
    +(opt.small?`<small>${opt.small}</small>`:'')
    +(x.st&&!opt.nost?`<br><span class="stl">Tarif ${ST[x.st].n}</span>`:'');
}

const telFmt=(n,cc)=>{const h=n.length%2?(cc==='32'&&n.length===9?3:1):0;return ((h?n.slice(0,h)+' ':'')+n.slice(h).replace(/(\d{2})(?=\d)/g,'$1 ')).trim()};

/* champ téléphone : liste des indicatifs + numéro */
function telField(id,val,cc){
  const x=val?telSplit(val,cc||'33'):{cc:cc||'33',nat:''}, c=ccOf(x.cc);
  /* fermé, le sélecteur n'affiche que « FR +33 » ; la liste ouverte garde le nom du pays */
  return `<div class="telf"><label class="telcc"><span id="${id}CcV">${c[2]} +${c[0]}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    <select id="${id}Cc" aria-label="Indicatif pays">${CC.map(([k,n,iso])=>`<option value="${k}" ${k===c[0]?'selected':''}>${iso} +${k} · ${n}</option>`).join('')}</select></label>
    <input id="${id}" type="tel" value="${x.nat?telFmt(x.nat,c[0]):''}" placeholder="${c[4]}" autocomplete="tel-national"></div>`;

/* si l'on tape « 0032… » ou « +32… » dans le numéro, la liste suit */
function bindTel(id,cb){const i=$('#'+id), s2=$('#'+id+'Cc');if(!i||!s2)return;
  const sync=()=>{const x=telSplit(i.value,s2.value);if(!x.bad){if(/^(\+|00)/.test(i.value.trim()))s2.value=x.cc;i.value=x.nat?telFmt(x.nat,s2.value):''}
    const c=ccOf(s2.value);i.placeholder=c[4];const v=$('#'+id+'CcV');if(v)v.textContent=c[2]+' +'+c[0];cb&&cb(i.value,s2.value)};

function simCart(st){
  const bak=S.user;PROFILES.__sim=P({id:'__sim',n:'Vous',st,partners:[]});S.user='__sim';

function licCard(a){
  const head=`<b>Licence ${a.lic} reconnue</b> · index ${fidx(a.idx)} · certificat médical valable jusqu'au ${fdm(a.cert)} 2027.`;
  if(!S.cart.length||me())return `<div class="alert soft" style="margin-top:-4px"><span class="ic">✓</span><div>${head}<br>Le tarif Licencié FFGolf vous sera appliqué dès la création de votre compte.</div></div>`;
  const before=cartTotals(), X=simCart(newSt(a)), gain=Math.round((before.sub-before.promo-(X.T.sub-X.T.promo))*100)/100;
  const mine=X.D.st.filter(g=>g.who==='Vous (vous)'||g.who==='Vous');
  return `<div class="alert soft lic-gain" style="margin-top:-4px"><span class="ic">✓</span><div>${head}

}

function createAccount(){

  if(!(a.ln||'').trim())e.ln='Indiquez votre nom.';
  if(!mailOk(a.mail))e.mail=a.mail?'Cette adresse e-mail n\'est pas valide (ex. vous@exemple.fr).':'Indiquez votre adresse e-mail.';
  if(!telOk(a.tel,a.telCc))e.tel=a.tel?`Ce numéro n'est pas valide pour ${ccOf(a.telCc||'33')[1]} (ex. ${ccOf(a.telCc||'33')[4]}).`:'Indiquez votre numéro de téléphone.';

  if(!pwOk(a.pw))e.pw=a.pw?'Le mot de passe ne respecte pas encore toutes les règles.':'Choisissez un mot de passe.';

}

/* ═════════ Choix du golf : liste par région + carte cliquable ═════════
   Coordonnées des pastilles en pixels de la carte (1870 × 2000). Cleydael,
   en Belgique, n'est pas sur la carte : il reste dans la liste. */
const MAPW=1870, MAPH=2000;
/* Provence et Riviera sont deux régions distinctes (demande client du 21/09/2026) */
const REGIONS=['Côte d\'Opale','Île-de-France','Côte Landaise','Provence','Riviera — Côte d\'Azur','Belgique'];
const GOLFS=[
  {id:'touquet',reg:0,n:'Le Touquet Golf Resort',v:'Le Touquet-Paris-Plage (62)',d:'3 parcours · 45 trous',x:840,y:387,live:true},
  {id:'hardelot',reg:0,n:'Golf d\'Hardelot',v:'Neufchâtel-Hardelot (62)',d:'2 parcours · 36 trous',x:847,y:350},
  {id:'yvelines',reg:1,n:'Domaine de la Couharde',v:'La Queue-lez-Yvelines (78)',d:'2 parcours · 27 trous',x:816,y:590},
  {id:'moliets',reg:2,n:'Golf de Moliets',v:'Moliets-et-Maa (40)',d:'2 parcours · 27 trous',x:447,y:1380},
  {id:'seignosse',reg:2,n:'Golf de Seignosse',v:'Seignosse (40)',d:'18 trous',x:441,y:1416},
  {id:'servanes',reg:3,n:'Golf de Servanes',v:'Mouriès (13) · Alpilles',d:'18 trous',x:1150,y:1492},
  {id:'saintebaume',reg:3,n:'Golf Sainte Baume',v:'Nans-les-Pins (83) · Sainte-Baume',d:'18 trous',x:1291,y:1537},
  {id:'salette',reg:3,n:'Golf Bastide de la Salette',v:'Marseille (13)',d:'18 trous',x:1213,y:1546},
  {id:'opio',reg:4,n:'Opio-Valbonne Golf Resort',v:'Opio (06) · Le Mas de la Bégude',d:'18 trous · hôtel & spa',x:1444,y:1471},
  {id:'roquebrune',reg:4,n:'Golf de Roquebrune',v:'Roquebrune-sur-Argens (83)',d:'18 trous',x:1410,y:1530},
  {id:'grandebastide',reg:4,n:'Golf de la Grande Bastide',v:'Châteauneuf-Grasse (06)',d:'18 trous',x:1433,y:1497},
  {id:'cleydael',reg:5,n:'Cleydael Golf & Country Club',v:'Aartselaar · Anvers',d:'18 trous'}];
const golf=id=>GOLFS.find(x=>x.id===id);
function siteSheet(){
  const sel=S.siteSel||'touquet', q=(S.siteQ||'').trim().toLowerCase();
  const match=x=>!q||(x.n+' '+x.v+' '+REGIONS[x.reg]).toLowerCase().includes(q);
  const G=golf(sel);
  return `<div class="gs">
    <div class="gs-l">
      ${shead('Choisir un golf')}
      <p class="sub" style="margin:2px 0 14px">12 golfs de la Collection, en France et en Belgique.</p>
      <label class="gs-q"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
        <input id="gsQ" placeholder="Rechercher un golf, une ville…" value="${S.siteQ||''}" autocomplete="off"></label>
      <div class="gs-list">${REGIONS.map((r,ri)=>{const items=GOLFS.filter(x=>x.reg===ri);
        return `<div class="gs-reg" data-reg="${ri}"><div class="sect" style="margin:16px 0 8px">${r}</div>
          ${items.map(x=>`<button class="gs-row ${x.id===sel?'on':''}" data-act="siteSel" data-id="${x.id}" data-g="${x.id}" ${match(x)?'':'hidden'}>
            <span class="gs-pin"></span><span class="gs-t"><b>${x.n}</b><small>${x.v} · ${x.d}</small></span>
            ${x.id===(S.site||'touquet')?'<span class="tag ol">Actuel</span>':''}</button>`).join('')}</div>`}).join('')}
        <p class="mut gs-none" hidden>Aucun golf ne correspond à cette recherche.</p></div>
    </div>
    <div class="gs-r">
      <div class="gmap"><div class="gmap-in"><img src="${MAPIMG}" alt="Carte des golfs de la Collection" draggable="false">
        ${GOLFS.filter(x=>x.x).map(x=>`<button class="hs ${x.id===sel?'on':''} ${match(x)?'':'dim'}" style="left:${x.x/MAPW*100}%;top:${x.y/MAPH*100}%" data-act="siteSel" data-id="${x.id}" data-g="${x.id}" aria-label="${x.n}"><i></i><span class="hs-tip">${x.n}</span></button>`).join('')}
      </div></div>
      <div class="gs-sel">
        <div><span class="eyebrow" style="margin-bottom:3px">${REGIONS[G.reg]}</span><b>${G.n}</b><span class="mut">${G.v} · ${G.d}</span></div>
        <button class="btn" data-act="siteGo">${G.id===(S.site||'touquet')?'Rester sur ce golf':'Choisir ce golf'}</button>
      </div>
    </div>
  </div>`;
}
function bindSiteSheet(){
  const inp=$('#gsQ');
  inp.oninput=()=>{
    S.siteQ=inp.value;const q=inp.value.trim().toLowerCase();let any=false;
    GOLFS.forEach(x=>{const ok=!q||(x.n+' '+x.v+' '+REGIONS[x.reg]).toLowerCase().includes(q);any=any||ok;
      $$(`[data-g="${x.id}"]`).forEach(el=>{if(el.classList.contains('hs'))el.classList.toggle('dim',!ok);else el.hidden=!ok})});
    $$('.gs-reg').forEach(r=>r.hidden=![...r.querySelectorAll('.gs-row')].some(b=>!b.hidden));
    $('.gs-none').hidden=any;
  };
  /* survol synchronisé liste ↔ carte */
  $$('[data-g]').forEach(el=>{
    el.onmouseenter=()=>$$(`[data-g="${el.dataset.g}"]`).forEach(x=>x.classList.add('hov'));
    el.onmouseleave=()=>$$(`[data-g="${el.dataset.g}"]`).forEach(x=>x.classList.remove('hov'));
  });
}
ACT.site=()=>{S.siteSel=S.site||'touquet';S.siteQ='';sheet(siteSheet(),'wide');bindSiteSheet()};
ACT.siteSel=a=>{S.siteSel=a.dataset.id;const sc=$('.gs-list').scrollTop;$('#sheet').innerHTML=siteSheet();bindSiteSheet();$('.gs-list').scrollTop=sc;
  const row=$(`.gs-row[data-g="${a.dataset.id}"]`);if(a.classList.contains('hs')&&row)row.scrollIntoView({block:'nearest',behavior:'smooth'})};
ACT.siteGo=()=>{
  const G=golf(S.siteSel);
  if(!G.live){toast(`Prototype : seul Le Touquet est maquetté. ${G.n} utiliserait le même parcours de réservation.`);return}
  closeSheet();
};

/* ═════════ resonance.golf — site vitrine (hors périmètre du moteur) ═════════
   Le client n'arrive plus sur une page d'accueil de golf : il part du site
   actuel, ouvre le menu « Réserver un green-fee », choisit son golf et entre
   directement dans le tunnel de ce golf. */
const RSN_NAV=['Notre univers','Jouer','S\'évader','Se relaxer','Nos offres','Vos événements','Écologie','L\'actu'];
const RSN_HERO='https://www.resonance.golf/wp-content/uploads/2020/07/golf_hardelot_les_dunes_trou_18-1920x1080.jpg';

function langPop(open){
  const el=$('#langPop');
  if(open)el.innerHTML=LANGS.map(([k,n])=>`<button role="menuitem" class="${k==='fr'?'on':''}" data-act="lang" data-v="${k}">${n}<i>${k.toUpperCase()}</i></button>`).join('');

}
ACT.langOpen=()=>langPop($('#langPop').hidden);
ACT.lang=a=>{
  const [k,n]=LANGS.find(l=>l[0]===a.dataset.v);
  langPop(false);
  if(k==='fr')return;
  toast(`Prototype : la version <b>${n}</b> n'est pas maquettée. Le moteur est prévu en cinq langues — français, anglais, allemand, espagnol et néerlandais.`);

/* menu « Réserver » : 1. l'activité, 2. le golf. L'activité d'abord, car
   c'est l'intention du joueur ; le golf n'est qu'un paramètre, pré-rempli
   avec le dernier golf utilisé. */

ACT.rsnMenu=()=>{S.rsnMenu=S.rsnMenu?null:{step:1};render()};

/* ═════════ Liste d'attente green fee ═════════
   Un parcours complet ne doit pas être un cul-de-sac : le joueur connecté se
   fait prévenir dès qu'une place se libère sur ce parcours et ce jour-là.
   Rien n'est réservé ni débité : c'est une alerte, pas une option. */
const MOMLBL={all:'ce jour-là',am:'le matin',pm:'l\'après-midi'};
const MOMLBL2={all:'toute la journée',am:'le matin',pm:'l\'après-midi'};
const gfWaits=()=>{const u=me();return u?(S.res[u.id]||[]).filter(r=>r.pay==='wait'&&r.kind==='gf'&&!r.cancelled):[]};
const waitOf=(k,cid)=>gfWaits().find(r=>r.waitGf&&r.waitGf.d===k&&r.waitGf.crs===cid);
const waitCount=(cid,k)=>2+hash(cid+k+'w')%5;      /* démo : joueurs déjà en attente */
function gfWaitBox(c){
  const u=me(), g=S.gf, id=c?c.id:'all';
  const w=waitOf(g.date,id), n=waitCount(id,g.date);
  return `<div class="wl">
    <div><b>${c?`Aucun départ pour ${plural(g.pax,'joueur')} ${MOMLBL[g.moment]}`:`Les trois parcours sont complets ${MOMLBL[g.moment]}`}</b>
      <span class="mut">${plural(n,'joueur suit','joueurs suivent')} ${c?'ce parcours':'cette journée'} · les annulations sont fréquentes jusqu'à la veille.</span></div>
    ${w?`<div class="row" style="gap:12px"><span class="done-t">✓ Vous êtes en liste d'attente</span><button class="lnk" data-act="waitQuit" data-id="${w.id}">Me désinscrire</button></div>`
      :u?`<button class="btn sm" data-act="gfWait" data-c="${id}">Me prévenir si une place se libère</button>`
        :`<button class="btn sm sec" data-act="login">Me connecter pour être prévenu·e</button>`}</div>`;
}
ACT.gfWait=a=>{
  if(!me()){ACT.login();return}
  const g=S.gf;
  S.wait={crs:a.dataset.c,d:g.date,pax:g.pax,moment:g.moment};
  waitSheet();
};
function waitSheet(){
  const w=S.wait, nm=w.crs==='all'?'Les trois parcours':crs(w.crs).n;
  sheet(shead('Être prévenu si une place se libère','Liste d\'attente')+
   `<p class="sub" style="margin:4px 0 14px">${cap(fday(w.d))} · ${nm} · ${plural(w.pax,'joueur')}</p>
    <div class="sect" style="margin-top:0">Moment qui vous intéresse</div>
    <div class="seg2" style="width:100%">${[['all','Toute la journée'],['am','Matin'],['pm','Après-midi']].map(([k,n])=>`<button class="${w.moment===k?'on':''}" data-act="gfWaitMom" data-v="${k}" style="flex:1">${n}</button>`).join('')}</div>
    <div class="alert soft" style="margin-top:14px"><span class="ic">i</span><div>Vous serez prévenu·e par e-mail et par SMS dès qu'un départ se libère. <b>La place n'est pas réservée</b> et rien n'est débité : il faudra confirmer depuis l'alerte.</div></div>
    <button class="btn full" style="margin-top:14px" data-act="gfWaitGo">M'inscrire à la liste d'attente</button>
    <p class="note">Deux règles restent à trancher avec le client : prévient-on tous les inscrits en même temps (premier arrivé, premier servi) ou donne-t-on une fenêtre de priorité au premier de la liste ? Et jusqu'à quand l'alerte reste-t-elle active — la veille au soir, ou jusqu'au départ ?</p>`);
}
ACT.gfWaitMom=a=>{S.wait.moment=a.dataset.v;waitSheet()};
ACT.gfWaitGo=()=>{
  const u=me(), w=S.wait, all=w.crs==='all', nm=all?'les trois parcours':crs(w.crs).n;
  (S.res[u.id]=S.res[u.id]||[]).push({id:'r'+uid(),kind:'gf',t:'Green fee · '+(all?'Le Touquet · tous parcours':crs(w.crs).n),
    sub:`Liste d'attente · ${plural(w.pax,'joueur')} · ${MOMLBL2[w.moment]}`,
    d:w.d,h:'',pay:'wait',amount:0,waitGf:{...w},fresh:true});
  render();
  /* retour du 29/09 : même confirmation que la compétition, avec accès direct à Mon espace */
  sheet(shead('Vous êtes sur la liste d\'attente','Liste d\'attente')+
   `<p class="sub" style="margin:4px 0 14px;text-align:center">${cap(fday(w.d))} · ${all?'les trois parcours':nm} · ${plural(w.pax,'joueur')} · ${MOMLBL2[w.moment]}</p>
    <div class="checks">
      <div class="ck ok"><span class="ic">1</span><div><b>Rien n'est réservé ni débité aujourd'hui</b></div></div>
      <div class="ck ok"><span class="ic">2</span><div><b>Un départ se libère&nbsp;?</b><small>Vous êtes prévenu·e par e-mail et SMS.</small></div></div>
      <div class="ck ok"><span class="ic">3</span><div><b>Confirmez depuis l'alerte</b><small>La place revient au premier qui confirme et paie.</small></div></div>
      <div class="ck ok"><span class="ic">4</span><div><b>Désinscription en un clic</b><small>Depuis Mon espace, à tout moment.</small></div></div>
    </div>
    <div class="row" style="margin-top:16px"><button class="btn" data-act="myWaits">Voir mes listes d'attente</button><button class="btn ghost" data-act="close">Fermer</button></div>`);
};

   green-fees, voiturettes et carnets de cours. Les tarifs sont à valider. */
const PASSES=[
  {id:'evasion',cat:'Carte du réseau',n:'Carte Évasion',t:'12 mois',img:IMG.mer2,
   sub:'Le tarif préférentiel sur les douze golfs de la Collection toute l\'année, et l\'accès aux compétitions ouvertes.',p:190,d:'−25 % sur les green fees des 12 golfs'},
  {id:'passrgc',cat:'Carte du réseau',n:'Pass Resonance · 5 green fees',t:'12 mois',img:IMG.foret,
   sub:'Cinq green fees à jouer où vous voulez dans la Collection, sans date imposée et transmissibles à vos invités.',p:320,d:'64 € le green fee, au lieu de 90 € en moyenne'},
  {id:'passeport',cat:'Carte du site',n:'Passeport Le Touquet · 3 parcours',t:'3 jours',img:IMG.manoir,
   sub:'La Mer, La Forêt et Le Manoir sur trois jours consécutifs, voiturette comprise la troisième journée.',p:210,d:'Les 45 trous du resort en un seul achat'},
  {id:'b10fm',cat:'Carnet du site',n:'Carnet 10 green fees · La Forêt & Le Manoir',t:'12 mois',img:IMG.links,q:10,u:'green fees',
   sub:'Dix parcours à utiliser quand vous voulez, en semaine comme le week-end, nominatifs ou partagés.',p:390,pNL:560,d:'au lieu de 85 € le green fee à l\'unité'},
  {id:'b10mer',cat:'Carnet du site',n:'Carnet 10 green fees · La Mer',t:'12 mois',img:IMG.mer,q:10,u:'green fees',
   sub:'Le links élu meilleur parcours de France, dix fois dans l\'année.',p:640,pNL:950,d:'au lieu de 120 € le green fee à l\'unité'},
  {id:'b10voit',cat:'Carnet du site',n:'Carnet 10 voiturettes',t:'12 mois',img:IMG.acad,q:10,u:'voiturettes',
   sub:'Dix voiturettes 18 trous, à décompter au moment de réserver votre départ.',p:280,d:'28 € la voiturette, au lieu de 35 €'}];
const pass=id=>PASSES.find(x=>x.id===id);
/* Retour du 28/09 : un carnet de green fees a deux tarifs, licencié FFGolf
   (p) et non licencié (pNL). Le tarif licencié demande une licence connue :
   compte connecté avec licence, ou licence vérifiée avant l'achat (S.gLic). */
const licKnown=()=>{const u=me();return u?!!u.lic:!!S.gLic};
function passPrice(k){
  if(!k.pNL)return {p:k.p,pub:k.p,st:null};
  return licKnown()?{p:k.p,pub:k.pNL,st:'licencie'}:{p:k.pNL,pub:k.pNL,st:null};
}
ACT.passLic=()=>{
  if(me()){ACT.addLic();return}
  sheet(shead('Tarif licencié FFGolf','Carnets de green fees')+
   `<p class="sub" style="margin:4px 0 14px">Connectez-vous, ou renseignez votre licence : elle est vérifiée auprès de la FFGolf et le tarif licencié s'applique tout de suite. Elle sera rattachée au compte créé au moment du paiement (un carnet est nominatif).</p>
    <button class="btn full" data-act="login">Me connecter</button>
    <div class="hr"></div>
    <label class="field"><span>N° de licence FFGolf (9 chiffres)</span><input id="plLic" inputmode="numeric" placeholder="9 chiffres"></label>
    <button class="btn full sec" data-act="passLicGo">Vérifier ma licence</button>`);
};
ACT.passLicGo=()=>{const v=($('#plLic').value||'').trim();if(!/^\d{9}$/.test(v)){toast('Le numéro compte 9 chiffres.');return}
  S.gLic=v;Object.assign(S.co.newAcc,{lic:v,licOk:true,idx:18.0,cert:'2027-04-01'});closeSheet();render();toast('Licence '+v+' vérifiée : tarif licencié appliqué aux carnets.')};
R.pass=()=>{
  const u=me(), st=mySt();
  const card=x=>{const inC=S.cart.some(l=>l.kind==='pass'&&l.id===x.id);
    return `<div class="card lesson" id="pass-${x.id}" style="--lesson-img:url('${x.img}')"><div>
      <div class="row wrap" style="gap:6px"><span class="tag">${x.cat}</span><span class="tag">${x.t}</span></div>
      <b class="h2" style="display:block;margin-top:8px">${x.n}</b>
      <span class="sub" style="display:block;margin-top:4px">${x.sub}</span>
      <div class="mut" style="margin-top:8px">${x.d}</div></div>
      ${x.pNL?passDual(x):`<div class="cside" style="min-width:0"><div class="price">${eur(x.p)}<small>à l'achat</small></div>`}
      ${inC?'<button class="btn sm sec" data-go="panier">Dans votre panier</button>'
           :`<button class="btn sm" data-act="passAdd" data-id="${x.id}">Ajouter</button>`}</div>${adviceHtml(x)}</div>`};
  const grp=c=>PASSES.filter(x=>x.cat===c).map(card).join('');
  $('#v-pass').innerHTML=`
   <div class="band" style="${bg(IMG.links)}"><div><span class="eyebrow">Cartes &amp; Pass</span><h1 class="h1">Jouer <b>plus souvent</b></h1>
     <p class="sub" style="margin-top:6px">Cartes du réseau, carnets de green-fees, voiturettes et carnets de cours : tout ce qui s'achète une fois et se consomme au fil de l'année.</p></div></div>
   ${pbar('les cartes, pass et carnets',['Abonné · −20 % sur les carnets de cours','Réseau Resonance · tarif membre'])}
   <div class="sect">Cartes de la Collection</div>${grp('Carte du réseau')}
   <div class="sect">Cartes et carnets du Touquet</div>${grp('Carte du site')}${grp('Carnet du site')}
   <div class="sect">Carnets de cours</div>
   <div class="grid g3">${CARNETS.map(k=>{const x=lessonPrice(k.p,st), unit=LESSON[k.dur]*k.q, inC=S.cart.some(l=>l.kind==='carnet'&&l.id===k.id);
     return `<div class="card pack"><span class="tag">Valable 12 mois</span><b class="h2">${k.n}</b>
       <span class="sub">Soit ${eur(Math.round(x.p/k.q*100)/100)} le cours au lieu de ${eur(LESSON[k.dur])} à l'unité — ${eur(unit-k.p)} d'économie au prix public.</span>
       <div class="foot"><div class="price" style="text-align:left">${pr(x)}</div>
         <button class="btn sm" data-act="carnetAdd" data-id="${k.id}" ${inC?'disabled':''}>${inC?'Dans le panier':'Ajouter'}</button></div></div>`}).join('')}</div>
   ${u&&Object.keys(u.credits).length?`<div class="alert soft"><span class="ic">i</span><div>${Object.entries(u.credits).map(([d,c])=>`<b>${c.left} cours de ${d==='30'?'30 min':'1 h'}</b> restants sur votre carnet (valable jusqu'au ${fdm(c.end)} ${c.end.slice(0,4)})`).join('<br>')}. Ils s'utilisent directement au moment de réserver un cours.</div><button class="lnk" data-act="spaceTab" data-t="carnets">Voir mes carnets</button></div>`:''}
   <p class="note">Quatrième porte demandée au périmètre de février 2027 (« Acheter : carnets et pass »). Les produits et les tarifs sont des hypothèses : carte Évasion, Pass Resonance, passeport du site, carnets de green-fees, carnet de voiturettes. À valider avec le client, ainsi que deux règles : un carnet est-il nominatif ou partageable, et une carte réseau réécrit-elle les prix immédiatement après l'achat ?</p>`;

/* Retour du 28/09 (test Marc Lefèvre) : prévenir quand un produit n'est pas
   avantageux au regard de la cotisation / du statut, et proposer mieux. */
const DISC={reseau:40,jeune:50,licencie:30};
function passAdvice(k){
  const u=me();if(!u||!u.st.length)return null;
  const wd='2026-10-06', gp=id=>gfPrice(crs(id),wd,u.st).p;
  const lbl=s=>s==='licencie'?'licence FFGolf':s==='jeune'?'tarif Jeune −26 ans':`cotisation « ${stN(s,u)} »`;
  const unit=x=>(x.pNL&&!licKnown()?x.pNL:x.p)/x.q;
  const good=x=>x&&(x.id==='b10fm'?unit(x)<gp('foret'):x.id==='b10mer'?unit(x)<gp('mer'):true);
  const alt=ids=>ids.map(pass).find(good)||pass('passrgc');
  if(k.id==='evasion'){const s=u.st.filter(x=>DISC[x]>=25).sort((a,b)=>DISC[b]-DISC[a])[0];
    if(s)return {why:`vous bénéficiez déjà de −${DISC[s]} % sur les green fees, mieux que les −25 % de la carte`,who:lbl(s),alt:alt(['b10mer','b10fm','passrgc'])}}
  if(k.id==='b10fm'||k.id==='b10mer'){const c=k.id==='b10fm'?'foret':'mer', mine=gp(c);
    if(mine<=unit(k)){const s=u.st.includes('abonne')?'abonne':u.st.slice().sort((a,b)=>(DISC[b]||0)-(DISC[a]||0))[0];
      return {why:mine===0?`${crs(c).n}${c==='foret'?' et Le Manoir sont inclus':' est inclus'} dans votre cotisation`:`vous payez déjà ${eur(mine)} le green fee ${crs(c).n}, contre ${eur(unit(k))} avec le carnet`,who:lbl(s),alt:alt(k.id==='b10fm'?['b10mer','passrgc']:['passrgc'])}}}
  if((k.id==='passeport'||k.id==='b10voit')&&u.st.includes('abonne'))
    return {why:k.id==='passeport'?'La Forêt et Le Manoir sont déjà inclus dans votre abonnement':'la voiturette est déjà incluse dans votre abonnement',who:lbl('abonne'),alt:pass('passrgc')};
  return null;
}

function gcFreeCheck(v,o){
  const min=o.free.min, max=o.free.max, s=String(v||'').replace(/[\s  €]/g,'').replace(',','.');
  const rng=`entre ${eur(min)} et ${eur(max)}`;
  if(!s)return {err:`Saisissez un montant ${rng}.`};
  if(!/^\d+(\.\d+)?$/.test(s))return {err:`« ${gcEsc(v)} » n'est pas un montant. Saisissez un nombre ${rng}, par exemple 80.`};
  const n=Number(s);
  if(n%1)return {err:`Saisissez un montant en euros entiers, sans centimes, ${rng}.`};
  if(n<min)return {err:`Le montant minimum est de ${eur(min)}. Vous avez saisi ${eur(n)} : augmentez le montant ou choisissez ${eur(o.amounts[0])}.`};
  if(n>max)return {err:`Le montant maximum est de ${eur(max)}. Vous avez saisi ${eur(n)} : pour offrir davantage, ajoutez une seconde carte à votre commande.`};
  return {n};
}

const FULL_OVR={'mer|2026-09-27':'all','foret|2026-09-27':'am'};
const SLOT_OVR={'mer|2026-09-24|10:10':3,'mer|2026-09-24|10:30':4,'foret|2026-09-24|09:12':3,'foret|2026-09-24|09:30':4};

function slots(c,k){
  const out=[];
  for(let m=toMin(c.from);m<=toMin(c.to);m+=c.cad){
    const t=toT(m), h=hash(c.id+k+t);
    let free=[4,4,3,2,0,1,4,2,0,3,4,1][h%12];
    if(isWe(k)&&h%3===0)free=0;
    const f=FULL_OVR[c.id+'|'+k];if(f&&(f==='all'||(f==='am')===(toMin(t)<720)))free=0;
    const o=SLOT_OVR[c.id+'|'+k+'|'+t];if(o!=null)free=o;   /* un proche garde son départ */
    out.push({t,free});
  }
  return out;
}

/* 2 lignes de créneaux au plus par parcours, le dernier emplacement
   devenant « Voir plus » (ouvre tous les départs du parcours) */
function clampSlots(){
  $$('#v-gf .gtimes[data-clamp]').forEach(box=>{
    box.querySelectorAll('.gtime.more').forEach(b=>b.remove());
    const items=[...box.children];items.forEach(b=>b.hidden=false);
    const tops=[...new Set(items.map(b=>b.offsetTop))];
    const nr=S.gf.lay==='h'?5:2;
    if(tops.length<=nr)return;
    const row2=tops[nr-1];
    items.forEach(b=>{if(b.offsetTop>row2)b.hidden=true});
    const more=document.createElement('button');
    more.className='gtime more';more.dataset.act='gfMore';more.dataset.c=box.dataset.clamp;box.appendChild(more);
    const vis=()=>items.filter(b=>!b.hidden);
    const lbl=()=>{more.innerHTML=`<b>Voir plus</b><i>+${items.length-vis().length} départs</i>`};
    lbl();
    while(more.offsetTop>row2&&vis().length){vis().pop().hidden=true;lbl()}
  });
}

/* ═════════ Green fee · 2 — joueurs, tarifs & options ═════════ */
function playerInfo(p,i){
  const u=me();
  if(p.type==='self')return u
    ?{n:u.n,you:true,st:u.st,idx:u.idx,sub:u.st.map(s=>stN(s,u)).join(' · ')}
    :{n:'Vous',you:true,st:[],idx:null,sub:'Non connecté·e · prix public',anon:true};
  if(p.type==='acc'){const x=PROFILES[p.id];return {n:x.n,st:x.st,idx:x.idx,sub:'Compte rattaché · '+x.st.map(s=>stN(s,x)).join(' · ')}}
  if(p.type==='lic')return {n:p.n,st:['licencie'],idx:p.idx,sub:'Licence '+p.lic+' · vérifiée FFGolf'};
  return {n:p.n||'Joueur '+(i+1),st:[],idx:null,sub:'Invité·e sans compte · prix public',guest:true};
}
const flightsOf=l=>l.flights&&l.flights.length?l.flights:[{crs:l.crs,t:l.h}];
const crsOfPlayer=(l,p)=>{const f=flightsOf(l)[p.f||0];return crsV(f.crs,f.h9)};
const joinOf=l=>{const j=l.joinWith;return j&&flightsOf(l).some(f=>f.crs===j.crs&&f.t===j.t)?j:null};
/* Retour du 28/09 (Sophie Marchand) : un carnet de green fees se décompte à
   la réservation, sans carte. Carnet La Mer → La Mer ; Forêt & Manoir → ces
   deux parcours. Partageable : on choisit les joueurs qui utilisent un crédit. */
const BOOKFOR={b10mer:['mer'],b10fm:['foret','manoir']};
function myBook(crsId){const u=me();if(!u)return null;
  return (u.passes||[]).find(x=>(BOOKFOR[x.id]||[]).includes(crsId)&&(x.left??pass(x.id).q)>0)||null}
function gfCalc(l){
  const items=[], fl=flightsOf(l), multi=fl.length>1;
  l.players.forEach((p,i)=>{const pi=playerInfo(p,i), c=crsOfPlayer(l,p), bk=(l.book||[]).includes(i);
    items.push({n:pi.n+(pi.you?' (vous)':'')+(multi?` · départ ${(p.f||0)+1}`:'')+(bk?' · 1 crédit carnet':''),...(bk?{p:0,pub:0,st:null,credit:true}:gfPrice(c,l.d,pi.st,(flightsOf(l)[p.f||0]||{}).t)),grp:'gf',f:p.f||0,
      who:pi.n+(pi.you&&!pi.anon?' (vous)':''),lbl:'Green fee '+c.n+(c.h9?' 9 trous':'')+(c.site?' · Golf d\'Hardelot':'')})});
  /* options rattachées à un départ, au tarif du parcours de ce départ */
  const fo=l.fopts||[l.opts||{}];
  fl.forEach((f,k)=>{const c=crsV(f.crs,f.h9), o=fo[k]||{};
    const ps=l.players.map((p,i)=>({p,i,pi:playerInfo(p,i)})).filter(x=>(x.p.f||0)===k), sfx=multi?' · départ '+(k+1):'';
    GOPTS.forEach(op=>{const q=o[op.id]||0;if(!q)return;
      const nm=op.n+(c.nine&&op.id==='voit'?' 9 trous':''), U=optSplit(op,c,ps,q,o);
      const perk=U.filter(u=>u.st), pay=U.filter(u=>!u.st), cfg=op.id==='clubs'?' ('+clubCfg(o,q).map(clubTxt).join(', ')+')':'';
      perk.forEach(u=>items.push({n:`${nm} · ${op.per==='voit'?'abonnement de ':''}${u.who}${sfx}`,p:u.p,pub:u.pub,st:u.st,who:u.who+(u.you?' (vous)':''),lbl:op.per==='voit'?nm+' prise avec l\'abonnement':nm,grp:'gf',f:k,opt:true}));
      if(!pay.length)return;

      items.push({n:perk.length
          ?(op.per==='voit'||names.length<pay.length?`${nm} × ${pay.length}${sfx}`:`${nm} · ${names.join(', ')}${cfg}${sfx}`)
          :`${nm} × ${q}${cfg}${sfx}`,
        p:Math.round(P*100)/100,pub:Math.round(pay.reduce((t,u)=>t+u.pub,0)*100)/100,st:null,grp:'gf',f:k,opt:true});
    })});

/* index maximum : contrôlé joueur par joueur, sur le parcours de son départ */
function gfIdxState(){

  const info=g.players.map((p,i)=>({...playerInfo(p,i),c:crsOfPlayer(line,p)})).filter(x=>x.c.idxMax);
  if(!info.length)return {need:false};
  const over=info.filter(x=>x.idx!=null&&x.idx>x.c.idxMax);

  return {need:true,over,unknown,c:info[0].c,ok:!over.length&&(!unknown.length||g.idxOk)};

R['gf-joueurs']=()=>{

function partnerInfo(p){
  if(!p)return null;
  if(p.type==='acc'){const x=PROFILES[p.id];return {n:x.n,st:x.st,idx:x.idx,lic:x.lic,cert:x.cert,dob:x.dob,ini:x.ini}}
  return {n:p.n,st:['licencie'],idx:p.idx,lic:p.lic,cert:'2027-06-30',dob:null,ini:'FF'};
}
function eligibility(cp,x,who){
  const ck=[], you=who==='you';
  if(!x)return [{ok:false,n:'Compte requis',d:'L\'inscription vérifie la licence, le certificat et l\'index : elle se fait depuis un compte.',fix:'login',fixN:'Me connecter'}];
  ck.push(x.lic
    ?{ok:true,n:'Licence FFGolf 2026 valide',d:'N° '+x.lic}
    :{ok:false,n:'Aucune licence FFGolf',d:'Une licence de l\'année est obligatoire pour toute compétition fédérale.',fix:you?'addLic':null,fixN:'Ajouter ma licence'});
  if(x.lic)ck.push(certOk(x,cp.date)
    ?{ok:true,n:'Certificat médical valide le jour J',d:'Valable jusqu\'au '+fdm(x.cert)+' '+x.cert.slice(0,4)}
    :{ok:false,n:'Certificat médical expiré',d:'Expiré le '+fdm(x.cert)+' '+x.cert.slice(0,4)+'. Il doit couvrir la date de la compétition ('+fdm(cp.date)+').',fix:you?'cert':null,fixN:'Déposer un certificat'});
  if(x.idx!=null)ck.push(x.idx<=cp.idxMax
    ?{ok:true,n:'Index '+fidx(x.idx)+' — limite '+cp.idxMax,d:'Index relevé à la FFGolf ce matin.'}
    :{ok:false,n:'Index '+fidx(x.idx)+' supérieur à la limite de '+cp.idxMax,d:'L\'inscription n\'est pas possible. Elle le redeviendra si l\'index descend sous '+cp.idxMax+' avant la clôture du '+fdm(cp.close)+'.'});
  if(cp.minAge&&x.dob){const a=ageAt(x.dob,cp.date);ck.push(a>=cp.minAge
    ?{ok:true,n:'Réservée aux '+cp.minAge+' ans et plus',d:a+' ans le jour de l\'épreuve'}
    :{ok:false,n:'Réservée aux '+cp.minAge+' ans et plus',d:a+' ans le jour de l\'épreuve.'})}
  if(cp.maxAge&&x.dob){const a=ageAt(x.dob,cp.date);ck.push(a<=cp.maxAge
    ?{ok:true,n:'Réservée aux '+(cp.maxAge+1)+' ans et moins',d:a+' ans le jour de l\'épreuve'}
    :{ok:false,n:'Réservée aux moins de '+(cp.maxAge+1)+' ans',d:a+' ans le jour de l\'épreuve.'})}
  return ck;
}
const eligOk=ck=>ck.every(c=>c.ok);
function compRegistered(cp){
  const u=me();if(!u)return null;
  const r=(S.res[u.id]||[]).find(r=>r.kind==='comp'&&r.compId===cp.id||r.kind==='comp'&&r.t===cp.n);
  if(r&&!r.cancelled)return r.pay==='wait'?'wait':'in';
  if(S.cart.some(l=>l.kind==='comp'&&l.compId===cp.id))return 'cart';
  return null;
}

function compList(){
  const u=me(), f=S.comp;
  return COMPS.filter(cp=>{const g=compSite(cp);
    if(f.scope==='site'&&cp.site!=='touquet')return false;
    if(f.scope==='region'&&g.reg!==f.reg)return false;
    if(f.scope!=='site'&&f.site!=='all'&&cp.site!==f.site)return false;
    if(f.fk!=='all'&&cp.fk!==f.fk)return false;
    if(f.mine&&!(u&&eligOk(eligibility(cp,u,'you'))))return false;
    return true}).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
}

function compPlanning(list){
  const [y,m]=S.comp.month.split('-').map(Number), first=new Date(y,m-1,1), nd=new Date(y,m,0).getDate();
  const lead=(first.getDay()+6)%7, key=dd=>`${y}-${String(m).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
  const inMonth=list.filter(cp=>cp.date.slice(0,7)===S.comp.month);
  const cells=[];for(let i=0;i<lead;i++)cells.push('<div class="cal-d out"></div>');
  for(let dd=1;dd<=nd;dd++){const k=key(dd), ev=inMonth.filter(cp=>cp.date===k), dt=dobj(k);
    cells.push(`<div class="cal-d ${ev.length?'':'empty'} ${dt.getDay()%6===0?'we':''}"><span class="cal-n"><b>${dd}</b><i>${DAYS[dt.getDay()]}</i></span>
      ${ev.map(cp=>{const reg=compRegistered(cp), full=isFull(cp);
        return `<button class="cev ${cp.site==='touquet'?'here':''} ${reg?'reg':''}" data-act="compOpen" data-id="${cp.id}" title="${cp.n} · ${compSite(cp).n}">
          <span class="cev-h">${cp.h.replace(':',' h ')}${reg==='in'?' · ✓ inscrit·e':reg==='wait'?' · liste d\'attente':reg==='cart'?' · au panier':full?' · complet':''}</span>
          <b>${cp.n}</b><span class="cev-s">${compSite(cp).n} · ${fkN(cp.fk)}</span></button>`}).join('')}</div>`)}
  while(cells.length%7)cells.push('<div class="cal-d out"></div>');
  const months=['2026-10','2026-11','2026-12'], mi=months.indexOf(S.comp.month);
  return `<div class="card cal">
    <div class="cal-h"><button class="ico" data-act="compMonth" data-n="-1" ${mi<=0?'disabled':''} aria-label="Mois précédent">‹</button>
      <b class="h3">${cap(MONTHS[m-1])} ${y}</b><span class="mut">${plural(inMonth.length,'compétition')}</span>
      <button class="ico" data-act="compMonth" data-n="1" ${mi>=months.length-1?'disabled':''} aria-label="Mois suivant">›</button></div>
    <div class="cal-g">${['Lun.','Mar.','Mer.','Jeu.','Ven.','Sam.','Dim.'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells.join('')}</div>

    <div class="cal-leg"><span><i class="here"></i>Le Touquet</span><span><i></i>Autres golfs du groupe</span></div>
  </div>`;
}

function lessonSlots(pro,k,dur){
  if(!PROS[pro].days.includes(wday(k)))return [];
  const out=[];
  for(let m=540;m+dur<=1080;m+=30){
    const t=toT(m);
    if(k===TODAY&&t<='11:30')continue;         /* déjà passé aujourd'hui */
    if(m>=720&&m<840)continue;                 /* pause déjeuner du pro */
    if(hash(pro+k+t)%5<2)continue;             /* déjà réservé */
    if(S.cart.some(l=>l.kind==='ind'&&l.pro===pro&&l.d===k&&l.h===t))continue;
    out.push({t,th:[null,'Putting','Petit jeu','Approche','Long jeu','Obstacles',null][hash(pro+k+t+'th')%7]});
  }
  return out;
}

/* Détail des réductions (retour du 24/09) : jamais un seul montant agrégé.
   Chaque tarif statut est regroupé par personne, avec ce qu'il change ligne
   à ligne ; le code promo et l'avoir restent des lignes à part. */
function discounts(){
  const u=me(), G={}, promo=[];
  S.cart.forEach(l=>{const v=lineView(l);
    v.items.forEach(i=>{if(i.credit||!(i.p<i.pub))return;
      const who=i.who||(u?u.n+' (vous)':''), key=who+'|'+i.st, g=G[key]||(G[key]={who,st:i.st,amt:0,rows:[]});
      g.amt+=i.pub-i.p;
      const lbl=i.lbl||(v.items.length>1?v.title+' — '+i.n.toLowerCase():v.title);
      (g.items=g.items||[]).push({lbl,p:i.p,pub:i.pub});
      g.rows.push(`${lbl} : ${i.p===0?'inclus':eur(i.p)+' au lieu de '+eur(i.pub)}`)});
    if(v.promo)promo.push(`${v.title} : −${eur(v.promo)}`)});
  return {st:Object.values(G),promo};
}
/* le tarif gagné en créant son compte pendant l'achat reste signalé tant
   que ce panier n'est pas réglé, et passe en tête du détail */
const isNewSt=g=>!!(S.newSt&&S.newSt.id===S.user&&S.newSt.st.includes(g.st)&&/\(vous\)$/.test(g.who||''));
const dscSort=L=>L.slice().sort((a,b)=>isNewSt(b)-isNewSt(a));
/* Panier structuré par personne (proposition de Stéphane, 28/09) :
   produit · prix de référence · taux de remise · prix · tarif appliqué. */
function lineTable(l,v,pm){
  const u=me(), strip=n=>(n||'').replace(/ \(vous\)$/,'');
  const prod=i=>{if(l.kind!=='gf')return i.n;
    if(!i.opt)return i.lbl||i.n;
    return (i.lbl||i.n).replace(/ prise avec l'abonnement$/,'').replace(/ · départ \d+$/,'')+(/ × \d+/.test(i.n)?' × '+i.n.match(/ × (\d+)/)[1]:'')};
  const G=[];v.items.forEach(i=>{const k=l.kind==='gf'?(i.who?strip(i.who):'Pour le groupe'):'';
    let g=G.find(x=>x.k===k);if(!g)G.push(g={k,items:[]});g.items.push(i)});
  const pct=i=>i.pub>0&&i.p<i.pub?Math.round((1-i.p/i.pub)*100)+' %':'—';
  const pour=(i,k)=>i.credit?'Crédit carnet':i.free?'À régler sur place':i.st?'Tarif '+stN(i.st,stOfName(k)||(k?null:u)):i.pub>0?'Prix public':'—';
  const row=(i,k)=>`<tr><td>${prod(i)}<div class="lt-st">${pour(i,k)}</div></td><td class="r">${i.free||i.credit?'—':eur(i.pub)}</td><td class="r hide-s">${pct(i)}</td>
    <td class="r"><b>${i.free?'Sur place':i.credit?'1 crédit':i.p===0&&i.pub>0?'0,00 €':eur(i.p)}</b></td><td class="lt-p hide-s">${pour(i,k)}</td></tr>`;
  const P=v.items.reduce((t,i)=>t+i.pub,0);
  return `<div class="ltw"><table class="ltab"><thead><tr><th>Produit</th><th class="r">Prix de référence</th><th class="r hide-s">Remise</th><th class="r">Prix</th><th class="hide-s">Tarif appliqué</th></tr></thead><tbody>
    ${G.map(g=>`${g.k?`<tr class="lt-g"><td colspan="5">${g.k==='Pour le groupe'?g.k:'Pour '+g.k}</td></tr>`:''}${g.items.map(i=>row(i,g.k)).join('')}`).join('')}
    ${v.promo?`<tr><td>${pm.n}</td><td class="r"></td><td class="r hide-s"></td><td class="r"><b>−${eur(v.promo)}</b></td><td class="hide-s"></td></tr>`:''}
    <tr class="lt-t"><td>Total</td><td class="r">${eur(P)}</td><td class="hide-s"></td><td class="r">${eur(v.total-v.promo)}</td><td class="hide-s"></td></tr></tbody></table></div>`;
}

function cartTotals(){
  let pub=0,sub=0,promo=0;
  let paid=0;
  S.cart.forEach(l=>{const v=lineView(l);pub+=v.pub;sub+=v.total;promo+=v.promo;v.items.forEach(i=>{if(i.paid)paid-=i.p})});
  const u=me();
  const after=sub-promo;
  /* en lien de paiement partagé, l'avoir du team leader ne s'impute pas sur le groupe */
  const avoir=u&&u.avoir&&S.useAvoir&&S.co.pay!=='link'?Math.min(u.avoir,after):0;
  return {pub:pub+paid,paid,sub,save:pub-sub,promo,avoir,due:Math.max(0,Math.round((after-avoir)*100)/100)};
}
/* Retour à la porte d'entrée du parcours concerné : on continue à chercher
   là où l'on était, sans risquer d'ajouter deux fois la même ligne. */
const BACKTO={gfx:'espace',gf:'gf',comp:'comp',ind:'cours',coll:'cours',stage:'cours',carnet:'pass',pass:'pass'};

  if(BACKTO[l.kind]==='cours')S.cours.tab=l.kind;   /* onglet d'origine : ind / coll / stage */
  go(BACKTO[l.kind]||'gf');

  else{bump();toast(`✓ <b>${lineView(l).title}</b> ajouté à votre panier · total <b>${eur(cartTotals().due)}</b>`)}
}

/* Retour du 28/09 : bandeau complet à la première apparition (tiroir du

   sous les 2 dernières minutes. L'expiration reste un bandeau rouge complet. */
function holdHtml(){
  if(!gcHoldOn())return '';   /* bons cadeaux · lot B2 : un bon ne bloque pas de place */
  if(!holdDead&&holdIntroDone)return `<div class="hold mini ${hold<=120?'soon':''}" data-hold title="Vos places sont bloquées pour vous jusqu'à la fin du chrono. La réservation n'est confirmée qu'au paiement.">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
    <span>Places bloquées <b class="holdTimer">${mmss(hold)}</b></span><button class="lnk" data-act="holdSim" title="Démo">simuler la fin</button></div>`;
  if(!holdDead)holdIntro=true;
  return `<div class="hold ${holdDead?'dead':''}" data-hold><span class="node" style="border-style:solid">Maintien</span>${holdDead
    ?`<span><b>Délai dépassé</b> — les places ne sont plus bloquées pour vous. Les lignes restent dans votre panier : il suffit de revérifier les disponibilités.</span>
      <button class="btn sm sec" data-act="holdRecheck">Revérifier</button>`
    :`<span>Vos places sont <b>bloquées pour vous</b> encore <b class="holdTimer">${mmss(hold)}</b>. Elles sont dans votre panier : la réservation n'est confirmée qu'au paiement.</span>
      <button class="lnk" style="font-size:12px" data-act="holdSim">Simuler l'expiration</button>`}</div>`;
}
function paintHold(){$$('[data-hold]').forEach(el=>{el.outerHTML=S.cart.length?holdHtml():''})}
setInterval(()=>{
  if(!S||!S.cart.length||!gcHoldOn())return;   /* bons cadeaux · lot B2 */
  if(hold>0){hold--;if(!hold){holdDead=true;paintHold()}}
  $$('.holdTimer').forEach(e=>e.textContent=mmss(hold));
  $$('.hold.mini').forEach(e=>e.classList.toggle('soon',hold<=120));
},1000);
ACT.holdSim=()=>{hold=1};
ACT.holdRecheck=()=>{hold=HOLD;holdDead=false;paintHold();toast('Disponibilités revérifiées : toutes vos lignes sont encore disponibles.')};
